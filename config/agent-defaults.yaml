# Global defaults for every agent node. Source: docs/research/claude-agent-sdk.md (sections 3, 12, 14, 15, 16, 18.5).
# Values set by the owner. `squad run --adapter sdk` loads the engine-level keys per invocation and records the file hash. A node or graph value always wins over it.
# How it reaches a node : engine-level keys (permission_mode, setting_sources, plugins, system_prompt,
# env, hooks, auth, log, token limits) load per invocation and are recorded in run_start. Node-level keys (model, effort, stalls,
# spend, deadline, tools, skills, run block) are an authoring-time scaffold: they are copied into the graph document, so the hash covers them.
# Precedence, lowest first: this file, `roles`, the graph `run` block, the node. A layer may only narrow a cap.
# Keys under `options` are ClaudeAgentOptions field names; `env` merges over the process environment.

version: 1

options:
  model: claude-deepseek-flash   # owner ruling 2026-10-13: no Anthropic model until the quota resets; record init.data["model"] in every run log
  fallback_model: null              # alias or full id; unset means no fallback
  effort: medium                    # low | medium | high | max; Sonnet 5.5 API default is high
  thinking: null                    # supersedes max_thinking_tokens; unset keeps the model default
  permission_mode: bypassPermissions  # owner ruling. allowed_tools then restricts nothing (G7): read-only roles use disallowed_tools
  setting_sources: [project]        # the target project's CLAUDE.md, ADRs and rules load and take precedence over ours
  plugins:                          # owner ruling: researched skills are always available, from a vendored copy
    - {type: local, path: vendor/skills}   # versioned copy; rebuild with scripts/build_vendor_skills.py, check with --check
  system_prompt:
    type: preset
    preset: claude_code             # the SDK default omits the preset and its safety text
    append_file: prompts/_contract.md   # role file is appended per node
  tools: null                       # G6: a restricted `tools` list broke haiku; use disallowed_tools
  allowed_tools: [Read, Grep, Glob] # auto-approve only; it does not restrict (G7)
  disallowed_tools: [WebFetch, WebSearch, Task, Agent]   # panel ruling: no subagent in any role (G3, G13); a role list replaces this one
  skills: []                        # pin per node (docs/research/role-skill-map.md); [] loads none
  strict_mcp_config: true           # ignore .mcp.json and plugin servers
  enable_file_checkpointing: false
  include_partial_messages: false   # true only for the playground
  include_hook_events: false
  forward_subagent_text: false
  verbatim_prompts: false           # true turns off @path and slash-command expansion

limits:                             # every session gets all three caps (G5)
  max_stalls: 2                      # PROVISIONAL (ADR-0012, ADR-0018): a first guess. It counts failed attempts at one step (a Bash command, a file) with the same failure each time; a changed failure or a success restarts it. Total turns are never capped: spend and the deadline bound a call. Owner ruling 2026-11-03: the floor of the range, so a retry loop over one failing step ends early
  max_budget_usd: 2.0               # includes subagent spend; checked after a response, so spend can pass it
  max_output_tokens: 32000          # per response; passed as env CLAUDE_CODE_MAX_OUTPUT_TOKENS. Probed: a longer response ends the call (error after a result); the engine records node_output_cap (docs/research/limits-probe.md)
  context_tokens: 200000            # context size; an agent cannot call /compact (a CLI built-in), so the CLI compacts at this size; passed as env CLAUDE_CODE_AUTO_COMPACT_WINDOW. Probed: it sets the window; auto-compact fires 33000 below it; values under 100000 clamp up (the checker refuses them)
  task_budget: null                 # soft, API-side token budget; the only token cap in the SDK options
  deadline_seconds: 600             # engine wall clock per call; the SDK has no such option
  no_progress_seconds: 300          # silence of one call's upstream before its chain entry ends and the chain moves on (#1289); a call with a tool open is not silent. The node deadline still bounds the whole chain

run:                                # mirrors the graph run block (schema run_block)
  deadline: null                    # owner ruling: no run cap; runs may last days. The per-call deadline bounds each agent. The schema accepts null.
  max_parallel: 20                  # safe: each item and each writing dispatch child gets its own worktree
  spend_cap: 25.0

caps:                               # machine-wide, across every repository and every run (squad/caps.py); not the per-run pair run.max_parallel and dispatch max_children
  runs: 10                          # live runs on this machine; a run above it waits for a slot, bounded by the run deadline
  children: 20                      # live dispatch children on this machine; a child above it waits, bounded by its call deadline
  gates: 12                         # gate worker slots on this machine: a gate takes SG_GATE_WORKERS of them, all or none, after it takes the gate lock; a project may lower it, and a gate then takes min(workers, this)
  reviews: 4                        # live reviews on this machine, branch and child alike: a childcc review that finds none skips this pass, a branch review waits

columns:                            # the card limit of each board column (#2287), a whole number from 1 to 100 or none; a project may change one in docs/squad/defaults.yaml
  Todo: {max_cards: null}           # a waiting card holds no machine
  Doing: {max_cards: 6}             # six cards may be in flight at once
  Review: {max_cards: 4}            # caps.reviews 4
  Landing: {max_cards: null}        # a landing is one fast-forward push and holds no machine
  Gating: {max_cards: null}         # caps.gates bounds the gate workers, and one wave gate carries all the cards of its wave

dashboard:                          # the run dashboard page; run_start records it, the page reads it from the record
  reread_seconds: 1                 # how often the page rereads record.jsonl while a run lives. The page has no control for it. The page uses 1 when a record lacks it.
  watch_seconds: 0.2                # how often the server stats the record path while a stream is open. A pushed event follows a write within this step. A record from before it, or a file:// page, uses reread_seconds.

tailnet:                            # the project file's tailnet block; its edits never refuse a resume (squad/project_settings.py)
  host: null                        # MagicDNS name of this machine; unset refuses every tailnet request
  allow: []                         # login names in email form; empty refuses every tailnet request
  terminals_read: false             # the tailnet may read the scrollback of a hosted session, for every allowed login; off until the owner sets it true (SQUAD_TAILNET_TERMINALS_READ)
  terminals_attach: false           # the tailnet may attach to and detach from a hosted session, for every allowed login; off until the owner sets it true (SQUAD_TAILNET_TERMINALS_ATTACH)
  terminals_send: false             # the phone may send a message to a live session of this profile, for every allowed login; off until the owner sets it true
  loop_write: false                 # the tailnet may start and stop the loop from the hub; off, the switch is read-only from the tailnet (SQUAD_TAILNET_LOOP_WRITE)
  profiler_write: false             # the tailnet may turn the hub's CPU sampling on and off; off, that switch is read-only from the tailnet (SQUAD_TAILNET_PROFILER_WRITE)
  board_priority_write: false       # the tailnet may set a card's Priority from the hub; off, that write is refused from the tailnet (SQUAD_TAILNET_BOARD_PRIORITY_WRITE)

watch:                              # what starts with a run from `work` or `task`
  dashboard: true                   # open the run dashboard page on the new run. A headless environment prints the URL. A failed open is a warning, never a verdict. A resume reuses a page already open.
  monitor: true                     # a run-scoped monitor reads the record on a timer and logs a stuck, abandoned or deadline-missed call to monitor.log in the run folder and to the command output. It never calls a model and never changes the run.
  monitor_seconds: 30               # how often the monitor looks (5 to 600)

progress:                           # what the record holds while a call is in flight: one `progress` event with the assistant
  seconds: 10                       # messages so far, the context the newest one read and the last tool. At most one per call per this many seconds; null writes none.

autonomy:                           # anything that needs a human or a decision goes to /autonomy first. run_start records both values; a resume refuses when one differs.
  enabled: true                     # plugin default on; the owner turns it off per project
  max_resumes: 3                    # automatic resumes after a needs-human end; 0 to 10

janitor:                            # the janitor's own bounds; a project may change them in docs/squad/defaults.yaml
  spec_stall_seconds: 86400         # a spec whose open tickets make no dev commit for this long raises one SPEC-STALL alert per bound (one day)

claude_md:                          # `squad setup --check` flags ledger content in CLAUDE.md. A project may change both in docs/squad/defaults.yaml.
  max_line_width: 300               # PROVISIONAL: a first guess, not measured. It holds until a labeled sample of real CLAUDE.md files supports a value.
  max_section_lines: 40             # PROVISIONAL, same status as max_line_width

dispatch:                           # subagent fan-out (section 14)
  max_depth: 3                      # owner ruling; same as the SDK default
  max_concurrency: 20               # SDK default 20

hooks:
  log_compaction: true              # owner ruling: a PreCompact hook logs each compaction to the run record. Auto-compact stays on at limits.context_tokens.
  timeout_seconds: 60               # G12: docs disagree (60 or 600); set it on every HookMatcher

env:
  CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH: "3"
  # CLAUDE_CODE_MAX_OUTPUT_TOKENS and CLAUDE_CODE_AUTO_COMPACT_WINDOW come from limits.max_output_tokens and
  # limits.context_tokens. The adapter sets them per call. No ClaudeAgentOptions field sets either.
  # Multi-tenant runs also need CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1" and setting_sources: [].

auth:
  source: local-login               # ANTHROPIC_API_KEY or Bedrock/Vertex/Foundry flags are credentials: owner-only
  # The SDK does not read .env files. Never store a key in this file.

log:                                # record these in every run (G14, section 12.2)
  record_init_fields: [model, claude_code_version, apiKeySource]
  spend_source: total_cost_usd      # a client estimate, not billing; do not sum across resumes. A model in `prices` spends price_table; the outcome names its source.

prices:                             # USD per 1M tokens. One place for the price of a gateway model the SDK cannot price (squad/prices.py).
  client: {input: 3.0, cache_read: 0.30, cache_write: 3.75, output: 15.0}   # the Claude rates the SDK borrows for a model it does not know (Sonnet); they scale the SDK budget of a priced call
  models:                           # keyed by the model id the run records; a model with no entry keeps total_cost_usd
    claude-deepseek-flash: {input: 0.30, cache_read: 0.006, cache_write: 0.30, output: 1.20}   # DeepSeek V4.1 Flash, peak price, so a cap never under-counts; cache write is the miss price
    claude-deepseek-flash:    {input: 0.30, cache_read: 0.006, cache_write: 0.30, output: 1.20}   # DeepSeek V4.1 Flash under its own API id (deepseek-flash); v4-flash above is the legacy alias
    claude-qwen3.8-flash:     {input: 0.15, cache_read: 0.016, cache_write: 0.20, output: 0.47}   # Qwen3.8 Flash on OpenCode Go (opencode.ai/docs/go); runs only with an OpenCode Go key (#482, provkey.py)
    claude-gpt-5.6-terra:     {input: 2.00, cache_read: 0.20, cache_write: 2.00, output: 12.00}   # GPT-5.6 Terra runs on the owner's subscription: this is its API-equivalent price, so a cap reads its own rates, never the Claude client rates; cache write is the miss price

roles:                              # per-role overrides; a key here replaces the same key above. Read-only roles drop the write tools.
  scout:         {allowed_tools: [Read, Grep, Glob, Bash], disallowed_tools: [WebFetch, WebSearch, Task, Agent, Edit, Write, NotebookEdit]}
  spec_draft:    {allowed_tools: [Read, Grep, Glob], disallowed_tools: [WebFetch, WebSearch, Task, Agent, Edit, Write, NotebookEdit]}
  spec_proxy:    {allowed_tools: [Read, Grep, Glob], disallowed_tools: [WebFetch, WebSearch, Task, Agent, Edit, Write, NotebookEdit]}
  decompose:     {allowed_tools: [Read, Grep, Glob], disallowed_tools: [WebFetch, WebSearch, Task, Agent, Edit, Write, NotebookEdit]}
  plan_proxy:    {allowed_tools: [Read, Grep, Glob], disallowed_tools: [WebFetch, WebSearch, Task, Agent, Edit, Write, NotebookEdit]}
  actor:         {allowed_tools: [Read, Grep, Glob, Edit, Write, Bash], disallowed_tools: [WebFetch, WebSearch, Task, Agent], skills: [tdd]}
  critic:        {allowed_tools: [Read, Grep, Glob, Bash], disallowed_tools: [WebFetch, WebSearch, Task, Agent, Edit, Write, NotebookEdit]}
  visual_actor:  {allowed_tools: [Read, Grep, Glob, Bash], disallowed_tools: [WebFetch, WebSearch, Task, Agent, Edit, Write, NotebookEdit], skills: [ego-browser]}
  visual_critic: {allowed_tools: [Read, Glob], disallowed_tools: [WebFetch, WebSearch, Task, Agent, Edit, Write, NotebookEdit]}
  audit:         {allowed_tools: [Read, Grep, Glob], disallowed_tools: [WebFetch, WebSearch, Task, Agent, Edit, Write, NotebookEdit], skills: [codebase-design]}
  router:        {allowed_tools: [Read, Grep, Glob], disallowed_tools: [WebFetch, WebSearch, Task, Agent, Edit, Write, NotebookEdit]}
