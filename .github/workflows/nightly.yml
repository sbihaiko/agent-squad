name: nightly

on:
  # 04:00 America/Sao_Paulo is 07:00 UTC. A schedule is not a branch push, so the no-push rule of ci.yml holds.
  schedule:
    - cron: "0 7 * * *"

# The GitHub half of the nightly (ADR-0153): the complete Linux suite on the dev tip, heavy tests included, in both modes,
# by the shard commands of the complete tier in ci.yml. The token is read-only. One job reads the dev tip once, and every
# shard checks out that one sha, because dev moves between two checkouts. The sha is the name of an artifact, so the local
# half reads the tested sha through the gh door with no download, and it combines the two halves into one verdict.
permissions:
  contents: read

jobs:
  dev-sha:
    name: dev-sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - id: tip
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha" > dev-sha.txt
          echo "nightly dev sha: $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-dev-sha-${{ steps.tip.outputs.sha }}
          path: dev-sha.txt
          retention-days: 7

  full-xdist-1:
    name: full-xdist-1
    needs: [dev-sha]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SQUAD_CI_RUNNER: "1"   # a runner without the host repo or node: each deselected test prints its id and reason
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.dev-sha.outputs.sha }}
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev,sdk]'
      - run: python3 -m pytest -n auto $(python3 tests/ci_shards.py 1)

  full-xdist-2:
