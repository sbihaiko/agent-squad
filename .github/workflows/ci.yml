name: ci

on:
  push:
    branches: [main]
  pull_request:

# A push to a pull request branch supersedes the run before it: the branch is rewritten many times an hour, and every
# push started two jobs that then waited for a runner. The newest commit of a branch is the one that runs; a push to
# main keeps its own run, so every landing on main keeps its evidence. No run outlives twenty minutes (#128).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: ruff check squad tests
      - run: mypy squad
      - run: python3 -m pytest -n auto
      - name: GUI test squad e2e suite
        # No MesenAI checkout is on the runner: the host-bound tests are deselected (ADR-0139) and their removal is
        # reported by name. The host-free tests in the file still run. The gate step above keeps its own command.
        run: python3 -m pytest tests/test_gui_test_e2e.py -q
