name: ci

on:
  pull_request:
    branches: ["stg", "main"]
    # A push to dev reaches the dev-to-stg pull request as `synchronize`; the `promote` label on the stg-to-main pull
    # request is the promotion request for main.
    types: [opened, synchronize, reopened, labeled]

# CI runs on the two pull requests a promotion moves through. The fast tier runs on the dev-to-stg pull request, and the
# complete tier on the stg-to-main pull request. The fast tier is ruff, mypy and the fast battery, three jobs each on Python
# 3.13, and it runs on every event of the dev-to-stg pull request but the label, a push included: a green fast tier on the
# dev tip is the whole CI proof for stg. The complete tier is the full suite on 3.13 with `-n auto`, the full suite on 3.13
# serial, the fast battery on 3.11 and the GUI e2e suite. It runs on the work stg gathered, never on each promotion to stg:
# the loop opens one pull request from stg to main, and the `promote` label on it starts the tier once on the tip it
# carries. Main moves only when that tier is green, by a fast-forward; the pull request carries the check and is never
# merged. A job names the head of its pull request, `github.head_ref`, and never the base: the fast tier gates on `dev`,
# the complete tier on `stg`, so the label on the dev-to-stg pull request starts nothing, and a push to stg starts nothing.
# No branch push starts a run; a work branch is proven by the local fast gate, and a landing by the promotion proof. A pull
# request of any other head starts nothing, because each job's own condition refuses it.
# Each tier's jobs have no `needs:` between them, so they start together and the pull request reports in the time of the
# slowest one. The one `needs:` is the complete tier's read of `complete-guard`, which starts the tier once per tip: it is
# the tier's entry, never a sibling it waits behind, and the twelve shard jobs still start together. The guard counts a run
# that measured something or is still in flight; a run that ended cancelled or timed out measured nothing, so it does not
# stop the tier, and a tip the promotion calls unproven can be proven again. The guard and the promotion read that set
# from one seam, `promote-pass.sh --ci-unproven-conclusions`. The fast-battery job carries one explicit GUI e2e run beside
# the battery: the battery's `-m "not heavy"` leaves that file's `heavy` tests out. The complete tier's GUI e2e job carries
# them alone. On each tier the host-bound tests are deselected by name (ADR-0139), and the complete tier also simulates a
# runner (SQUAD_CI_RUNNER=1), so every deselected test prints its id and reason in the job log (#1323).
# The full-suite shard jobs install `.[dev,sdk]`: the hosted terminal case starts a real hosted session, and the supervisor
# refuses that start when its interpreter cannot import claude_agent_sdk. The runner can carry the sdk, so the case runs
# there and is not deselected (#1538).
# The heavy tests run inside the full-suite shard jobs. No job runs a Python x mode x shard matrix: a matrix over one job
# split a commit into legs that waited behind each other for runners (#149), and a check no runner picks up answers
# nothing. A complete-tier job that takes over fifteen minutes on a real run is split by test path into sibling jobs, each
# with its own check-run name, never into matrix legs (ADR-0163). The full suite is that split: twelve sibling jobs, one
# per shard per mode, each well inside its twenty minutes on a runner (#1518).
# A newer tip ends the fast tier of an older tip: the fast tier's group names the pull request's branch, and a new push
# cancels the run in progress, so one pull request holds one fast run, of its newest tip, and never two (owner).
# The complete tier keeps its run: a labeled event's group names the commit and cancels nothing, so a promotion request
# is never cancelled by a push.
# No job outlives the twenty minutes it gives itself (#128). The fast-battery jobs run `-m "not heavy"`.
# The full suite's shard partition is tests/ci_shards.py, and each shard job asks that one module for its files: every test
# file is in exactly one shard, in both modes, and tests/test_tooling.py fails when a file is in no shard or in two. A new
# test file is assigned there before a green shard set can stand for the full proof.
# promote-pass.sh reads the fast tier's job names in this file as the checks the dev-to-stg tip waits on: the jobs whose
# `if` does not ask for the label. It refuses the promotion by name when a job is gated on `base_ref`: such a job never
# runs on that pull request, so the dev tip could never prove it. promote-main-pass.sh reads the complete tier's job names
# the same way, the jobs that wait on the guard, and reads their runs on the sha it requested. A check run another event
# skipped is no evidence of either tier.
# Which branch supplies this file: a pull_request run executes the workflow of the pull request's merge commit, so the
# head branch supplies it: stg carries the complete tier before the first stg-to-main request, the promote label starts
# the tier from stg's copy, and main takes that same file in the fast-forward that moves it. The trigger reads the base
# branch, main, to decide that the event starts a run.
concurrency:
  group: ci-${{ github.head_ref }}-${{ github.event.action == 'labeled' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    if: github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled'   # every event but the promotion request: a push starts the fast tier alone
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: ruff check squad tests

  mypy:
    name: mypy
    if: github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: mypy squad

  fast-battery:
    name: fast-battery
    if: github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: python3 -m pytest -n auto -m "not heavy"
      - name: GUI test squad e2e suite
        # The battery above leaves out the file's `heavy` tests, and these ran on every promotion before the fast tier.
        # No MesenAI checkout is on the runner: the host-bound tests are deselected by name (ADR-0139), and the step
        # names the file so a missing checkout is reported rather than silently collected by the tree walk.
        run: python3 -m pytest tests/test_gui_test_e2e.py -q

  complete-guard:
    name: complete-guard
    if: github.head_ref == 'stg' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      run: ${{ steps.once.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: The complete tier starts once per tip
        id: once
        # The `promote` label asks for the complete tier, and the tier runs once on a tip: a label removed and applied again,
        # or a second label event on the same commit, starts nothing. The tip's own check runs answer it, read with
        # `filter=all`: a run another event skipped is no run of this tier, so it starts nothing and blocks nothing. A run
        # that ended in the unproven set measured nothing, so it does not count either: the tier starts again on that tip.
        # The complete-tier names are the jobs started on that label, read from this file, never a list kept here, and
        # the unproven set is the promotion's own.
        # (#2067) One complete tier at a time: a complete-tier job of another run of this pull request that has not
        # completed holds the label, and the guard names that run and its sha. The run in flight is never cancelled; the
        # promotion pass labels the newest stg tip after it ends, and main moves to the sha that run proved (ADR-0173).
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          names=$(bash contrib/squad-goal/scripts/promote-pass.sh --ci-complete-job-names .github/workflows/ci.yml)
          unproven=$(bash contrib/squad-goal/scripts/promote-pass.sh --ci-unproven-conclusions | jq -Rnc '[inputs | select(. != "")]')
          runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100&filter=all" 2>/dev/null \
            | jq -r --argjson u "$unproven" '.check_runs[] | select(.conclusion != "skipped") | select(.conclusion as $c | $u | any(. == $c) | not) | .name' 2>/dev/null || true)
          run=true
          for n in $names; do
            if printf '%s\n' "$runs" | grep -qxF "$n"; then
              echo "the tip already carries $n: the complete tier started on it"; run=false
            fi
          done
          want=$(printf '%s\n' $names | jq -Rnc '[inputs | select(. != "")]')
          for f in $(gh api "repos/$REPO/actions/runs?event=pull_request&branch=$HEAD_REF&per_page=50" 2>/dev/null \
            | jq -r --arg me "${GITHUB_RUN_ID:-}" '.workflow_runs[]? | select(.status != "completed") | select((.id | tostring) != $me) | "\(.id):\(.head_sha)"' 2>/dev/null); do
            if gh api "repos/$REPO/actions/runs/${f%%:*}/jobs?per_page=100" 2>/dev/null \
              | jq -e --argjson n "$want" '[.jobs[]? | select(.status != "completed") | select(.name as $x | $n | index($x))] | length > 0' >/dev/null 2>&1; then
              s=${f#*:}; echo "a complete tier is in flight: run ${f%%:*} on ${s:0:9}; this label starts nothing"; run=false
            fi
          done
          echo "complete tier: $names"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  full-xdist-1:
    name: full-xdist-1
    if: github.head_ref == 'stg' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'promote' && needs.complete-guard.outputs.run == 'true'
    needs: [complete-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SQUAD_CI_RUNNER: "1"   # a runner without the host repo or node: each deselected test prints its id and reason
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev,sdk]'
      # Shard 1 of six, in the xdist mode (`-n auto`): the files come from tests/ci_shards.py, the one partition, so a
      # test file is in exactly one shard of each mode and a new one fails the guard until it is assigned.
      - run: python3 -m pytest -n auto $(python3 tests/ci_shards.py 1)

  full-xdist-2:
    name: full-xdist-2
    if: github.head_ref == 'stg' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'labeled' && github.event.label.name == 'promote' && needs.complete-guard.outputs.run == 'true'
