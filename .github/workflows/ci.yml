name: ci

on:
  pull_request:
    branches: ["stg"]

# CI runs both tiers on the one pull request that carries dev to stg, the pass the loop promotes through. The fast tier is
# ruff, mypy and the fast battery, three jobs each on Python 3.13. The complete tier is the full suite on 3.13 with `-n auto`,
# the full suite on 3.13 serial, the fast battery on 3.11 and the GUI e2e suite. Every job gates on
# `github.head_ref == 'dev'`, so every check the promotion reads runs on the tip it promotes. The complete tier ran on a
# stg-to-main pull request alone, and promote-main.sh fast-forwards main from stg, so that pull request never existed and
# the complete tier never ran on the path that reached main. No branch push starts a run; a work branch is proven by the
# local fast gate, and a landing by the promotion proof. A pull request of any other pair starts nothing, because each job's
# own condition refuses it.
# Each tier's jobs have no `needs:` between them, so they start together and the pull request reports in the time of the
# slowest one. The fast-battery job carries one explicit GUI e2e run beside the battery: the battery's `-m "not heavy"`
# leaves that file's `heavy` tests out, and they ran on every promotion before this tier existed. The complete tier's GUI
# e2e job carries them alone. On each tier the host-bound tests are deselected by name (ADR-0139), and the complete tier
# also simulates a runner (SQUAD_CI_RUNNER=1), so every deselected test prints its id and reason in the job log (#1323).
# The heavy tests run inside the two full-suite jobs. No job runs a Python x mode x shard matrix: a matrix over one job
# split a commit into legs that waited behind each other for runners (#149), and a check no runner picks up answers
# nothing. A complete-tier job that takes over fifteen minutes on a real dev-to-stg run is split by test path into sibling
# jobs, each with its own check-run name, never into matrix legs (ADR-0163).
# The group names the commit, so no queue holds a pull request behind another and GitHub cancels none.
# A group shared by one branch's pushes cannot say that: GitHub queues the group's pending runs and cancels the runs
# past the queue's cap, which is one pending run by default and 100 with `queue: max` (GitHub Actions workflow syntax,
# `concurrency.queue`). A burst of pushes to one pull request cancels its run there. A group that names the commit holds
# one run and nothing pending, so no cap applies and a pull request keeps its run.
# No job outlives the twenty minutes it gives itself (#128). The fast-battery jobs run `-m "not heavy"`.
# The full-proof shards (#1051) are withdrawn while #1062 is open: they were never green on a runner, so they held every
# promotion and shipped nothing. When the heavy tests they run are hermetic, they return with their guard
# (tests/test_tooling.py); promote-pass.sh reads their names from this file, so a restored matrix needs no second change.
# promote-pass.sh reads every job name in this file as a check the dev-to-stg tip waits on, and it refuses the promotion
# by name when a job is gated on `base_ref`: such a job never runs on that pull request, so the dev tip could never prove it.
concurrency:
  group: ci-${{ github.head_ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    if: github.head_ref == 'dev'   # the one pass that carries dev to stg
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: ruff check squad tests

  mypy:
    name: mypy
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: mypy squad

  fast-battery:
    name: fast-battery
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: python3 -m pytest -n auto -m "not heavy"
      - name: GUI test squad e2e suite
        # The battery above leaves out the file's `heavy` tests, and these ran on every promotion before the fast tier.
        # No MesenAI checkout is on the runner: the host-bound tests are deselected by name (ADR-0139), and the step
        # names the file so a missing checkout is reported rather than silently collected by the tree walk.
        run: python3 -m pytest tests/test_gui_test_e2e.py -q

  full-xdist:
    name: full-xdist
    if: github.head_ref == 'dev'   # the complete tier: the pass the promotion reads, on the tip it carries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQUAD_CI_RUNNER: "1"   # a runner without the host repo or node: each deselected test prints its id and reason
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: python3 -m pytest -n auto

  full-serial:
    name: full-serial
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQUAD_CI_RUNNER: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: python3 -m pytest -p no:xdist

  fast-battery-311:
    name: fast-battery-311
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQUAD_CI_RUNNER: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: python3 -m pytest -n auto -m "not heavy"

  gui-e2e:
    name: gui-e2e
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQUAD_CI_RUNNER: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - name: GUI test squad e2e suite
        # The file's host-bound tests are deselected by name on this runner and print their ids (ADR-0139, #1323).
        run: python3 -m pytest tests/test_gui_test_e2e.py -q
