name: ci

on:
  pull_request:
    branches: ["stg"]
    # A push to dev reaches the pull request as `synchronize`; the `promote` label is the promotion request.
    types: [opened, synchronize, reopened, labeled]

# CI runs both tiers on the one pull request that carries dev to stg, the pass the loop promotes through. The fast tier is
# ruff, mypy and the fast battery, three jobs each on Python 3.13, and it runs on every event of that pull request, a push
# included. The complete tier is the full suite on 3.13 with `-n auto`, the full suite on 3.13 serial, the fast battery on
# 3.11 and the GUI e2e suite, and it runs only when the promotion is requested: the `promote` label on the pull request
# starts it once on the tip it carries. Every job gates on `github.head_ref == 'dev'`, so every check the promotion reads
# runs on the tip it promotes. The complete tier ran on a stg-to-main pull request alone, and promote-main.sh fast-forwards
# main from stg, so that pull request never existed and the complete tier never ran on the path that reached main. No branch
# push starts a run; a work branch is proven by the local fast gate, and a landing by the promotion proof. A pull request of
# any other pair starts nothing, because each job's own condition refuses it.
# Each tier's jobs have no `needs:` between them, so they start together and the pull request reports in the time of the
# slowest one. The one `needs:` is the complete tier's read of `complete-guard`, which starts the tier once per tip: it is
# the tier's entry, never a sibling it waits behind, and the twelve shard jobs still start together. The fast-battery job carries one explicit GUI e2e run beside the battery: the battery's `-m "not heavy"`
# leaves that file's `heavy` tests out, and they ran on every promotion before this tier existed. The complete tier's GUI
# e2e job carries them alone. On each tier the host-bound tests are deselected by name (ADR-0139), and the complete tier
# also simulates a runner (SQUAD_CI_RUNNER=1), so every deselected test prints its id and reason in the job log (#1323).
# The full-suite shard jobs install `.[dev,sdk]`: the hosted terminal case starts a real hosted session, and the supervisor
# refuses that start when its interpreter cannot import claude_agent_sdk. The runner can carry the sdk, so the case runs
# there and is not deselected (#1538).
# The heavy tests run inside the full-suite shard jobs. No job runs a Python x mode x shard matrix: a matrix over one job
# split a commit into legs that waited behind each other for runners (#149), and a check no runner picks up answers
# nothing. A complete-tier job that takes over fifteen minutes on a real dev-to-stg run is split by test path into sibling
# jobs, each with its own check-run name, never into matrix legs (ADR-0163). The full suite is that split: twelve sibling
# jobs, one per shard per mode, each well inside its twenty minutes on a runner (#1518).
# The group names the commit, so no queue holds a pull request behind another and GitHub cancels none.
# A group shared by one branch's pushes cannot say that: GitHub queues the group's pending runs and cancels the runs
# past the queue's cap, which is one pending run by default and 100 with `queue: max` (GitHub Actions workflow syntax,
# `concurrency.queue`). A burst of pushes to one pull request cancels its run there. A group that names the commit holds
# one run and nothing pending, so no cap applies and a pull request keeps its run.
# No job outlives the twenty minutes it gives itself (#128). The fast-battery jobs run `-m "not heavy"`.
# The full suite's shard partition is tests/ci_shards.py, and each shard job asks that one module for its files: every test
# file is in exactly one shard, in both modes, and tests/test_tooling.py fails when a file is in no shard or in two. A new
# test file is assigned there before a green shard set can stand for the full proof.
# promote-pass.sh reads every job name in this file as a check the dev-to-stg tip waits on, the twelve shard jobs included,
# and it refuses the promotion by name when a job is gated on `base_ref`: such a job never runs on that pull request, so
# the dev tip could never prove it. promote-stg.sh refuses the merge on a red check run of the tip, whatever its name, and
# under the CI proof it also refuses a tip with no green run of the complete tier: the label starts that tier, so a push
# alone never proves the full suite. A check run another event skipped is no evidence of either tier.
concurrency:
  group: ci-${{ github.head_ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    if: github.head_ref == 'dev' && github.event.action != 'labeled'   # every event but the promotion request: a push starts the fast tier alone
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: ruff check squad tests

  mypy:
    name: mypy
    if: github.head_ref == 'dev' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: mypy squad

  fast-battery:
    name: fast-battery
    if: github.head_ref == 'dev' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: python3 -m pytest -n auto -m "not heavy"
      - name: GUI test squad e2e suite
        # The battery above leaves out the file's `heavy` tests, and these ran on every promotion before the fast tier.
        # No MesenAI checkout is on the runner: the host-bound tests are deselected by name (ADR-0139), and the step
        # names the file so a missing checkout is reported rather than silently collected by the tree walk.
        run: python3 -m pytest tests/test_gui_test_e2e.py -q

  complete-guard:
    name: complete-guard
    if: github.head_ref == 'dev' && github.event.action == 'labeled' && github.event.label.name == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
    outputs:
      run: ${{ steps.once.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: The complete tier starts once per tip
        id: once
        # The `promote` label asks for the complete tier, and the tier runs once on a tip: a label removed and applied again,
        # or a second label event on the same commit, starts nothing. The tip's own check runs answer it, read with
        # `filter=all`: a run another event skipped is no run of this tier, so it starts nothing and blocks nothing. The
        # complete-tier names are the jobs started on that label, read from this file, never a list kept here.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          names=$(bash contrib/squad-goal/scripts/promote-pass.sh --ci-complete-job-names .github/workflows/ci.yml)
          runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100&filter=all" \
            -q '.check_runs[] | select(.conclusion != "skipped") | .name' 2>/dev/null || true)
          run=true
          for n in $names; do
            if printf '%s\n' "$runs" | grep -qxF "$n"; then
              echo "the tip already carries $n: the complete tier started on it"; run=false
            fi
          done
          echo "complete tier: $names"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  full-xdist-1:
    name: full-xdist-1
    if: github.head_ref == 'dev' && github.event.action == 'labeled' && github.event.label.name == 'promote' && needs.complete-guard.outputs.run == 'true'
    needs: [complete-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQUAD_CI_RUNNER: "1"   # a runner without the host repo or node: each deselected test prints its id and reason
    steps:
      - uses: actions/checkout@v5
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev,sdk]'
      # Shard 1 of six, in the xdist mode (`-n auto`): the files come from tests/ci_shards.py, the one partition, so a
      # test file is in exactly one shard of each mode and a new one fails the guard until it is assigned.
      - run: python3 -m pytest -n auto $(python3 tests/ci_shards.py 1)

  full-xdist-2:
