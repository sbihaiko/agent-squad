name: ci

on:
  push:
    branches: [dev, stg, main]
  pull_request:

# One commit starts one job, and that job runs both supported Pythons in order (#149). A matrix split one commit into
# two jobs that waited behind each other for two runners, and a check no runner picks up answers nothing.
# The group is the branch a push and the pull request of that branch both carry: `github.ref` is `refs/pull/<N>/merge`
# on a pull request and `refs/heads/<branch>` on a push, so the two never met and a superseded head kept its slot. A
# superseded pull request run is cancelled; a landing on `dev`, `stg` or `main` is never cancelled, so every landing keeps its evidence.
# No job outlives the twenty minutes it gives itself (#128). The gate is the fast battery, `-m "not heavy"`; the full
# suite runs before a merge.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: ruff check squad tests
      - run: mypy squad
      - run: python3 -m pytest -n auto -m "not heavy"
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: ruff check squad tests
      - run: mypy squad
      - run: python3 -m pytest -n auto -m "not heavy"
      - name: GUI test squad e2e suite
        # No MesenAI checkout is on the runner: the host-bound tests are deselected (ADR-0139) and their removal is
        # reported by name. The host-free tests in the file still run. The gate steps above keep their own commands.
        run: python3 -m pytest tests/test_gui_test_e2e.py -q
