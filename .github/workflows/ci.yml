name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: ruff check squad tests
      - run: mypy squad
      - run: python3 -m pytest -n auto
      - name: GUI test squad e2e suite
        env:
          MESENAI_REPO: ${{ github.workspace }}/../MesenAI
        run: python3 -m pytest tests/test_gui_test_e2e.py -q
