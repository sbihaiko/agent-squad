name: ci

on:
  pull_request:
    branches: ["stg"]

# CI runs on one pull request only: dev to stg, the pass the owner promotes through. No branch push starts a run; a work
# branch is proven by the local fast gate, and the landing by the promotion proof. A pull request from any other branch
# starts none, because the job's own condition refuses it.
# One commit starts one check job, which runs both supported Pythons in order (#149), plus the full-proof shard matrix (#1051).
# A matrix on the check job split one commit into two jobs that waited behind each other for two runners, and a check no
# runner picks up answers nothing.
# The group names the commit, so no queue holds a pull request behind another and GitHub cancels none.
# A group shared by one branch's pushes cannot say that: GitHub queues the group's pending runs and cancels the runs
# past the queue's cap, which is one pending run by default and 100 with `queue: max` (GitHub Actions workflow syntax,
# `concurrency.queue`). A burst of pushes to one pull request cancels its run there. A group that names the commit holds
# one run and nothing pending, so no cap applies and a pull request keeps its run.
# No job outlives the twenty minutes it gives itself (#128). The gate is the fast battery, `-m "not heavy"`.
# The full-proof shards (#1051) are the matrix the check job is not: four entries that run the full suite in both modes,
# each under its own fifteen-minute bound. The promotion reads the check job and the four shard check names (promote-pass.sh)
# and writes the full pass through gate.sh --status and the squad/full-proof status when all five are green on the sha.
concurrency:
  group: ci-${{ github.head_ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.head_ref == 'dev'   # the one pass that carries dev to stg
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: ruff check squad tests
      - run: mypy squad
      - run: python3 -m pytest -n auto -m "not heavy"
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - run: ruff check squad tests
      - run: mypy squad
      - run: python3 -m pytest -n auto -m "not heavy"
      - name: GUI test squad e2e suite
        # No MesenAI checkout is on the runner: the host-bound tests are deselected (ADR-0139) and their removal is
        # reported by name. The host-free tests in the file still run. The gate steps above keep their own commands.
        run: python3 -m pytest tests/test_gui_test_e2e.py -q

  full-proof:
    if: github.head_ref == 'dev'
    name: full-proof shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -e '.[dev]'
      - name: Full suite, this shard
        # The test files split by one modulus: shard k runs every file whose 1-based line number leaves remainder k.
        run: |
          files=$(ls tests/test_*.py | awk -v k=${{ matrix.shard }} 'NR % 4 == k')
          python3 -m pytest -n auto $files
          python3 -m pytest -p no:xdist $files
