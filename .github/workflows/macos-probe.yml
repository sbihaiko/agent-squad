# A manual probe (#1976): can a GitHub-hosted macOS runner run the loop's macOS-bound tests?
# It reports facts to the job summary and holds no secret. The read-only token is the only credential it has.
name: macos-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: sandbox-exec denies one write
        id: sandbox
        continue-on-error: true
        run: |
          d=$(mktemp -d); d=$(cd "$d" && pwd -P)
          target="$d/denied.txt"
          prof="(version 1)(allow default)(deny file-write* (subpath \"$d\"))"
          if sandbox-exec -p "$prof" /usr/bin/true; then started=yes; else started=no; fi
          if sandbox-exec -p "$prof" /bin/sh -c "echo x > '$target'" 2>/dev/null; then wrote=yes; else wrote=no; fi
          if [ -e "$target" ]; then on_disk=yes; else on_disk=no; fi
          {
            echo "### 1. sandbox-exec"
            echo "- starts a process under a profile: $started"
            echo "- a write under the denied subpath succeeds: $wrote"
            echo "- the denied file exists on disk: $on_disk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: launchctl loads and unloads a user agent
        id: launchctl
        continue-on-error: true
        run: |
          d=$(mktemp -d)
          label="com.agentsquad.probe.$$"
          plist="$d/$label.plist"
          cat > "$plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>Label</key><string>$label</string>
          <key>ProgramArguments</key><array><string>/usr/bin/true</string></array>
          <key>RunAtLoad</key><false/>
          </dict></plist>
          EOF
          domain="gui/$(id -u)"
          launchctl bootstrap "$domain" "$plist"; load_rc=$?
          launchctl bootout "$domain/$label"; unload_rc=$?
          {
            echo "### 2. launchctl"
            echo "- bootstrap of a temporary user agent, exit code: $load_rc"
            echo "- bootout of the same agent, exit code: $unload_rc"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cc builds the compiled process reader
        id: cc
        continue-on-error: true
        run: |
          d=$(mktemp -d)
          cc -O2 -o "$d/psfast" contrib/squad-goal/scripts/psfast.c; build_rc=$?
          "$d/psfast" -p $$ >/dev/null 2>&1; run_rc=$?
          {
            echo "### 3. cc"
            echo "- cc builds contrib/squad-goal/scripts/psfast.c, exit code: $build_rc"
            echo "- the built reader runs against this shell, exit code: $run_rc"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: macos_bound shell suites
        id: suites
        continue-on-error: true
        run: |
          here=contrib/squad-goal/scripts
          pass=0; fail=0; failed=""
          start=$(date +%s)
          for s in "$here"/test-*.sh; do [ -f "$s" ] || continue
            hm=$(mktemp -d)
            if env $(compgen -e | grep -E "^(SG_|SERIAL_)" | sed "s/^/-u /") HOME="$hm" bash "$s" >/dev/null 2>&1; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1)); failed="$failed $(basename "$s")"
            fi
            rm -rf "$hm"
          done
          secs=$(( $(date +%s) - start ))
          {
            echo "### 4. macos_bound shell suites"
            echo "- pass: $pass"
            echo "- fail: $fail"
            echo "- time: ${secs} s"
            [ -n "$failed" ] && echo "- failed suites:$failed"
          } >> "$GITHUB_STEP_SUMMARY"
