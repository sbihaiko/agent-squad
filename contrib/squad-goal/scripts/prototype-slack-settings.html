     with owned and guest Slack workspaces, channels, roles and personas? Three variants on one page, switched by ?variant=.
     State lives in memory; nothing is saved. Run: python3 -m http.server -d contrib/squad-goal/scripts 8765, then open
     http://localhost:8765/prototype-slack-settings.html?variant=A -->

<style>

/* switcher */
#sw{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--highlight);color:#111;border-radius:var(--radius-full);padding:6px 10px;box-shadow:0 6px 24px var(--shadow-float);z-index:9;font-size:14px}

/* A: tree + inspector */
.A{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:8px;align-self:start;position:sticky;top:10px}

.tree a.ch{padding-left:22px;font-size:13px}.tree a:hover{background:var(--hover)}.tree a.sel{background:var(--raise-2)}
/* B: tables */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border-radius:var(--radius-sm) var(--radius-sm) 0 0;border-bottom:0;background:transparent}.tabs button.on{background:var(--card);border-color:var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mute);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--well-line);vertical-align:top}tr.exp td{background:var(--inset)}
/* C: files side by side */
.C{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.C .files{position:sticky;top:10px;align-self:start;display:grid;gap:10px;min-width:0}.C .files pre{max-height:42vh;white-space:pre-wrap;overflow-wrap:anywhere}.C .fh{gap:8px;flex-wrap:wrap}
.C .fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:var(--fs-caption)}
.C details>summary{cursor:pointer;font-weight:600;padding:4px 0}
/* D: the hub's Settings pattern (#1278): theme nav, Now tiles, Settings rows, save bar */
.D header.ptop{display:flex;align-items:center;gap:8px;padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.D header.ptop b{font-size:21px;margin-right:12px}.D header.ptop span{border:1px solid var(--line);border-radius:var(--radius-md);padding:6px 12px;background:var(--panel)}.D header.ptop span.on{border-color:var(--acc);color:var(--acc)}
.D .swrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.D .snav{display:flex;flex-direction:column;gap:4px;position:sticky;top:6px}.D .snav div{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--panel)}
.D .snav div small{display:block;color:var(--mute);font-size:var(--fs-caption)}.D .snav div.on{border-color:var(--acc);background:var(--bubble)}
.D .lead{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.D .sp{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--panel);padding:8px 12px 12px}
.D .sp>.sum{display:flex;justify-content:space-between;align-items:center;font-weight:600;padding:2px 0 8px}.D .sp>.sum small{font-weight:400;color:var(--mute);font-size:var(--fs-caption)}
.D .blkh{font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:10px 0 4px}
.D .now{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 8px}
.D .tile{background:var(--inset);border:1px solid var(--line);border-radius:var(--radius-md);padding:6px 8px;font-size:var(--fs-caption)}.D .tile .tk{display:block;color:var(--mute);font-weight:600}.D .tile .tv{display:block}.D .tile.ok .tv{color:var(--ok)}.D .tile.warn .tv{color:var(--warn)}
.D .note{font-size:var(--fs-caption);color:var(--ink-soft);margin:4px 0 8px}
.D .setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}.D .setrow .sl{font-size:var(--fs-body)}.D .setrow .sl small{display:block;color:var(--mute);font-size:var(--fs-caption)}.D .setrow .sc{justify-self:end;max-width:100%;text-align:right}
.D .setrow.wide{grid-template-columns:160px minmax(0,1fr)}.D .setrow.wide .sc{justify-self:stretch;text-align:left}
.D h4{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-size:14px}.D h4 small{font-weight:400}
.D table{font-size:13px}.D td{vertical-align:middle}.D td label{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;margin-left:6px}.D table.roles{width:auto;min-width:60%}.D table.roles td,.D table.roles th{padding:3px 14px 3px 6px}.D td,.D th{padding:5px 6px}.D .sub{margin:8px 0 2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.D .addrow{display:flex;gap:6px;margin:8px 0}
.D .detail{background:var(--inset);border:1px solid var(--line);border-radius:var(--radius-md);padding:4px 10px;margin:4px 0 8px}
.D .sbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-top:12px;background:var(--tint-warn);border-top:1px solid var(--tint-warn-line)}.D .sbar .save{background:var(--warn);color:var(--on-tone);border-color:var(--warn)}.D .sbar span{font-size:var(--fs-caption);color:var(--ink-soft)}
.D dialog{position:fixed;top:70px;left:50%;transform:translateX(-50%);margin:0;z-index:20;box-shadow:0 10px 40px var(--shadow-deep);background:var(--panel);color:var(--fg);border:1px solid var(--edge);border-radius:var(--radius-lg);max-width:min(860px,94vw);width:860px}
.D dialog pre{max-height:none;white-space:pre-wrap}.D .add{color:var(--ok)}.D .del{color:var(--err)}
.D .refuse{color:var(--err);background:var(--tint-err,transparent);border:1px solid var(--err);border-radius:var(--radius-md);padding:6px 10px;margin:0 0 8px;font-size:var(--fs-caption)}
.D .mk b{display:block}.D .mk i{display:block;color:var(--ink-body)}.D .bubble .m{margin-top:4px}.D code{font-family:ui-monospace,monospace;font-size:12px}
.D table.chs td{white-space:nowrap}.D table.chs td.ann{white-space:normal}.D table.chs>tbody>tr>td>select{max-width:118px}.D code{white-space:nowrap}.D .nw{white-space:nowrap;display:block}
.D input.dur{width:78px}.D .tg{display:inline-flex;gap:6px;align-items:center}.D td.ann .chip{font-size:11px;margin:1px 0}.D table.evs td:nth-child(3){width:46%}

@media (max-width:820px){.A,.C{grid-template-columns:1fr}.tree,.C .files{position:static}.row{grid-template-columns:1fr}}
</style></head><body>
<header class=top><b>Settings</b><span class=m>agent-squad · Communication</span><span class=proto>PROTOTYPE · nothing is saved</span></header>
<main id=app></main>
<div id=sw><button id=prev aria-label="previous variant">‹</button><span id=swl></span><button id=next aria-label="next variant">›</button></div>
<script>
// ---------- data: every id and name is a placeholder ----------
const VOICES={Kore:"firm",Charon:"informative",Puck:"upbeat",Zephyr:"bright",Aoede:"breezy",Leda:"youthful",Orus:"firm",Fenrir:"excitable",Sulafat:"warm",Achird:"friendly"};
const LANGS=["pt-BR","en-US","es-ES"];
const ACTIONS={status:"ask status",logs:"read logs",request_work:"request work",request_investigation:"investigation / spike",loop_control:"pause, resume, drain",approve_and_move:"approve, move cards",deploy:"deploy"};
const ENVS=["dev","stg","prod"];
const S={
 project:{language:"en-US",persona:"hal"},
 personas:[
  {id:"hal",name:"HAL9K",voice:"Kore",tone:"Calm and direct. Starts with the result, then the next step. Short sentences, no filler."},
  {id:"iara",name:"Iara",voice:"Sulafat",tone:"Warm and patient. Confirms what was asked before answering. Never technical jargon with a client."}],
 roles:[
  {id:"manager",actions:["status","logs","request_work","request_investigation","loop_control","approve_and_move"],deploy:[]},
  {id:"colleague",actions:["status","request_work","request_investigation"],deploy:[]}],
 apps:[{id:"hal9k",keychain:{bot:"agent-squad-slack-bot",app:"agent-squad-slack-app"}}],
 events:[
  {id:"stg_release",template:"Subiu para STG (deploy ok, e2e verde): {items}. {next_step}"},
  {id:"prod_release",template:"Publicado em PROD (deploy ok): {items}. {next_step}"}],
 workspaces:[
  {id:"T0TEAM0001",label:"team",cls:"owned",app:"hal9k",secret:"agent-squad-slack-bot",language:"",persona:"",channels:[
    {id:"C0PROJ0001",name:"proj-agent-squad",mode:"listen+speak",language:"pt-BR",persona:"",announce:["stg_release","prod_release"],members:{manager:["U0OWNER001"],colleague:["U0PEER0001"]}},
    {id:"C0ALERT001",name:"squad-alerts",mode:"listen",language:"",persona:"",announce:[],members:{}}]},
  {id:"T0CLIENT01",label:"client-a",cls:"guest",language:"en-US",persona:"iara",channels:[
    {id:"C0CLISUP01",name:"support",mode:"listen+speak",language:"",persona:"",speak:"draft",transcribe:"local",voice_reply:false,draft_for:["U0CLIENT02"],announce:["prod_release"],
     pd:{mode:"two_state",fast:"1m",slow:"10m",quiet_after:"10m",floor:"1m",ceiling:"30m",factor:2,idle_window:"10m",thread_open:"30m"},
     poll:{floor:60,ceiling:1800,factor:2,idle:600,thread_open:1800},members:{colleague:["U0CLIENT01"]}},
    {id:"C0CLIGEN01",name:"general",mode:"listen",language:"",persona:"",speak:"draft",transcribe:"off",voice_reply:false,draft_for:[],announce:[],
     pd:{mode:"exponential",fast:"1m",slow:"10m",quiet_after:"10m",floor:"5m",ceiling:"1h",factor:2,idle_window:"15m",thread_open:"30m"},
     poll:{floor:300,ceiling:3600,factor:2,idle:900,thread_open:1800},members:{}}]}]
};
// ---------- resolution (what the policy module would answer) ----------
const persona=id=>S.personas.find(p=>p.id===id);
const effLang=(w,c)=>c.language||w.language||S.project.language;
const effPersona=(w,c)=>persona(c.persona||w.persona||S.project.persona);
const fmt=s=>s<60?s+"s":s<3600?Math.round(s/60)+"m":(s/3600).toFixed(1).replace(/\.0$/,"")+"h";
function schedule(p){const out=[];let t=p.floor;for(let i=0;i<8&&out[out.length-1]!==p.ceiling;i++){out.push(Math.min(t,p.ceiling));t*=p.factor}return out.map(fmt).join(" → ")}
function replyPath(w,c){if(c.mode==="listen")return "never posts";if(w.cls==="owned")return "posts as the bot";return c.speak==="send"?"sends as you (needs a grant)":"drafts as you"}
// ---------- yaml: committed vs local split ----------
const q=v=>/^[\w.+@-]+$/.test(String(v))?v:JSON.stringify(v);
function y(o,ind=0){const p=" ".repeat(ind);if(Array.isArray(o))return o.length?o.map(v=>typeof v==="object"?p+"- "+y(v,ind+2).trimStart():p+"- "+q(v)).join("\n"):p+"[]";
 return Object.entries(o).filter(([,v])=>v!==""&&v!==undefined&&!(Array.isArray(v)&&!v.length&&false)).map(([k,v])=>typeof v==="object"&&v!==null?(Array.isArray(v)&&!v.length?`${p}${k}: []`:`${p}${k}:\n${y(v,ind+2)}`):`${p}${k}: ${q(v)}`).join("\n")}
function chYaml(w,c,withMembers){const o={id:c.id,name:c.name,mode:c.mode};if(c.language)o.language=c.language;if(c.persona)o.persona=c.persona;
 if(w.cls==="guest"){o.speak=c.speak||"draft";o.poll={floor:fmt(c.poll.floor),ceiling:fmt(c.poll.ceiling),factor:c.poll.factor,idle_window:fmt(c.poll.idle),thread_open:fmt(c.poll.thread_open)}}
 const r=Object.keys(c.members);if(withMembers&&r.length)o.roles=Object.fromEntries(r.map(k=>[k,c.members[k]]));else if(r.length)o.roles=r;return o}
function wsYaml(w,withMembers){const o={id:w.id,label:w.label,class:w.cls,transport:w.cls==="owned"?"socket":"poll"};if(w.secret)o.secret=w.secret;if(w.language)o.language=w.language;if(w.persona)o.persona=w.persona;o.channels=w.channels.map(c=>chYaml(w,c,withMembers));return o}
function committed(){return "# docs/squad/slack.yaml · committed\nversion: 1\n"+y({project:{language:S.project.language,persona:S.project.persona},
 personas:S.personas.map(p=>({id:p.id,name:p.name,voice:p.voice,tone:p.tone})),
 roles:S.roles.map(r=>{const o={id:r.id,actions:r.actions};if(r.actions.includes("deploy"))o.deploy=r.deploy;return o}),
 workspaces:S.workspaces.filter(w=>w.cls==="owned").map(w=>wsYaml(w,false))})}
function local(){const mem=[];S.workspaces.filter(w=>w.cls==="owned").forEach(w=>w.channels.forEach(c=>{if(Object.keys(c.members).length)mem.push({workspace:w.id,channel:c.id,members:c.members})}));
 return "# docs/squad/slack.local.yaml · gitignored\nversion: 1\n"+y({members:mem,workspaces:S.workspaces.filter(w=>w.cls==="guest").map(w=>wsYaml(w,true))})}
// ---------- shared widgets (forms are shared, layouts are not) ----------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts=(list,cur,blank)=>(blank?`<option value=""${cur?"":" selected"}>${blank}</option>`:"")+list.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`}).join("");
const pOpts=()=>S.personas.map(p=>[p.id,p.name]);
const bind=(path,ev="change")=>`data-b="${path}" data-ev="${ev}"`;
function get(path){return path.split(".").reduce((o,k)=>o[k],S)}
function set(path,v){const ks=path.split(".");const last=ks.pop();const o=ks.reduce((o,k)=>o[k],S);o[last]=typeof o[last]==="number"?Number(v):v;draw()}
function personaForm(i){const p=S.personas[i];return `<div class=row><label>name</label><input ${bind(`personas.${i}.name`,"input")} value="${esc(p.name)}"></div>
<div class=row><label>voice (Gemini)</label><span><select ${bind(`personas.${i}.voice`)}>${opts(Object.keys(VOICES).map(v=>[v,v+" · "+VOICES[v]]),p.voice)}</select> <button onclick="alert('PROTOTYPE: would speak a sample with '+${JSON.stringify(p.voice)})">▶ sample</button></span></div>
<div class=row><label>tone</label><textarea ${bind(`personas.${i}.tone`,"input")}>${esc(p.tone)}</textarea></div>
<div class=row><label>marker</label><span><span class=marker>_${esc(p.name)}'s Msg_</span> <span class=m>· first line of every text sent through your account; cannot be turned off</span></span></div>
<div class=row><label>used by</label><span class=m>${usedBy(p.id)||"no channel"}</span></div>`}
function usedBy(id){const l=[];S.workspaces.forEach(w=>w.channels.forEach(c=>{if(effPersona(w,c).id===id)l.push(w.label+"/#"+c.name)}));return l.join(", ")}
function roleForm(i){const r=S.roles[i];return `<div class=row><label>actions</label><span class=acts>${Object.keys(ACTIONS).map(a=>`<label><input type=checkbox data-role="${i}" data-act="${a}"${r.actions.includes(a)?" checked":""}> ${ACTIONS[a]}</label>`).join("")}</span></div>
${r.actions.includes("deploy")?`<div class=row><label>deploy to</label><span class=acts>${ENVS.map(e=>`<label><input type=checkbox data-role="${i}" data-env="${e}"${r.deploy.includes(e)?" checked":""}> ${e}</label>`).join("")}<span class=m>· a listed environment is the standing grant (ADR-0024)</span></span></div>`:""}
<div class=row><label>never</label><span class=m>spend money · credentials · access changes · external publication · any owner-only action</span></div>`}
function wsForm(wi){const w=S.workspaces[wi];return `<div class=row><label>class</label><span><span class="chip ${w.cls}">${w.cls}</span> <span class=m>${w.cls==="owned"?"app installed · Socket Mode · bot speaks text and audio":"no bot · claude.ai connector in your account · polling · text only"}</span></span></div>
<div class=row><label>label</label><input ${bind(`workspaces.${wi}.label`,"input")} value="${esc(w.label)}"></div>
${w.cls==="owned"?`<div class=row><label>Keychain entry</label><span><input ${bind(`workspaces.${wi}.secret`,"input")} value="${esc(w.secret)}"> <span class=m>a name, never a token</span></span></div>`:""}
<div class=row><label>default language</label><select ${bind(`workspaces.${wi}.language`)}>${opts(LANGS,w.language,"inherit · "+S.project.language)}</select></div>
<div class=row><label>default persona</label><select ${bind(`workspaces.${wi}.persona`)}>${opts(pOpts(),w.persona,"inherit · "+persona(S.project.persona).name)}</select></div>
<div class=row><label>file</label><span>${w.cls==="guest"?`<span class="chip local">slack.local.yaml</span> <span class=m>a client Slack workspace never reaches the committed file</span>`:`<span class="chip commit">slack.yaml</span>`}</span></div>`}
function chForm(wi,ci){const w=S.workspaces[wi],c=w.channels[ci],P=`workspaces.${wi}.channels.${ci}`,per=effPersona(w,c);
 let h=`<div class=row><label>mode</label><select ${bind(P+".mode")}>${opts(["listen","listen+speak"],c.mode)}</select></div>
<div class=row><label>language</label><select ${bind(P+".language")}>${opts(LANGS,c.language,"inherit · "+(w.language||S.project.language))}</select></div>
<div class=row><label>persona</label><select ${bind(P+".persona")}>${opts(pOpts(),c.persona,"inherit · "+effPersona(w,{persona:""}).name)}</select></div>`;

 h+=`<h4>Personas ${fileChip("c")}</h4><table><tr><th>Persona</th><th>Voice</th><th>Tone</th><th>Used by</th><th></th></tr>${S.personas.map((p,i)=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.voice} <span class=m>· ${VOICES[p.voice]}</span></td><td class=m>${esc(p.tone.split(".")[0])}.</td><td class=m>${esc(usedBy(p.id))||"no channel"}</td><td><button data-dp="${i}">${openD.persona===i?"Close":"Edit"}</button></td></tr>${openD.persona===i?`<tr><td colspan=5><div class=detail>${sr("Name <small>letters, digits, space, period, hyphen and underscore; up to 32 characters</small>",`<input ${bind(`personas.${i}.name`,"input")} value="${esc(p.name)}">`)}${sr("Voice <small>a Gemini TTS voice; the sample is generated once per voice and tone, then cached</small>",`<select ${bind(`personas.${i}.voice`)}>${opts(Object.keys(VOICES).map(v=>[v,v+" · "+VOICES[v]]),p.voice)}</select> <button>▶ Sample</button>`)}${sr("Tone <small>guides the text and the speaking style; up to 300 characters</small>",`<textarea ${bind(`personas.${i}.tone`,"input")} style="width:420px">${esc(p.tone)}</textarea>`,"")}${sr(`Mark <small>first line of every text sent through your account; cannot be turned off. Slack source: <code>*${esc(p.name)}'s Msg*</code>, then the body in italics</small>`,`<div class=bubble style="text-align:left;width:360px">${markBubble(p.name,SAMPLE["en-US"])}</div>`)}${sr("Bot name <small>in an owned Slack workspace (chat:write.customize)</small>",`<b>${esc(p.name)}</b> <span class=chip>APP</span>`)}</div></td></tr>`:""}`).join("")}</table><div class=addrow><input placeholder="persona name"><button>Add persona</button></div>`;
 // roles
 h+=`<h4>Roles ${fileChip("c")}</h4><table class=roles><tr><th>Action</th>${S.roles.map(r=>`<th>${r.id}</th>`).join("")}</tr>${Object.keys(ACTIONS).map(a=>`<tr><td>${ACTIONS[a]}</td>${S.roles.map((r,i)=>`<td><input type=checkbox data-role="${i}" data-act="${a}"${r.actions.includes(a)?" checked":""}>${a==="deploy"&&r.actions.includes("deploy")?" "+ENVS.map(e=>`<label class=m><input type=checkbox data-role="${i}" data-env="${e}"${r.deploy.includes(e)?" checked":""}${e==="prod"?" disabled":""}>${e}</label>`).join(" "):""}</td>`).join("")}</tr>`).join("")}</table><p class=note>No role grants an owner-only action. A deploy environment a role lists is its standing grant; no role may list prod. Who holds each role is set per channel and stays in ${fileChip("l")}.</p><div class=addrow><input placeholder="role id"><button>Add role</button></div>`;
 // slack workspaces
 h+=`<h4>Slack workspaces</h4>`;
 S.workspaces.forEach((w,wi)=>{const app=S.apps.find(a=>a.id===w.app);h+=`<div class=sub><b>${esc(w.label)}</b><span class="chip ${w.cls}">${w.cls}</span><span class=m>${w.cls==="owned"?`socket · app ${esc(w.app)} · Keychain ${esc(app.keychain.bot)}, ${esc(app.keychain.app)}`:"claude.ai connector · your account"}</span>${fileChip(w.cls==="owned"?"c":"l")}</div>
 <table class=chs><tr><th>Channel</th><th>Mode</th><th>Language</th><th>Persona</th><th>Answers</th><th>${w.cls==="guest"?"Polling":"Transport"}</th><th>Announce</th><th>Members</th><th></th></tr>${w.channels.map((c,ci)=>{const k=wi+":"+ci,P=`workspaces.${wi}.channels.${ci}`;return `<tr><td><b>#${esc(c.name)}</b></td><td><select ${bind(P+".mode")}>${opts(["listen","listen+speak"],c.mode)}</select></td><td><select ${bind(P+".language")}>${opts(LANGS,c.language,"↑ "+(w.language||S.project.language))}</select></td><td><select ${bind(P+".persona")}>${opts(pOpts(),c.persona,"↑ "+effPersona(w,{persona:""}).name)}</select></td><td class=m>${replyPath(w,c)}</td><td class=sched>${w.cls==="guest"?pollShort(c.pd):"socket"}</td><td class=ann>${annChips(c)}</td><td class=m>${Object.entries(c.members).map(([r,u])=>`<span class=nw>${r} ×${u.length}</span>`).join("")||"owner only"}</td><td><button data-dc="${k}">${openD.channel===k?"Close":"Edit"}</button></td></tr>${openD.channel===k?`<tr><td colspan=9><div class=detail>${chDetailD(w,wi,c,ci)}</div></td></tr>`:""}`}).join("")}</table><div class=addrow><input placeholder="#channel or id"><button>Add channel</button></div>`});
 h+=`<div class=addrow><select id=dwcls><option value=owned>owned · app installed</option><option value=guest${openD.wsErr?" selected":""}>guest · claude.ai connector</option></select><input id=dwid placeholder="T0..." value="${esc(openD.wsId||"")}"><button data-dadd>Add Slack workspace</button></div>${openD.wsErr?`<p class=refuse role=alert>${esc(openD.wsErr)}</p>`:""}`;
 // project events
 h+=`<h4>Project events ${fileChip("c")}</h4><table class=evs><tr><th>Event</th><th>Emitted</th><th>Template</th><th>Channels</th></tr>${S.events.map((e,i)=>`<tr><td><b>${e.id}</b></td><td class=m>${EVWHEN[e.id]||"by the promotion pass"}</td><td><input ${bind(`events.${i}.template`,"input")} value="${esc(e.template)}" style="width:100%"></td><td class=m>${S.workspaces.flatMap(w=>w.channels.filter(c=>c.mode==="listen+speak"&&(c.announce||[]).includes(e.id)).map(c=>`<span class=nw>${esc(w.label+"/#"+c.name)}</span>`)).join("")||"none"}</td></tr>`).join("")}</table><p class=note>The agent-squad promotion pass emits each event after the deploy and the green e2e in that environment. A notice reaches only the channels that subscribe to it, after the persona's mark: the bot posts in an owned channel, and a guest channel follows its Answer as setting. A channel can override the template.</p>`;
 const dc=lineDiff(BASE.c,committedD()),dl=lineDiff(BASE.l,localD()),n=dc.length+dl.length;
 const bar=`<div class=sbar><button class=save data-dsave>Save…</button><button data-dreset>Discard changes</button><span>${n?`Communication: ${dc.length?"slack.yaml changed · lands in dev after your approval":""}${dc.length&&dl.length?" · ":""}${dl.length?"slack.local.yaml changed · applies at once":""}`:"Communication: no change"}</span></div>`;
 const dlg=openD.dlg?`<dialog open><b>Review the change</b><p class=note>The hub writes slack.yaml in its own worktree, commits it after your approval, and lands it in dev. slack.local.yaml lives in the profile folder and applies at once.</p><div class=blkh>slack.yaml · committed</div><pre>${dc.join("\n")||"no change"}</pre><div class=blkh>slack.local.yaml · profile folder, outside any repository</div><pre>${dl.join("\n")||"no change"}</pre><div class=addrow><button class=pri data-dclose>Approve and write</button><button data-dclose>Cancel</button></div></dialog>`:"";
 return `<div class=D><header class=ptop><b>agent-squad ▾</b><span>Kanban</span><span>Runs</span><span>Flow</span><span>Loop</span><span class=on>Settings</span></header><div class=lead>Settings</div><div class=swrap><nav class=snav>${nav}</nav><div><section class=sp><div class=sum>Communication<small>${S.workspaces.map(w=>w.label+(w.cls==="owned"?" connected":" polling")).join(" · ")}</small></div>${h}</section>${bar}</div></div>${dlg}</div>`}
app.addEventListener("click",e=>{const p=e.target.closest("[data-dp]");if(p){openD.persona=openD.persona===+p.dataset.dp?-1:+p.dataset.dp;draw()}const c=e.target.closest("[data-dc]");if(c){openD.channel=openD.channel===c.dataset.dc?"":c.dataset.dc;draw()}if(e.target.closest("[data-dsave]")){openD.dlg=true;draw()}if(e.target.closest("[data-dclose]")){openD.dlg=false;draw()}if(e.target.closest("[data-dreset]"))location.reload();
 if(e.target.closest("[data-dadd]")){const cls=document.getElementById("dwcls").value,id=document.getElementById("dwid").value.trim();openD.wsId=id;
  if(cls==="guest"&&S.workspaces.some(w=>w.cls==="guest")){openD.wsErr="The connector reaches one Slack workspace. Remove the current guest workspace first.";draw();return}
  openD.wsErr="";openD.wsId="";S.workspaces.push({id:id||"T0NEW00001",label:"new",cls,app:"hal9k",secret:"agent-squad-slack-bot",language:"",persona:"",channels:[]});draw()}});
app.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.ann){const [wi,ci,ev]=t.dataset.ann.split(".");const c=S.workspaces[wi].channels[ci];c.announce=t.checked?S.events.map(x=>x.id).filter(x=>x===ev||c.announce.includes(x)):c.announce.filter(x=>x!==ev);draw()}
 if(t.dataset.vr){const [wi,ci]=t.dataset.vr.split(".");S.workspaces[wi].channels[ci].voice_reply=t.checked;draw()}
 if(t.dataset.dfor){const [wi,ci]=t.dataset.dfor.split(".");S.workspaces[wi].channels[ci].draft_for=t.value.split(/[ ,]+/).filter(Boolean);draw()}});
draw();
</script></body></html>
