<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hub</title><link rel=manifest href="/mobile/manifest.webmanifest"><link rel=icon href="/mobile/icon.svg"><meta name=theme-color content="#0f1115"><meta name=apple-mobile-web-app-capable content=yes>
<style>
:root{--bg:#0f1115;--panel:#161a21;--line:#2a303b;--fg:#d8dde6;--mute:#8a93a3;--ok:#3ecf8e;--warn:#f5b041;--err:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;min-height:100vh}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
header select{flex:1;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:8px;font-size:16px;border-radius:6px}
header a{color:#5aa9ff;font-size:13px;white-space:nowrap}
main{padding:12px 12px 84px}
section[hidden]{display:none}
h2{font-size:17px;margin:6px 0 10px}
#loop{padding:12px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
#loop.on #loop-text{color:var(--ok)}#loop.off #loop-text{color:var(--err)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center}
.tile b{display:block;font-size:22px}
.tile span{color:var(--mute);font-size:12px}
#warnings{list-style:none;padding:0;margin:0}
#warnings li{padding:12px 4px;border-bottom:1px solid var(--line);color:var(--warn);min-height:44px}
#warn-detail{margin-top:10px;padding:12px;background:var(--panel);border-radius:8px;color:var(--mute);white-space:pre-wrap}
#load{color:var(--mute);margin-top:12px;font-variant-numeric:tabular-nums}
#msg,#bmsg{color:var(--err)}
#bhead{display:flex;align-items:center;gap:8px;touch-action:pan-y}
#bhead button{min-width:44px;min-height:44px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;font-size:22px}
#bhead button:disabled{opacity:.35}
#col-title{flex:1;text-align:center;min-height:44px;display:flex;flex-direction:column;justify-content:center}
#col-name{font-size:17px;font-weight:600}
#col-count{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
#dots{display:flex;justify-content:center;gap:6px;margin:8px 0 12px}
#dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
#dots i.on{background:var(--fg)}
#bfilter{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
#bfilter button,#bfilter summary{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:14px;min-height:40px;line-height:40px}
#lf{position:relative}
#lfl{position:absolute;z-index:5;top:44px;left:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;display:grid;gap:4px;min-width:200px;max-height:60vh;overflow:auto}
#lfl label{font-size:14px;display:flex;align-items:center;gap:6px;min-height:36px}
#cards{touch-action:pan-y;min-height:50vh;display:flex;flex-direction:column;gap:8px}
.card{display:block;width:100%;text-align:left;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:14px system-ui,sans-serif;min-height:44px}
.card .cid{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.empty{color:var(--mute);text-align:center;padding:24px 0}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));z-index:20}
#sheet[hidden]{display:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
#sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
#sh-head button,#sh-next{min-height:44px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 12px;font-size:14px}
#sh-link{color:#5aa9ff;font-size:14px}
#sh-title{font-size:16px;margin:6px 0}
#sh-labels{color:var(--mute);font-size:12px;margin-bottom:8px}
#sh-body{white-space:pre-wrap;color:var(--fg);font-size:14px;margin:10px 0;overflow-wrap:anywhere}
#sh-next{width:100%;margin-top:8px}
#sh-next:disabled{opacity:.35}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;background:none;border:0;color:var(--mute);font:13px system-ui;padding:6px 0}
nav button[aria-current=page]{color:var(--fg);box-shadow:inset 0 2px 0 #5aa9ff}
#reconnect{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#reconnect[hidden]{display:none}
#reconnect button{min-height:44px;min-width:120px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;font-size:16px}
#more-menu{display:grid;gap:8px}
#more-menu button,[data-screen] button{min-height:44px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;font-size:15px;padding:0 12px;text-align:left}
#periods{display:flex;gap:8px;margin:10px 0 12px}
#periods button{flex:1;text-align:center}
#periods button[aria-pressed=true]{box-shadow:inset 0 -2px 0 #5aa9ff}
#cchart{width:100%;margin:8px 0}
#cchart svg{width:100%;height:auto;display:block}
.row{padding:10px 4px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.row .mut{color:var(--mute);font-size:13px}
[data-screen] .msg{color:var(--err)}
.sub{font-size:14px;color:var(--mute);margin:14px 0 6px}
.runlist{display:grid;gap:8px}
.runrow{display:block;width:100%;text-align:left;min-height:44px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:14px system-ui,sans-serif}
.runrow .mut{color:var(--mute);font-size:12px;margin-top:2px}
#runview{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#runview[hidden]{display:none}
#runview-head{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#runview-head button{min-height:44px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 12px}
#runview-name{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#runctl{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#runctl button{min-height:44px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 12px}
#runctl button[hidden]{display:none}
#runctl-limits{flex:1 1 100%;margin:0;color:var(--mute);font-size:12px}
#runctl-msg{flex:1 1 100%;margin:0;font-size:12px}
#runctl-msg.err{color:var(--err)}
#runbody{position:relative;flex:1;min-height:0}
#runframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#termview{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#termview[hidden]{display:none}
#termview-head{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#termview-head button,#termview-older{min-height:44px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 12px}
#termview-name{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#termview-older{margin:8px 12px 0}
#termview-turns{flex:1;overflow:auto;padding:8px 12px;display:grid;gap:8px;align-content:start}
.turn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px system-ui,sans-serif}
.turn b{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
.turn div{white-space:pre-wrap;overflow-wrap:anywhere}
#edge{position:absolute;top:0;bottom:0;left:0;width:24px;z-index:2;touch-action:pan-y}
.card.armed{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.card .cmv{display:none;color:var(--ok);font-size:12px;margin-top:4px}
.card.armed .cmv{display:block}
.card .creason{display:block;color:var(--err);font-size:12px;margin-top:4px}
#undo{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#undo[hidden]{display:none}
#undo-text{flex:1;font-size:14px}
#undo button{min-height:44px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 12px;font-size:14px}
#undo button[hidden]{display:none}
</style>
<header>
<select id="profile" aria-label="Profile" hidden></select>
<a id="to-desktop" href="#">Desktop page</a>
</header>
<div id="reconnect" hidden><p>The hub does not answer. Check Tailscale and that the machine is awake.</p><button id="retry" type="button">Try again</button></div>
<main>
<section data-panel="status">
<h2>Status</h2>
<div id=loop><span id=loop-text>loading</span></div>
<div class=tiles>
<div class=tile><b id=t-live>-</b><span>live runs</span></div>
<div class=tile><b id=t-spend>-</b><span>spend today</span></div>
<div class=tile><b id=t-bugs>-</b><span>open bugs</span></div>
</div>
<h2>Warnings</h2>
<ul id=warnings></ul>
<div id=warn-detail hidden></div>
<div id=load></div>
<p id=msg></p>
</section>
<section data-panel="board" hidden>
<div id="bhead" data-role="header">
<button id="col-prev" aria-label="Previous column">&lsaquo;</button>
<div id="col-title"><span id="col-name"></span><span id="col-count"></span></div>
<button id="col-next" aria-label="Next column">&rsaquo;</button>
</div>
<div id="dots"></div>
<div id="bfilter">
<button id="bsp" type="button">Specs: all</button>
<details id="lf"><summary>labels</summary><div id="lfl"></div></details>
<button id="lmode" type="button">by group</button>
</div>
<div id="cards" data-role="gap"></div>
<div id="undo" role="status" hidden><span id="undo-text"></span><button id="undo-btn" type="button" hidden>Undo</button></div>
<p id="bmsg"></p>
</section>
<section data-panel="runs" hidden>
<h2>Runs</h2>
<h3 class="sub">Live</h3>
<div id="runs-live" class="runlist"></div>
<h3 class="sub">Ended today</h3>
<div id="runs-ended" class="runlist"></div>
<p id="runs-msg" class="msg"></p>
</section>
<section data-panel="terminals" hidden>
<h2>Terminals</h2>
<div id="sessions" class="runlist"></div>
<p id="sessions-msg" class="msg"></p>
</section>
<section data-panel="more" hidden>
<h2>More</h2>
<div id="more-menu">
<button data-more="subs" type="button">Subscriptions</button>
<button data-more="models" type="button">Squad models</button>
<button data-more="cost" type="button">Cost and usage</button>
</div>
<article data-screen="subs" data-src="/api/subs" hidden>
<button data-back type="button">Back</button>
<h2>Subscriptions</h2>
<div class="list"></div>
<p class="msg"></p>
</article>
<article data-screen="models" data-src="/api/models" hidden>
<button data-back type="button">Back</button>
<h2>Squad models</h2>
<div class="list"></div>
<p class="msg"></p>
</article>
<article data-screen="cost" data-src="/api/stats" hidden>
<button data-back type="button">Back</button>
<h2>Cost and usage</h2>
<div id="periods">
<button data-period="hour" type="button">Per hour</button>
<button data-period="day" type="button">Per day</button>
<button data-period="month" type="button">Per month</button>
</div>
<div id="cchart"></div>
<div class="list"></div>
<p class="msg"></p>
</article>
</section>
</main>
<div id="sheet" data-role="sheet" role="dialog" aria-labelledby="sh-title" hidden>
<div class="grab"></div>
<div id="sh-head"><a id="sh-link" target="_blank" rel="noopener">Open on GitHub</a><button id="sh-close" type="button">Close</button></div>
<h2 id="sh-title"></h2>
<div id="sh-labels"></div>
<div id="sh-body"></div>
<button id="sh-next" type="button">Next card</button>
</div>
<section id="termview" hidden>
<div id="termview-head"><button id="termview-back" type="button">Back</button><span id="termview-name"></span></div>
<button id="termview-older" type="button" hidden>Older turns</button>
<div id="termview-turns"></div>
<p id="termview-msg" class="msg"></p>
</section>
<section id="runview" hidden>
<div id="runview-head"><button id="runview-back" type="button">Back</button><span id="runview-name"></span></div>
<div id="runctl"><button id="runctl-btn" type="button" hidden></button><p id="runctl-limits"></p><p id="runctl-msg" class="msg"></p></div>
<div id="runbody"><iframe id="runframe" title="Run dashboard"></iframe><div id="edge" data-role="edge"></div></div>
</section>
<nav>
<button data-tab="status">Status</button>
<button data-tab="board">Board</button>
<button data-tab="runs">Runs</button>
<button data-tab="terminals">Terminals</button>
<button data-tab="more">More</button>
</nav>
<script>
/*GESTURE*/
/*MOVE*/
/*RUN*/
/*BOARD_FILTER*/
const $ = id => document.getElementById(id);
const base = location.pathname.replace(/mobile\/?$/, "");
$("to-desktop").href = base;
$("to-desktop").onclick = () => sessionStorage.setItem("squad-view","desktop");

const tabs = [...document.querySelectorAll("nav [data-tab]")];
function show(name) {
  for (const p of document.querySelectorAll("[data-panel]")) p.hidden = p.dataset.panel !== name;
  for (const b of tabs) b.dataset.tab === name ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current");
  localStorage.setItem("squad-mobile-tab", name);
  if (name === "board") loadBoard();
  else { view = afterGesture(view, { act: "close" }); renderSheet(); }
  if (name === "more") showMore();
  else moreScreen = null;
  if (name === "runs") loadRuns();
  if (name === "terminals") loadSessions();
}
tabs.forEach(b => b.onclick = () => show(b.dataset.tab));

async function call(path) {
  let r;
  try { r = await fetch(path, { cache: "no-store" }); }
  catch (e) { const down = new Error("The hub does not answer. Check Tailscale and that the machine is awake."); down.down = true; throw down; }
  if (r.status === 403) throw new Error("The hub refused this login: " + (await r.text()).trim());
  if (!r.ok) throw new Error("The hub answered " + r.status + ".");
  return r.json();
}

const money = v => "$" + Number(v || 0).toFixed(2);
function detail(w) { $("warn-detail").textContent = w.tip || w.text; $("warn-detail").hidden = false; }
async function status() {
  try {
    const s = await call("/api/status");
    $("msg").textContent = "";
    $("reconnect").hidden = true;
    $("loop").className = s.loop.on ? "on" : "off";
    $("loop-text").textContent = (s.loop.on ? "on" : "off") + " since " + (s.loop.since || "unknown");
    $("t-live").textContent = s.live;
    $("t-spend").textContent = money(s.spend_today);
    $("t-bugs").textContent = s.open_bugs;
    $("warnings").replaceChildren(...s.warnings.map(w => {
      const li = document.createElement("li");
      li.textContent = w.text;
      li.tabIndex = 0;
      li.onclick = () => detail(w);
      return li;
    }));
    $("load").textContent = s.load.line;
  } catch (e) { $("msg").textContent = e.message; $("reconnect").hidden = !e.down; }
}
$("retry").onclick = status;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/mobile/sw.js", { scope: "/mobile/" }).catch(() => {});
status();
setInterval(status, 5000);

let board = null, shown = [], issueKey = "", touch = null;
const reasons = {};   // issue number -> {why, col}: a refusal the card reads on every render, until its card moves again
const rowColumn = n => { for (const g of (board && board.groups) || []) if (g.items.some(i => i.n === n)) return g.name; return ""; };
let view = { col: 0, cols: 0, card: 0, cards: 0, sheet: false };
let bo = JSON.parse(localStorage.getItem("squad-mobile-board") || "{}");
const saveB = () => localStorage.setItem("squad-mobile-board", JSON.stringify(bo));
const rolesOf = el => { const out = []; for (let e = el; e; e = e.parentElement) if (e.dataset && e.dataset.role) out.push(e.dataset.role); return out; };
const columnCards = g => g.items.filter(x => labelOk(bo.labels || [], bo.lmode, x) && spOk(x));
function cardButton(x, i) {
  const b = document.createElement("button");
  b.className = "card"; b.dataset.role = "card"; b.dataset.i = i; b.dataset.n = x.n;
  const id = document.createElement("span"); id.className = "cid"; id.textContent = "#" + x.n;
  const t = document.createElement("span"); t.textContent = x.t;
  b.append(id, t);
  // The reason the hub refused this card's move is page state the card reads, so every render after the refusal draws it
  // again (#829): a span put on the card once is dropped by the next read of the board.
  const why = reasons[x.n];
  if (why) { const r = document.createElement("span"); r.className = "creason"; r.textContent = why.why; b.append(r); }
  // A card the hub marks promotable is the only one that drags, and it names the column the move goes to (`x.pmt`) so
  // this page holds no column list of its own (#829). The hint is drawn only while the card is dragged.
  if (x.pm) {
    b.dataset.pm = "1"; b.dataset.pmt = x.pmt || "";
    const mv = document.createElement("span"); mv.className = "cmv";
    b.append(mv);
  }
  return b;
}
function renderBoard() {
  const cols = board && board.groups ? board.groups : [];
  view.cols = cols.length;
  view.col = Math.min(view.col, Math.max(0, cols.length - 1));
  const g = cols[view.col];
  shown = g ? columnCards(g) : [];
  view.cards = shown.length;
  view.card = Math.min(view.card, Math.max(0, shown.length - 1));
  $("col-name").textContent = g ? g.name : "";
  $("col-count").textContent = g ? (shown.length === g.items.length ? String(g.n) : shown.length + " of " + g.n) : "";
  $("col-prev").disabled = view.col <= 0;
  $("col-next").disabled = view.col >= cols.length - 1;
  $("dots").replaceChildren(...cols.map((c, i) => { const d = document.createElement("i"); if (i === view.col) d.className = "on"; return d; }));
  const empty = document.createElement("p");
  empty.className = "empty";
  empty.textContent = g ? "No card in this column with these filters." : "Loading the board.";
  $("cards").replaceChildren(...(shown.length ? shown.map(cardButton) : [empty]));
}
function setLink(url) {
  const ok = /^https:\/\/github\.com\//.test(url || "");
  $("sh-link").hidden = !ok;
  $("sh-link").href = ok ? url : "#";
}
async function loadIssue(x, key) {
  try {
    const d = await call("/api/issue?n=" + x.n + (x.r ? "&r=" + encodeURIComponent(x.r) : ""));
    if (key !== issueKey) return;
    if (d.err) { $("sh-body").textContent = d.err; return; }
    setLink(d.url);
    $("sh-title").textContent = "#" + d.n + " " + d.title;
    $("sh-labels").textContent = (d.labels || []).join(" · ");
    $("sh-body").textContent = d.body || "No description.";
  } catch (e) { if (key === issueKey) $("sh-body").textContent = e.message; }
}
function renderSheet() {
  const x = shown[view.card];
  const open = view.sheet && !!x;
  $("sheet").hidden = !open;
  if (!open) return;
  const key = (x.r || "") + "#" + x.n;
  $("sh-next").disabled = view.card >= shown.length - 1;
  if (key === issueKey) return;
  issueKey = key;
  $("sheet").scrollTop = 0;
  $("sh-title").textContent = "#" + x.n + " " + x.t;
  $("sh-labels").textContent = (x.l || []).join(" · ");
  $("sh-body").textContent = "Loading the issue.";
  setLink(x.r ? "https://github.com/" + x.r + "/issues/" + x.n : "");
  loadIssue(x, key);
}
function renderFilters() {
  const m = specMode(), sel = bo.labels || [];
  $("bsp").textContent = "Specs: " + SP[m][0];
  $("lmode").textContent = bo.lmode === "all" ? "all" : "by group";
  const LB = [...new Set([...((board && board.labels) || []), ...sel])].sort();
  const lfl = $("lfl");
  if (lfl.dataset.k !== LB.join("\n")) {
    lfl.dataset.k = LB.join("\n");
    lfl.replaceChildren(...LB.map(l => {
      const lab = document.createElement("label"), c = document.createElement("input");
      c.type = "checkbox"; c.value = l;
      lab.append(c, document.createTextNode(" " + l));
      return lab;
    }));
  }
  lfl.querySelectorAll("input").forEach(c => c.checked = sel.includes(c.value));
  $("lf").querySelector("summary").textContent = sel.length ? sel.join(", ") : "labels";
}
const refresh = () => { renderBoard(); renderSheet(); renderFilters(); };
const step = g => { view = afterGesture(view, g); refresh(); };
async function loadBoard() {
  try {
    const b = await call("/api/board");
    if (!b.groups) throw new Error(b.error || "The board is not ready.");
    board = b;
    // A refusal stays on its card while the card keeps the column it was refused in; a read the move reached clears it.
    for (const n of Object.keys(reasons)) if (rowColumn(+n) !== reasons[n].col) delete reasons[n];
    $("bmsg").textContent = b.err ? "(stale)" : "";
    refresh();
  } catch (e) { $("bmsg").textContent = e.message; }
}

// The owner's move from the phone (#829): a drag right past the threshold stages a move to the column the row names
// (`x.pmt`); the Undo delays the write, and the app going hidden or the profile changing cancels it, so a move the owner
// walked away from is never written later. The card never leaves its column here: only the hub's read moves it
// (ADR-0143), and nothing on this page moves a card back or past the column the row names.
let pending = null, pendingTimer = 0, deadTimer = 0, suppressClick = false;
const undoText = t => { $("undo-text").textContent = t; $("undo").hidden = !t; };
function stageMove(x, el) {
  // A second move staged over a live one cancels it, and the Undo line names it: the owner never believes the first card
  // is still moving (#829). The card's own last refusal is answered by this new move.
  const prior = pending && pending.live ? pending.n : 0;
  if (prior) cancelMove("superseded");
  delete reasons[x.n];
  clearTimeout(pendingTimer); clearTimeout(deadTimer);
  pending = moveStage(x.n, x.pmt, Date.now());
  if (el) { el.classList.remove("armed"); el.style.transform = ""; }
  undoText((prior ? "#" + prior + ": move cancelled · " : "") + "#" + x.n + " moves to " + x.pmt + " in a few seconds");
  $("undo-btn").hidden = false;
  pendingTimer = setTimeout(writePending, UNDO_MS);
  refresh();
}
function cancelMove(why) {
  if (!pending || !pending.live) return;
  pending = moveAct(pending, why, Date.now());

}
async function writePending() {
  const p = moveAct(pending, "write", Date.now());

  let r;
  try { r = await fetch("/api/promote", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ issue: p.n }) }); }
  catch (e) { showCardReason(p.n, "the hub did not answer"); return; }   // a failed request is the only "did not answer"
  let d = {};

    if (((r.headers.get("Content-Type") || "").indexOf("json")) < 0) {

    } else d = await r.json();

  if (!r.ok && !d.err) d.err = "the hub answered " + r.status;

}
function showCardReason(n, why) {

  reasons[n] = { why: why, col: rowColumn(n) };

}

const moveHint = el => {

document.addEventListener("touchstart", e => {

  touch = { owner, x: p.clientX, y: p.clientY, atTop: $("sheet").scrollTop === 0,

  const n = t.card ? String(t.card.dataset.n) : "";

  const el = t.card ? $("cards").querySelector('[data-role="card"][data-n="' + n + '"]') || t.card : null;
  if (x && x.pm) stageMove(x, el);

let moreScreen = null, period = "day", moreSeq = 0;
const MORE_CHAINS = [["coding_models", "Coding"], ["review_models", "Review"], ["vision_models", "Vision"], ["router_models", "Router"]];
const CH_W = 280, CH_H = 90;

function chartEl(buckets) {

  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${CH_W} ${CH_H}`);
  buckets.forEach((b, i) => {
    const h = b.spend / max * (CH_H - 4), r = document.createElementNS(NS, "rect"), t = document.createElementNS(NS, "title");
    r.setAttribute("x", i * bw + 1);

    r.setAttribute("height", h);
    r.setAttribute("fill", "#5aa9ff");
    t.textContent = `${b.t}: ${money(b.spend)} · ${b.runs} runs`;

const MORE = {

async function loadMore() {

const runsShown = () => !document.querySelector('[data-panel="runs"]').hidden;

// Pause and resume: the one write the run screen makes. It posts through the hub's forward route to the run's own control

let runId = null, runReply = null, runBusy = false;

  const info = await read(u.info), state = await read(u.state);

let rtouch = null;
document.addEventListener("touchstart", e => { const p = e.touches[0]; rtouch = { x0: p.clientX, y0: p.clientY, atTop: window.scrollY === 0 }; }, { passive: true });

const termOpen = () => !$("termview").hidden;
let termSid = null, termCursor = null, termLast = null, termBusy = false;
function sessionRow(project, s) {

  b.type = "button"; b.className = "runrow"; b.dataset.sid = s.sid; b.dataset.name = s.name;

function readConversation(before) {
  return call("/api/sessions/conversation?sid=" + encodeURIComponent(termSid) + (before ? "&before=" + before : ""));
}
async function loadConversation() {
  if (termBusy || !termOpen() || !termSid) return;
  termBusy = true;
  const sid = termSid, el = $("termview-turns");
  try {
    const page = await readConversation(null);
    if (sid !== termSid) return;
    const keys = page.turns.map(t => JSON.stringify(t));

    $("termview-msg").textContent = "";
