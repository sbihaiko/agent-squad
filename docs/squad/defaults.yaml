# The project settings for this repository (squad/project_settings.py): only the keys the owner changed.
# Owner ruling: four runs and twelve children live at once. Each live run re-reads its whole context on every turn, so
# concurrency multiplies the cache read. The owner watches the CPU at four. Four runs outrun the three gate slots: a
# child's entry gate can wait behind its siblings and reach its bound unproven, so a run that ends unproven is read as
# a wait and never as work lost.
# The ceiling bounds every child's grant, and the owner granted a child cap up to 30 USD: a lower ceiling refuses the
# dispatch node's own grant with spend_over_ceiling.
caps:
  runs: 5                           # owner 2026-11-20: five runs; six ran ahead of the three gate slots, and a wave check
                                    # came back unproven. Owner 2026-11-19: the Doing card count carries cards the loop never
                                    # dispatches, so two idle cards cost half the dispatch at four runs.
  children: 12
  gates: 3                          # owner 2026-11-19, measured: at five, two full gates ran at once and every suite ran
                                    # three to four times slower, so two gates in parallel delivered less than one gate alone.
                                    # The loop gate asks two slots (SG_GATE_WORKERS), never the whole budget, so three holds
                                    # one full gate and one child gate beside it: the landing no longer takes every slot, which
                                    # is what made three fail before. At six three gates ran at once and the load passed 140; at
                                    # two a gate ran slow (#1716).
limits:
  max_budget_usd: 30
