# The project settings for this repository (squad/project_settings.py): only the keys the owner changed.
# Owner ruling 2026-11-03, after the token review: four runs and twelve children live at once, never six and twenty. Each live
# run re-reads its whole context on every turn, so concurrency multiplies the cache read; four runs keep the machine full and
# the gate lock still runs one gate at a time.
# The ceiling bounds every child's grant, and the owner granted a child cap up to 30 USD: a lower ceiling refuses the
# dispatch node's own grant with spend_over_ceiling.
caps:
  runs: 4
  children: 12
  gates: 6                          # one gate at a time on this 8-core machine: at twelve slots three gates held the machine
                                    # between them, each waited for the lock while keeping its slots, and the queue outlived
                                    # the takeover bound (#1191, #1192)
limits:
  max_budget_usd: 30
