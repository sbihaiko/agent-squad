[project]
name = "agent-squad"
version = "0.2.18"
description = "A self-adapting orchestration graph engine on the Claude Agent SDK"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["anyio>=4", "jsonschema>=4", "pyyaml>=6"]

[project.optional-dependencies]
sdk = ["claude-agent-sdk==0.2.161"]
dev = ["ruff", "pytest>=8", "pytest-json-report", "pytest-xdist", "mypy", "types-PyYAML", "types-jsonschema",
       "radon", "coverage", "pylint", "mutmut"]

[project.scripts]
squad = "squad.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["squad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --durations=15"
slow_cap_seconds = "20"
test_deadline_seconds = "60"
heavy_cap_seconds = "2"
markers = ["heavy: this test call takes 1 s or more; the fast battery (-m \"not heavy\") deselects it"]

[tool.mypy]
files = ["squad"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
# claude-agent-sdk is the optional `sdk` extra; it is absent in a dev install and ships no stub we pin.
module = ["claude_agent_sdk"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
# Fits the longest line in the code as it is (285); reflowing 2000+ lines is out of scope.
line-length = 290
# Held-out acceptance tests are pinned by hash (tests/test_subject_key.py); a lint fix would break the pin.
extend-exclude = ["bench/subject/acceptance"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures pack setup into one line with semicolons; splitting them adds noise, not safety.
"tests/**" = ["E702"]
# One-off probes and design checks pack statements into one line, like the test fixtures.
"scripts/**" = ["E701", "E702", "B905", "BLE001", "E501", "B007", "E741"]
"docs/design/**" = ["E701", "E702", "B905", "E741"]
"bench/subject/make_issues.py" = ["E702", "E731"]

[tool.mutmut]
# The one-off quality reading of #881 (radon, coverage, pylint, mutmut are the `dev` extra, never a runtime dep).
# `squad` is the code under mutation; the runner needs these two trees present and these pytest flags.
source_paths = ["squad"]
also_copy = ["docs", "config"]
pytest_add_cli_args = ["-x", "-q", "-p", "no:deepeval", "-p", "no:cacheprovider"]
