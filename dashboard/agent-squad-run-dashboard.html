      // Each loadable skill's hash and the vendor commit. A record made before it has neither: null.
      skills: start.skills && typeof start.skills === "object" ? Object.keys(start.skills).sort().map((k) => ({ name: k, hash: start.skills[k].hash, source: start.skills[k].source })) : null,
      skills_commit: orNull(start.skills_commit) };
  }

  function nodeHarness(doc, events, name) {
    if (!name) return null;
    const nodes = doc && Array.isArray(doc.nodes) ? doc.nodes : [];
    const accepted = events.filter((e) => e.event === "spawn_accepted" && e.child === name);
    if (accepted.length) {
      const a = lastOf(accepted), d = a.definition || {};
      const o = lastOf(events.filter((e) => e.event === "outcome" && e.node === name));
      const disp = nodes.find((n) => n && n.kind === "dispatch" && n.name === a.envelope);
      const skill = skillLabel(d.skill);
      const allow = disp ? { ...disp.allow } : null;
      return {
        kind: "child", name, dispatch: a.envelope,
        available: { skill, model: orNull(d.model), effort: orNull(d.effort), tools: Array.isArray(d.tools) ? d.tools : null,
          stalls: orNull(d.stalls), spend: orNull(d.spend), deadline: orNull(d.deadline) },
        allow: allow ? { tools: Array.isArray(allow.tools) ? allow.tools : null, skills: Array.isArray(allow.skills) ? allow.skills.map(skillLabel) : null,
          models: Array.isArray(allow.models) ? allow.models : null, efforts: Array.isArray(allow.efforts) ? allow.efforts : null,
          stalls: disp.budget && disp.budget.stalls ? disp.budget.stalls : null, spend: disp.budget && disp.budget.spend ? disp.budget.spend : null,
          deadline: orNull(disp.deadline) } : null,
        used: { skill, model: o ? orNull(o.model) : null, effort: o ? orNull(o.effort) : null,
          turns: o ? orNull(o.turns) : null, tokens_in: o ? orNull(o.tokens_in) : null, tokens_out: o ? orNull(o.tokens_out) : null,
          spend: o ? orNull(o.spend) : null, elapsed: o ? orNull(o.elapsed) : null },
      };
    }
    const gn = nodes.find((n) => n && n.name === name);
    if (gn && gn.kind === "agent") {
      const outs = events.filter((e) => e.event === "outcome" && e.node === name);
      const usedOf = (k) => { const o = [...outs].reverse().find((x) => x[k] !== undefined && x[k] !== null); return o ? o[k] : null; };
      return {
        kind: "agent", name,
        available: { skill: orNull(gn.skill), model: orNull(gn.model), effort: orNull(gn.effort), tools: Array.isArray(gn.tools) ? gn.tools : null,
          stalls: gn.budget && gn.budget.stalls ? gn.budget.stalls : null, spend: gn.budget && gn.budget.spend ? gn.budget.spend : null, deadline: orNull(gn.deadline) },
        used: { skill: orNull(gn.skill), model: usedOf("model"), effort: usedOf("effort"), turns: sumOf(outs.map((o) => o.turns)),
          tokens_in: sumOf(outs.map((o) => o.tokens_in)), tokens_out: sumOf(outs.map((o) => o.tokens_out)),
          spend: sumOf(outs.map((o) => o.spend)), elapsed: sumOf(outs.map((o) => o.elapsed)) },
      };
    }
    // A gate, a loop, an each, an action, a wait, or a dispatch carries no harness of its own.
    return { kind: "none", name, nodeKind: gn ? gn.kind : null };
  }

  // shown is the overlay's rule: the record's graph hash equals the loaded graph's. When it is false, only the timeline and the verdict stay.
  // now (epoch seconds) makes the state live: running, stalled, or the verdict. Without it the state is a snapshot: the verdict, or "no verdict yet".
  function runStats(events, doc, shown, now) {
    const start = events[0], v = lastOf(events.filter((e) => e.event === "verdict"));
    const live = num(now) ? liveState(events, now) : null;
    const base = { run_id: start.run_id, graph_name: start.graph_name, state: live ? live.state : v ? v.verdict : "no verdict yet",
      verdict: v ? { verdict: v.verdict, exit_code: v.exit_code, reasons: v.reasons || [] } : null, timeline: runTimeline(events), ...(live ? { live } : {}) };
    if (!shown) return base;
    const outs = events.filter((e) => e.event === "outcome"), starts = events.filter((e) => e.event === "call_start" || e.event === "gate_start");   // a gate's start too (#680)
    const names = [...new Set([...starts, ...outs].map((e) => e.node))];
    const nodes = Object.fromEntries(names.map((nm) => [nm, nodeStats(nm, outs.filter((o) => o.node === nm), starts.filter((c) => c.node === nm).length, doc)]));
    const open = live ? openCalls(events, now) : new Map();
    for (const nm of names) { const c = open.get(nm); nodes[nm].running_for = c ? c.running_for : null; nodes[nm].live = c ? c.live : null; }
    // A gate a dispatch runs on its children has no call of its own: it passes when every child check passed, and fails when one failed.
    for (const [g, c] of Object.entries(dispatchChecks(events, doc))) {
      if (nodes[g]) continue;
      nodes[g] = { ...nodeStats(g, [], 0, doc), outcome: c.fail ? "fail" : "pass", via: c, cause: c.fail ? "check failed" : null, running_for: null };
    }
    // After a verdict, a graph node with no call and no checks never ran. Before it, a node may still run, so nothing is said.
    if (v && doc && Array.isArray(doc.nodes)) for (const n of doc.nodes) if (n && typeof n.name === "string" && !nodes[n.name]) nodes[n.name] = { ...nodeStats(n.name, [], 0, doc), not_run: true, running_for: null };
    return { ...base, nodes, engine: engineHarness(start), totals: runTotals(events, runCap(start, doc), now), causes: failureCauses(events), children: runChildren(events, now) };
  }

  return { nodeStats, engineHarness, nodeHarness, runStats };
}

// Dashboard core module: the JSON Schema check and the engine rules (the port that tests/test_dashboard.py compares with squad.graph.validate). A factory: it takes what it uses from the modules below it, and returns its functions. No DOM here.
// scripts/build_dashboard.py bundles every file of dashboard/core/ in dependency order; nothing loads one file alone.

function schemaModule({ ENGINE, isObj, canonText, same, pyFloat }) {
  const SCHEMA = ENGINE.schema;
  const KINDS = ENGINE.kinds;
  const BUILTIN = new Set(ENGINE.builtin_facts);
  const SEES_FORBIDDEN = new Set(ENGINE.sees_forbidden);
  const WRITE_TOOLS = new Set(ENGINE.write_tools);
  const FORBIDDEN_NAME = new RegExp(ENGINE.forbidden_name);
  const FORBIDDEN_INSTRUMENT = new RegExp(ENGINE.forbidden_instrument, "i");
  const GATES = ENGINE.gate_registry;

  // ---- JSON Schema (the keywords the graph schema uses) ----
  const typeOk = (v, t) => t === "object" ? isObj(v) : t === "array" ? Array.isArray(v) : t === "string" ? typeof v === "string"
    : t === "boolean" ? typeof v === "boolean" : t === "null" ? v === null : t === "integer" ? typeof v === "number" && Number.isInteger(v)
    : t === "number" ? typeof v === "number" : false;

  function resolve(ref, defs) {
    const m = /^#\/\$defs\/(.+)$/.exec(ref);
    if (!m || !defs[m[1]]) throw new Error("unresolved $ref " + ref);
    return defs[m[1]];
  }

  function check(v, s, defs, path) {
    const out = [];
    if (s.$ref) return check(v, resolve(s.$ref, defs), defs, path);
    const at = path.join("/") || "<root>";
    if (s.type !== undefined) {
      const ts = Array.isArray(s.type) ? s.type : [s.type];
      if (!ts.some((t) => typeOk(v, t))) return [{ path: at, message: `${JSON.stringify(v)} is not of type ${ts.join(", ")}` }];
    }
    if (s.const !== undefined && !same(v, s.const)) out.push({ path: at, message: `${JSON.stringify(s.const)} was expected` });
    if (s.enum && !s.enum.some((e) => same(v, e))) out.push({ path: at, message: `${JSON.stringify(v)} is not one of ${JSON.stringify(s.enum)}` });
    if (typeof v === "number") {
      if (s.minimum !== undefined && v < s.minimum) out.push({ path: at, message: `${v} is less than the minimum of ${s.minimum}` });
      if (s.exclusiveMinimum !== undefined && v <= s.exclusiveMinimum) out.push({ path: at, message: `${v} is not greater than ${s.exclusiveMinimum}` });
    }
    if (typeof v === "string") {
      if (s.minLength !== undefined && [...v].length < s.minLength) out.push({ path: at, message: `${JSON.stringify(v)} is too short` });
      if (s.pattern !== undefined && !new RegExp(s.pattern).test(v)) out.push({ path: at, message: `${JSON.stringify(v)} does not match ${JSON.stringify(s.pattern)}` });
    }
    if (Array.isArray(v)) {
      if (s.minItems !== undefined && v.length < s.minItems) out.push({ path: at, message: `${JSON.stringify(v)} is too short` });
      if (s.uniqueItems && new Set(v.map(canonText)).size !== v.length) out.push({ path: at, message: `${JSON.stringify(v)} has non-unique elements` });
      if (s.items) v.forEach((x, i) => out.push(...check(x, s.items, defs, [...path, i])));
    }
    if (isObj(v)) {
      for (const k of s.required || []) if (!(k in v)) out.push({ path: at, message: `${JSON.stringify(k)} is a required property` });
      const props = s.properties || {};
      for (const k of Object.keys(v)) {
        if (k in props) out.push(...check(v[k], props[k], defs, [...path, k]));
        else if (s.additionalProperties === false) out.push({ path: at, message: `Additional properties are not allowed (${JSON.stringify(k)} was unexpected)` });
        else if (isObj(s.additionalProperties)) out.push(...check(v[k], s.additionalProperties, defs, [...path, k]));
      }
    }
    if (s.anyOf) {
      if (!s.anyOf.some((x) => check(v, x, defs, path).length === 0)) out.push({ path: at, message: `${JSON.stringify(v)} is not valid under any of the given schemas` });
    }
    if (s.oneOf) {
      const n = s.oneOf.filter((x) => check(v, x, defs, path).length === 0).length;
      if (n !== 1) out.push({ path: at, message: `${JSON.stringify(v)} is valid under ${n} of the given schemas, not exactly one` });
    }
    if (s.if && check(v, s.if, defs, path).length === 0 && s.then) out.push(...check(v, s.then, defs, path));
    return out;
  }

  // Python repr of a JSON value, for the engine's {x!r} messages.
  function pyRepr(v) {
    if (v === null || v === undefined) return "None";
    if (typeof v === "boolean") return v ? "True" : "False";
    if (typeof v === "number") return Number.isInteger(v) ? String(v) : pyFloat(String(v));
    if (typeof v === "string") {
      const q = v.includes("'") && !v.includes('"') ? '"' : "'";
      let o = q;
      for (const ch of v) {
        const c = ch.codePointAt(0);
        if (ch === "\\") o += "\\\\";
        else if (ch === q) o += "\\" + q;
        else if (ch === "\n") o += "\\n";
        else if (ch === "\r") o += "\\r";
        else if (ch === "\t") o += "\\t";
        else if (c < 0x20 || c === 0x7f) o += "\\x" + c.toString(16).padStart(2, "0");
        else o += ch;
      }
      return o + q;
    }
    if (Array.isArray(v)) return "[" + v.map(pyRepr).join(", ") + "]";
    return "{" + Object.entries(v).map(([k, x]) => pyRepr(k) + ": " + pyRepr(x)).join(", ") + "}";
  }

  const E = (node, message) => ({ node, message });

  function nodeSchemaErrors(node) {
    const kind = node.kind;
    const name = typeof node.name === "string" ? node.name : null;
    if (!KINDS.includes(kind)) return [E(name, `kind ${pyRepr(kind)} is not one of the seven kinds: ${KINDS.join(", ")}`)];
    const explicit = [];
    const s = { ...node };
    if (kind === "gate") {
      for (const [key, msg] of [["when", "a gate never carries a when"], ["adapt", "a gate never adapts"],
        ["deadline", "a gate carries no deadline"]]) {
        if (key in s) { explicit.push(E(name, msg)); delete s[key]; }
      }
      const nxt = s.next || {};
      if (isObj(nxt) && nxt.fail !== undefined && nxt.fail !== null && !["repeat", "exit:fail"].includes(nxt.fail)) {
        explicit.push(E(name, `a gate's fail never names a node; got ${pyRepr(nxt.fail)}`));
        const { fail, ...rest } = nxt;
        s.next = rest;
      }
    }
    if (kind === "loop" && "deadline" in s) { explicit.push(E(name, "a loop carries no deadline")); delete s.deadline; }
    const errs = check(s, { $ref: `#/$defs/${kind}` }, SCHEMA.$defs, []).map((e) => E(name, `${e.path === "<root>" ? kind : e.path}: ${e.message}`));
    return [...explicit, ...errs];
  }

  function whenErrors(nm, when, nodes, known, factDefs) {
    const f = when.fact;
    if (f.startsWith("outcome:")) return nodes[f.slice(8)] ? [] : [E(nm, `when names unknown node ${f.slice(8)}`)];
    if (!known.has(f)) return [E(nm, `when reads unregistered fact ${f}`)];
    const d = factDefs[f], v = when.value;
    if (d && d.type === "enum" && !(d.values || []).some((x) => same(x, v))) return [E(nm, `when value ${pyRepr(v)} is not a value of fact ${f}`)];
    if (d && d.type === "bool" && typeof v !== "boolean") return [E(nm, `when value for bool fact ${f} must be a bool`)];
    if (d && (d.type === "int" || d.type === "number") && typeof v !== "number") return [E(nm, `when value for numeric fact ${f} must be a number`)];
    return [];
  }

  function factErrors(doc) {
    const errs = [], seen = new Set();
    for (const f of doc.facts) {
      const n = f.name;
      if (seen.has(n)) errs.push(E(null, `fact ${n}: registered twice`));
      seen.add(n);
      if (FORBIDDEN_NAME.test(n)) errs.push(E(null, `fact ${n}: a gate rate, a finding count or trend, a self-report, or a judge score never triggers`));
      if (!f.instrument.startsWith("code:")) errs.push(E(null, `fact ${n}: instrument must be code, not a model`));
      else if (FORBIDDEN_INSTRUMENT.test(f.instrument)) errs.push(E(null, `fact ${n}: instrument names a model, a judge, a cross-run source, or the adaptation report`));
    }
    return errs;
  }

  function subtree(nodes, name) {
    const out = [], stack = [name];
    while (stack.length) {
      const n = nodes[stack.pop()];
      for (const c of n.children || []) if (nodes[c]) { out.push(c); stack.push(c); }
    }
    return out;
  }

  function eachWorkspaceErrors(nm, each, nodes, run) {
    const mp = Math.min(each.max_parallel !== undefined ? each.max_parallel : run.max_parallel, run.max_parallel);
    if (each.mode !== "parallel" || mp < 2) return [];
    const sub = subtree(nodes, nm).map((c) => nodes[c]);
    const created = new Map();
    for (const n of sub) if (n.kind === "action" && n.effect === "worktree_create") {
      const w = n.workspace === undefined ? null : n.workspace;
      created.set(w, [...(created.get(w) || []), n.name]);
    }
    const errs = [];
    for (const [w, ns] of created) if (ns.length > 1) errs.push(E(nm, `parallel items share workspace ${pyRepr(w)}: created by ${ns.join(", ")}`));
    for (const n of sub) {
      if (!["agent", "action"].includes(n.kind)) continue;
      const writes = (n.kind === "action" && n.effect !== "worktree_create") || (n.kind === "agent" && n.tools.some((t) => WRITE_TOOLS.has(t)));
      if (!writes) continue;
      const ws = n.workspace === undefined ? null : n.workspace;
      if (ws === null || ws === "." || !created.has(ws)) errs.push(E(nm, `parallel items share workspace ${pyRepr(ws)} at ${n.name}: no worktree_create makes one per item`));
    }
    return errs;
  }

  function fileErrors(nodes) {
    const writers = new Map();
    for (const n of Object.values(nodes)) for (const f of n.writes || []) writers.set(f, [...(writers.get(f) || []), n.name]);
    const errs = [];
    for (const n of Object.values(nodes)) for (const f of n.reads || []) {
      const w = (writers.get(f) || []).filter((x) => x !== n.name);
      if (w.length) errs.push(E(n.name, `reads ${pyRepr(f)}, which ${w.join(", ")} writes: a declared input is never written by the graph`));
    }
    return errs;
  }

  function reviewParamsOk(p) {
    const argv = p.argv, dl = p.deadline;
    return Array.isArray(argv) && argv.length > 0 && argv.every((a) => typeof a === "string" && a.length > 0) && typeof dl === "number" && dl > 0;
  }

  function dispatchErrors(doc, n, nodes) {
    const nm = n.name, errs = [];
    const e = nodes[n.entry];
    if (e) {
      if (e.kind !== "agent") errs.push(E(nm, `entry ${n.entry} is not an agent`));
      else if (!e.may_spawn) errs.push(E(nm, `entry ${n.entry} lacks may_spawn`));
      if ("when" in e) errs.push(E(nm, `entry ${n.entry} carries a when, which would bypass the dispatch`));
    }
    for (const c of n.checks) if (nodes[c] && nodes[c].kind !== "gate") errs.push(E(nm, `check ${c} is not a gate`));
    if ("review" in n && nodes[n.review] && nodes[n.review].check !== "review-command") errs.push(E(nm, `review ${n.review} is not a review-command gate`));
    for (const key of ["stalls", "spend"]) if (n.budget[key].min > n.budget[key].max) errs.push(E(nm, `child ${key} min above max`));
    if (n.max_parallel > doc.run.max_parallel) errs.push(E(nm, "max_parallel above the run block"));
    const names = n.allow.skills.map((x) => x.name);
    if (names.length !== new Set(names).size) errs.push(E(nm, "duplicate skill in allow"));
    return errs;
  }

  function adaptErrors(nm, n, a, known) {
    const k = n.kind, errs = [];
    if (!["agent", "loop"].includes(k)) errs.push(E(nm, `adapt on a ${k}`));
    for (const x of a.kinds) {
      if (x === "shrink_loop_max" && k !== "loop") errs.push(E(nm, "shrink_loop_max on a non-loop"));
      if (x !== "shrink_loop_max" && k !== "agent") errs.push(E(nm, `${x} on a non-agent`));
    }
    for (const [kind, key] of [["set_model", "models"], ["set_effort", "efforts"], ["narrow_tools", "tools"]]) {
      if (a.kinds.includes(kind) && !(a[key] && a[key].length)) errs.push(E(nm, `${kind} needs a non-empty ${key} list in adapt`));
    }
    if (a.tools !== undefined && a.tools !== null) {
      const own = new Set(n.tools || []);
      if (!a.tools.every((t) => own.has(t))) errs.push(E(nm, "adapt tools widen the node's tools"));
    }
    if (a.models && a.models.length && !a.models.includes(n.model)) errs.push(E(nm, "adapt models exclude the node's own model"));
    if (a.efforts && a.efforts.length && n.effort && !a.efforts.includes(n.effort)) errs.push(E(nm, "adapt efforts exclude the node's own effort"));
    for (const s of a.sees || []) {
      if (SEES_FORBIDDEN.has(s)) errs.push(E(nm, `sees lists ${s}: a proposer may not see it`));
      else if (!known.has(s) && !s.startsWith("outcome:")) errs.push(E(nm, `sees unregistered fact ${s}`));
    }
    return errs;
  }

  // The engine's validate(): every error of a graph document. [] means valid.
  function validate(doc) {
    if (!isObj(doc)) return [E(null, "a graph document is one JSON object")];
    const top = JSON.parse(JSON.stringify(SCHEMA));
    top.properties.nodes = { type: "array", minItems: 1 };
    let errs = check(doc, top, SCHEMA.$defs, []).map((e) => E(null, `schema: ${e.path}: ${e.message}`));
    if (!Array.isArray(doc.nodes)) return errs;
    for (const n of doc.nodes) errs.push(...(isObj(n) ? nodeSchemaErrors(n) : [E(null, "a node is one JSON object")]));
    if (errs.length) return errs;
    const nodes = {}, parents = {};
    for (const n of doc.nodes) {
      if (nodes[n.name]) errs.push(E(n.name, "duplicate node name"));
      nodes[n.name] = n;
    }
    const factDefs = Object.fromEntries(doc.facts.map((f) => [f.name, f]));
    const known = new Set([...Object.keys(factDefs), ...BUILTIN]);
    errs.push(...factErrors(doc));
    const gateIds = Object.fromEntries(doc.gates.map((g) => [g.id, new Set(g.params)]));
    for (const [gid, params] of Object.entries(gateIds)) {
      if (!(gid in GATES)) errs.push(E(null, `gates registry: check id ${gid} is outside the engine registry`));
      else if (params.size !== GATES[gid].length || !GATES[gid].every((p) => params.has(p))) errs.push(E(null, `gates registry: params of ${gid} differ from the engine registry`));
    }
    if (!nodes[doc.root] || nodes[doc.root].kind !== "loop") errs.push(E(doc.root, "root must name a loop"));
    for (const n of Object.values(nodes)) for (const c of n.children || []) {
      if (!nodes[c]) errs.push(E(n.name, `unknown child ${c}`));
      else if (c in parents) errs.push(E(c, "two parents"));
      parents[c] = n.name;
    }
    const entries = {};
    for (const n of Object.values(nodes)) {
      if (n.kind !== "dispatch") continue;
      for (const c of [n.entry, ...n.checks, ...("review" in n ? [n.review] : [])]) {
        if (!nodes[c]) { errs.push(E(n.name, `unknown entry or check ${c}`)); continue; }
        if (c in parents) errs.push(E(c, "two parents"));
        parents[c] = n.name;
      }
      entries[n.entry] = n.name;
    }
    const reviews = new Set(Object.values(nodes).filter((n) => n.kind === "dispatch" && "review" in n).map((n) => n.review));
    const run = doc.run;
    const minSpend = Object.values(nodes).filter((n) => ["agent", "dispatch"].includes(n.kind)).map((n) => n.budget.spend.min);
    if (minSpend.length && run.spend_cap < Math.max(...minSpend)) errs.push(E(null, `run spend cap ${run.spend_cap} is below an agent's spend minimum ${Math.max(...minSpend)}`));
    for (const n of Object.values(nodes)) {
      const nm = n.name, k = n.kind;
      if (nm !== doc.root && !(nm in parents)) errs.push(E(nm, "orphan: no parent"));
      if ("deadline" in n && k !== "wait" && run.deadline !== null && n.deadline > run.deadline) errs.push(E(nm, "deadline above the run deadline"));
      const par = nodes[parents[nm]];
      if (n.next && Object.values(n.next).includes("repeat") && !(par && par.kind === "loop")) errs.push(E(nm, "repeat is valid only on a child of a loop"));
      if ("when" in n) errs.push(...whenErrors(nm, n.when, nodes, known, factDefs));
      if (k === "gate") {
        if (!(n.check in gateIds)) errs.push(E(nm, `unknown check ${n.check}`));
        else {
          const ps = new Set(Object.keys(n.params));
          if (ps.size !== gateIds[n.check].size || ![...ps].every((p) => gateIds[n.check].has(p))) errs.push(E(nm, "params differ from the gates registry"));
          else if (n.check === "review-command" && !reviews.has(nm)) errs.push(E(nm, "a review-command gate runs only as a dispatch's review"));
          else if (n.check === "review-command" && !reviewParamsOk(n.params)) errs.push(E(nm, "review-command params: argv is a non-empty list of strings, deadline is seconds above 0"));
        }
      } else if (k === "each") {
        if (!(n.items in factDefs) && !BUILTIN.has(n.items)) errs.push(E(nm, "items is not a registered fact"));
        errs.push(...eachWorkspaceErrors(nm, n, nodes, run));
      } else if (k === "agent") {
        for (const key of ["stalls", "spend"]) if (n.budget[key].min > n.budget[key].max) errs.push(E(nm, `${key} min above max`));
        if (n.may_spawn && !(nm in entries)) errs.push(E(nm, "may_spawn on a node that is not a dispatch entry"));
        if (n.may_propose && !("adapt" in n)) errs.push(E(nm, "may_propose without an adapt block"));
      } else if (k === "loop") {
        if (n.max.min > n.max.value) errs.push(E(nm, "max min above value"));
        if ("when" in n && !n.children.some((c) => nodes[c] && ["agent", "each", "action", "dispatch"].includes(nodes[c].kind))) errs.push(E(nm, "a loop with a when must hold an agent, each, action, or dispatch child"));
      } else if (k === "dispatch") errs.push(...dispatchErrors(doc, n, nodes));
      if (n.adapt) errs.push(...adaptErrors(nm, n, n.adapt, known));
    }
    return [...errs, ...fileErrors(nodes)];
  }

  return { SCHEMA, KINDS, resolve, validate };
}

// Dashboard core module: edit operations: node edits, field groups, add, remove, rename, change kind, connect, disconnect. A factory: it takes what it uses from the modules below it, and returns its functions. No DOM here.
// scripts/build_dashboard.py bundles every file of dashboard/core/ in dependency order; nothing loads one file alone.

function editsModule({ SCHEMA, KINDS, isObj, same, clone, resolve }) {
  // ---- What a person may write ----
  // A node edit may not change a gate's check id or its params, a node's name, or its kind.
  function applyNodeEdit(doc, name, edited) {
    const i = doc.nodes.findIndex((n) => n.name === name);
    if (i < 0) return { error: `No node named ${name}.` };
    const old = doc.nodes[i];
    if (!isObj(edited)) return { error: "A node is one JSON object." };
    if (edited.name !== old.name) return { error: "The JSON edit keeps the name: use Rename, which updates every reference." };
    if (edited.kind !== old.kind) return { error: "The JSON edit keeps the kind: use Change kind." };
    if (old.kind === "gate" && (edited.check !== old.check || !same(edited.params, old.params))) return { error: "A gate's check id and its thresholds are read-only." };
    const nodes = doc.nodes.slice();
    nodes[i] = edited;
    return { doc: { ...doc, nodes } };
  }

  // ---- Fields grouped by purpose ----
  // The fields of a kind come from the engine's own schema, so a new schema field shows up with no edit here.
  // Every key a node holds sits in exactly one group; a key the schema does not know sits in "unknown" and is kept as written.
  const GROUPS = [
    { id: "identity", title: "Identity", open: true, keys: ["name", "kind"] },
    { id: "settings", title: "Settings", open: true, keys: ["model", "effort", "skill", "tools", "workspace", "output_key", "owner", "default", "effect", "items", "mode", "join", "entry", "checks", "review", "may_propose", "may_spawn"] },
    { id: "instructions", title: "Instructions", open: true, keys: ["instructions"] },
    { id: "limits", title: "Limits", open: true, keys: ["budget", "deadline", "max", "max_by", "stall_after", "max_parallel", "max_depth", "max_children"] },
    { id: "control", title: "Control", open: true, keys: ["when", "next", "children", "adapt"] },
    { id: "files", title: "Files and envelope", open: false, keys: ["reads", "writes", "allow"] },
    { id: "gate", title: "Gate (read-only)", open: true, keys: ["check", "params"] },
  ];
  const GROUPED = new Set(GROUPS.flatMap((g) => g.keys));
  const STRUCTURED = new Set(["budget", "next", "adapt", "when"]);
  const SUGGEST = { model: "models", effort: "efforts", tools: "tools", skill: "skills" };

  function propsOf(kind) {
    const def = SCHEMA.$defs && SCHEMA.$defs[kind];
    return def && def.properties ? def.properties : {};
  }

  // The editor of one field: text, a number, a switch, a choice, a comma list of words, a text area, or JSON for a nested value.
  function fieldType(key, prop0) {
    if (key === "instructions") return "area";
    if (key === "name" || key === "kind") return "text";
    if (STRUCTURED.has(key)) return "structured";
    const prop = prop0 && prop0.$ref ? resolve(prop0.$ref, SCHEMA.$defs) : prop0;
    if (!prop) return "json";
    if (prop.enum) return "enum";
    if (prop.type === "boolean") return "bool";
    if (prop.type === "integer") return "number";
    if (prop.type === "string") return "text";
    if (prop.type === "array" && prop.items && prop.items.type === "string") return "list";
    return "json";
  }

  function shown(type, v) {
    if (v === undefined) return "";
    if (type === "list" && Array.isArray(v) && v.every((x) => typeof x === "string")) return v.join(", ");
    if (type === "text" || type === "area" || type === "enum") return typeof v === "string" ? v : JSON.stringify(v);
    if (type === "bool" || type === "number") return typeof v === "number" || typeof v === "boolean" ? String(v) : JSON.stringify(v);
    return JSON.stringify(v, null, 2);
  }

  // The parts of a nested field, read from the schema: each part is one input at a path in the field's object.
  function partsOf(key, prop0) {
    const prop = prop0.$ref ? resolve(prop0.$ref, SCHEMA.$defs) : prop0;
    const sub = (q) => (q.$ref ? resolve(q.$ref, SCHEMA.$defs) : q);
    const parts = [];
    if (key === "budget") {
      for (const cap of Object.keys(prop.properties))
        for (const [k, q0] of Object.entries(sub(prop.properties[cap]).properties)) {
          const q = sub(q0);
          parts.push({ path: `${cap}.${k}`, label: `${cap} ${k}`, input: q.type === "integer" ? "int" : "num" });
        }
    } else if (key === "next") {
      for (const o of Object.keys(prop.properties)) parts.push({ path: o, label: o, input: "select", choices: sub(prop.properties[o]).enum });
    } else if (key === "adapt") {
      for (const [k, q0] of Object.entries(prop.properties)) {
        const q = sub(q0);
        if (q.type === "array" && q.items.enum) parts.push({ path: k, label: k, input: "check", choices: q.items.enum });
        else if (q.type === "array") parts.push({ path: k, label: k, input: "list" });
      }
    } else if (key === "when") {
      for (const [k, q0] of Object.entries(prop.properties)) {
        const q = sub(q0);
        if (q.enum) parts.push({ path: k, label: k, input: "select", choices: q.enum });
        else parts.push({ path: k, label: k, input: k === "value" ? "any" : "text" });
      }
    }
    return parts;
  }

  function fieldGroups(n) {
    const props = propsOf(n.kind);
    const out = [];
    const placed = new Set();
    for (const g of GROUPS) {
      const fields = g.keys.filter((k) => k in props).map((k) => {
        placed.add(k);
        const type = fieldType(k, props[k]);
        const f = { key: k, type, present: k in n, value: shown(type, n[k]) };
        if (type === "enum") f.enum = (props[k].$ref ? resolve(props[k].$ref, SCHEMA.$defs) : props[k]).enum;
        if (type === "structured") f.parts = partsOf(k, props[k]);
        if (SUGGEST[k]) f.suggest = SUGGEST[k];
        if (k === "name" || k === "kind" || (n.kind === "gate" && (k === "check" || k === "params"))) f.readonly = true;
        return f;
      });
      if (fields.length) out.push({ id: g.id, title: g.title, open: g.open || fields.some((f) => f.present), fields });
    }
    const unknown = Object.keys(n).filter((k) => !placed.has(k)).map((k) => ({ key: k, type: "json", present: true, value: shown("json", n[k]), unknown: true }));
    if (unknown.length) out.push({ id: "unknown", title: "Unknown fields (kept on save)", open: true, fields: unknown });
    return out;
  }

  // One field edit. Blank removes the field. A value the type cannot read is refused with no change; any other value goes in, and the rules of validate() judge it.
  function setField(doc, name, key, text) {
    const list = Array.isArray(doc.nodes) ? doc.nodes : [];
    const old = list.find((n) => isObj(n) && n.name === name);
    if (!old) return { error: `No node named ${name}.` };
    if (key === "name") return { error: "Use Rename: it updates every reference." };
    if (key === "kind") return { error: "Use Change kind." };
    const props = propsOf(old.kind);
    // A key in no group is shown as JSON in "unknown", so it is read back as JSON, whatever its schema type.
    const type = GROUPED.has(key) ? fieldType(key, props[key]) : "json";
    const t = String(text);
    let value;
    if (t.trim() === "") value = undefined;
    else if (type === "text" || type === "area" || type === "enum") value = t;
    else if (type === "number") {
      value = Number(t);
      if (!Number.isInteger(value)) return { error: `${key} takes a whole number, not ${JSON.stringify(t)}.` };
    } else if (type === "bool") {
      if (t.trim() !== "true" && t.trim() !== "false") return { error: `${key} is true or false.` };
      value = t.trim() === "true";
    } else if (type === "list") value = t.split(",").map((x) => x.trim()).filter(Boolean);
    else {
      try { value = JSON.parse(t); } catch (e) { return { error: `${key} is not valid JSON: ${e.message}` }; }
    }
    const edited = {};
    for (const k of Object.keys(old)) if (k !== key || value !== undefined) edited[k] = k === key ? value : old[k];
    if (value !== undefined && !(key in old)) edited[key] = value;
    if (value === undefined && !(key in old)) return { doc };
    return applyNodeEdit(doc, name, edited);
  }

  // ---- Add and remove a node ----
  // Both are pure: they return a new document. The rules of validate() judge the result, so a gap shows on the node.
  const HOLDS_CHILDREN = ["loop", "each"];

  function newNodeBody(doc, kind, name, opts) {
    const dispatch = doc.nodes.find((n) => isObj(n) && n.kind === "dispatch");
    const budget = () => ({ stalls: { min: 1, max: 5 }, spend: { min: 0.01, max: 1 } });
    if (kind === "agent") return { name, kind, model: "sonnet", tools: [], budget: budget() };
    if (kind === "wait") return { name, kind, owner: "owner", deadline: 3600, default: "fail" };
    if (kind === "action") return { name, kind, effect: "commit" };
    if (kind === "loop") return { name, kind, max: { value: 3, min: 1 }, children: [] };
    if (kind === "each") return { name, kind, items: ((doc.facts || [])[0] || {}).name || "items", mode: "sequence", join: "all", children: [], deadline: 3600 };
    if (kind === "dispatch") {
      // A dispatch names an entry agent and checks that exist; the person connects them. Until then the engine rule shows on the node.
      const keep = ["max_depth", "max_children", "max_parallel", "deadline", "join", "allow", "budget"];
      const base = dispatch ? clone(Object.fromEntries(keep.map((k) => [k, dispatch[k]]))) : { max_depth: 2, max_children: 4, max_parallel: 1, deadline: 3600, join: "all", budget: { stalls: { min: 2, max: 5 }, spend: { min: 0.05, max: 4 } },
        allow: { models: ["sonnet"], efforts: ["medium"], tools: [], skills: [{ name: "tdd", version: "1" }], workspaces: ["worktrees/child"] } };
      return { ...base, name, kind, entry: "todo_entry", checks: ["todo_check"] };
    }
    // A gate picks a registered check id and never adds one. Its thresholds are not authored here: copy a gate that already holds them, else leave each one null.
    const reg = (doc.gates || []).find((g) => g.id === opts.check);
    const twin = doc.nodes.find((n) => isObj(n) && n.kind === "gate" && n.check === opts.check);
    return { name, kind, check: reg.id, params: twin ? clone(twin.params) : Object.fromEntries((reg.params || []).map((p) => [p, null])) };
  }

  // A gate picks a check id the registry holds, and the dashboard never adds one.
  function gateOpts(doc, opts) {
    if (!(doc.gates || []).length) return { error: "The gates registry is empty: a gate needs a registered check id." };
    const check = opts.check === undefined ? doc.gates[0].id : opts.check;
    if (!doc.gates.some((g) => g.id === check)) return { error: `${check} is not in the gates registry. The dashboard picks a registered check and never adds one.` };
    return { opts: { ...opts, check } };
  }

  function addNode(doc, kind, opts) {
    opts = opts || {};
    if (!KINDS.includes(kind)) return { error: `${kind} is not one of the seven kinds: ${KINDS.join(", ")}.` };
    const byName = Object.fromEntries(doc.nodes.filter(isObj).map((n) => [n.name, n]));
    const parent = opts.parent !== undefined ? opts.parent : (byName[doc.root] && HOLDS_CHILDREN.includes(byName[doc.root].kind) ? doc.root : null);
    if (opts.parent !== undefined && !(byName[parent] && HOLDS_CHILDREN.includes(byName[parent].kind))) return { error: `${parent} is not a loop or an each, so it holds no child.` };
    if (kind === "gate") {
      const g = gateOpts(doc, opts);
      if (g.error) return g;
      opts = g.opts;
    }
    let n = 1;
    while (byName[`${kind}_${n}`]) n++;
    const name = `${kind}_${n}`;
    const body = newNodeBody(doc, kind, name, opts);
    const nodes = doc.nodes.map((x) => (isObj(x) && x.name === parent ? { ...x, children: [...(x.children || []), name] } : x));
    nodes.push(body);
    return { doc: { ...doc, nodes }, name };
  }

  // The nodes a dispatch names: its entry, its checks, and its review when it has one.
  const dispatchLinks = (n) => [n.entry, ...(Array.isArray(n.checks) ? n.checks : []), ...("review" in n ? [n.review] : [])];

  // The review gate a dispatch names, as the editor shows it: the gate, its command and its deadline. Null when the dispatch names none.
  // A name with no gate behind it shows with no command, so the page says so and the rules name the error.
  function reviewGate(doc, name) {
    const d = doc.nodes.find((n) => isObj(n) && n.name === name);
    if (!d || d.kind !== "dispatch" || !("review" in d)) return null;
    const g = doc.nodes.find((n) => isObj(n) && n.name === d.review);
    const p = g && g.kind === "gate" && isObj(g.params) ? g.params : null;
    return { gate: d.review, command: p && Array.isArray(p.argv) ? p.argv.join(" ") : null, deadline: p && typeof p.deadline === "number" ? p.deadline : null };
  }

  function removeNode(doc, name) {
    const gone = doc.nodes.find((n) => isObj(n) && n.name === name);
    if (!gone) return { error: `No node named ${name}.` };
    if (name === doc.root) return { error: "The root loop is the start of the graph and is not removed." };
    const warnings = [];
    const nodes = doc.nodes.filter((n) => n !== gone).map((n) => {
      if (!isObj(n)) return n;
      if (Array.isArray(n.children) && n.children.includes(name)) {
        warnings.push({ node: n.name, message: `${n.name} no longer lists child ${name}` });
        return { ...n, children: n.children.filter((c) => c !== name) };
      }
      if (n.kind === "dispatch" && dispatchLinks(n).includes(name)) {
        warnings.push({ node: n.name, message: `${n.name} still names ${name} as its ${n.entry === name ? "entry" : n.review === name ? "review" : "check"}: choose another` });
      }
      return n;
    });
    const orphans = [...(gone.children || []), ...(gone.kind === "dispatch" ? dispatchLinks(gone) : [])];
    for (const c of orphans) if (nodes.some((n) => isObj(n) && n.name === c)) warnings.push({ node: c, message: `${c} has no parent now: it is an orphan until you give it one` });
    return { doc: { ...doc, nodes }, warnings };
  }

  // The model, effort, tools, and skills a node names that the served snapshot does not hold. Allowed and never blocked: the side panel only notes them.
  function unseenValues(n, served) {
    const skills = Array.isArray(n.skills) ? n.skills.map((s) => (isObj(s) && s.name !== undefined ? s.name : s)) : [];
    return [["model", "models", [n.model]], ["effort", "efforts", [n.effort]], ["tools", "tools", n.tools], ["skills", "skills", skills]]
      .flatMap(([label, key, vs]) => (Array.isArray(vs) ? vs : []).filter((v) => typeof v === "string" && !(served[key] || []).includes(v)).map((v) => `${label} ${v}`));
  }

  // ---- Rename a node and change its kind ----
  // Both are pure and return a new document. The rules of validate() judge the result, so a gap shows on the node.
  const NAME_RE = new RegExp(SCHEMA.$defs.name.pattern);

  // The places a node name is written: root, children, a dispatch's entry, checks and review, a `when` or a `sees` entry named outcome:<node>.
  function renameNode(doc, old, neu) {
    const list = Array.isArray(doc.nodes) ? doc.nodes : [];
    if (!list.some((n) => isObj(n) && n.name === old)) return { error: `No node named ${old}.` };
    if (typeof neu !== "string" || !NAME_RE.test(neu)) return { error: `${JSON.stringify(neu)} is not a legal name: it starts with a lowercase letter and holds lowercase letters, digits, and underscores.` };
    if (neu === old) return { error: `${old} already has that name.` };
    if (list.some((n) => isObj(n) && n.name === neu)) return { error: `A node named ${neu} exists already.` };
    const swap = (v) => (v === old ? neu : v);
    const swapFact = (f) => (f === `outcome:${old}` ? `outcome:${neu}` : f);
    const nodes = list.map((n) => {
      if (!isObj(n)) return n;
      const m = { ...n };
      if (n.name === old) m.name = neu;
      if (Array.isArray(n.children)) m.children = n.children.map(swap);
      if (n.entry === old) m.entry = neu;
      if (Array.isArray(n.checks)) m.checks = n.checks.map(swap);
      if (n.review === old) m.review = neu;
      if (isObj(n.when) && typeof n.when.fact === "string") m.when = { ...n.when, fact: swapFact(n.when.fact) };
      if (isObj(n.adapt) && Array.isArray(n.adapt.sees)) m.adapt = { ...n.adapt, sees: n.adapt.sees.map(swapFact) };
      return m;
    });
    return { doc: { ...doc, nodes, ...(doc.root === old ? { root: neu } : {}) } };
  }

  function layoutRename(layout, old, neu) {
    const out = {};
    for (const [k, v] of Object.entries(layout)) out[k === old ? neu : k] = v;
    return out;
  }

  // The name, the place in the graph, and every field stay. A field the new kind does not allow stays too: its schema error shows on the node.
  // A gate is never a source: its check id and thresholds are read-only, so changing it would write what a person may not write.
  function changeKind(doc, name, kind, opts) {
    opts = opts || {};
    if (!KINDS.includes(kind)) return { error: `${kind} is not one of the seven kinds: ${KINDS.join(", ")}.` };
    const old = (Array.isArray(doc.nodes) ? doc.nodes : []).find((n) => isObj(n) && n.name === name);
    if (!old) return { error: `No node named ${name}.` };
    if (old.kind === kind) return { error: `${name} is already a ${kind}.` };
    if (old.kind === "gate") return { error: `${name} is a gate: its check id and thresholds are read-only. Remove it and add the node you want.` };
    if (kind === "gate") {
      const g = gateOpts(doc, opts);
      if (g.error) return g;
      opts = g.opts;
    }
    const body = { name, kind };
    for (const [k, v] of Object.entries(newNodeBody(doc, kind, name, opts))) if (k !== "name" && k !== "kind") body[k] = v;
    for (const [k, v] of Object.entries(old)) if (k !== "name" && k !== "kind") body[k] = clone(v);
    return { doc: { ...doc, nodes: doc.nodes.map((n) => (n === old ? body : n)) }, name };
  }

  // ---- Connect and disconnect ----
  // A link is a loop or each child, a dispatch entry, or a dispatch check. `next` holds reserved words, never a node name, so no link sets it.
  // Both functions are pure. A second parent or an orphan is allowed: validate() shows it on the node, and a save is never blocked.
  function reaches(byName, from, to, seen) {
    if (from === to) return true;
    seen = seen || new Set();
    if (seen.has(from) || !byName[from]) return false;
    seen.add(from);
    const n = byName[from];
    const kids = [...(Array.isArray(n.children) ? n.children : []), ...(n.kind === "dispatch" ? dispatchLinks(n) : [])];
    return kids.some((c) => reaches(byName, c, to, seen));
  }
  const hasParent = (nodes, name) => nodes.some((n) => isObj(n) && ((Array.isArray(n.children) && n.children.includes(name)) || (n.kind === "dispatch" && dispatchLinks(n).includes(name))));

  function connect(doc, from, to) {
    const byName = Object.fromEntries(doc.nodes.filter(isObj).map((n) => [n.name, n]));
    const a = byName[from], b = byName[to];
    if (!a) return { error: `No node named ${from}.` };
    if (!b) return { error: `No node named ${to}.` };
    if (from === to) return { error: `${from} cannot hold itself.` };
    if (to === doc.root) return { error: `${to} is the root loop: it has no parent.` };
    if (reaches(byName, to, from)) return { error: `${to} already holds ${from}: this link would make a cycle.` };
    const warnings = [];
    let patch;
    if (HOLDS_CHILDREN.includes(a.kind)) {
      if ((a.children || []).includes(to)) return { error: `${to} is already a child of ${from}.` };
      patch = { children: [...(a.children || []), to] };
    } else if (a.kind === "dispatch") {
      if (b.kind === "gate" && b.check === "review-command") {
        // A review-command gate runs only as the dispatch's review, never as a check (ADR-0113).
        if (a.review === to) return { error: `${to} is already the review of ${from}.` };
        if ("review" in a) return { error: `${from} has the review ${a.review}: disconnect it first.` };
        patch = { review: to };
      } else if (b.kind === "gate") {
        if ((a.checks || []).includes(to)) return { error: `${to} is already a check of ${from}.` };
        patch = { checks: [...(a.checks || []), to] };
      } else {
        if (a.entry === to) return { error: `${to} is already the entry of ${from}.` };
        patch = { entry: to };
      }
    } else return { error: `${from} is ${/^[aeiou]/.test(a.kind) ? "an" : "a"} ${a.kind}: only a loop, an each, or a dispatch holds a link.` };
    const nodes = doc.nodes.map((n) => (n === a ? { ...a, ...patch } : n));
    if (patch.entry) {
      const old = byName[a.entry];
      if (old && !hasParent(nodes, old.name)) warnings.push({ node: old.name, message: `${old.name} has no parent now: it is an orphan until you give it one` });
    }
    return { doc: { ...doc, nodes }, warnings };
  }

  function disconnect(doc, from, to) {
    const a = doc.nodes.find((n) => isObj(n) && n.name === from);
    if (!a) return { error: `No node named ${from}.` };
    let patch;
    if ((a.children || []).includes(to)) patch = { children: a.children.filter((c) => c !== to) };
    else if (a.kind === "dispatch" && (a.checks || []).includes(to)) patch = { checks: a.checks.filter((c) => c !== to) };
    else if (a.kind === "dispatch" && a.review === to) {
      const { review, ...rest } = a;
      const nodes = doc.nodes.map((n) => (n === a ? rest : n));
      return { doc: { ...doc, nodes }, warnings: hasParent(nodes, to) ? [] : [{ node: to, message: `${to} has no parent now: it is an orphan until you give it one` }] };
    } else if (a.kind === "dispatch" && a.entry === to) return { error: `${to} is the entry of ${from}: connect another agent to replace it.` };
    else return { error: `${from} has no link to ${to}.` };
    const nodes = doc.nodes.map((n) => (n === a ? { ...a, ...patch } : n));
    const warnings = [];
    if (nodes.some((n) => isObj(n) && n.name === to) && !hasParent(nodes, to)) warnings.push({ node: to, message: `${to} has no parent now: it is an orphan until you give it one` });
    return { doc: { ...doc, nodes }, warnings };
  }


  // The top-level fields a person may not change: the two registries.
  const READ_ONLY_TOP = ["facts", "gates"];

  // Every kind, with the node's own kind selected, so the change-kind select shows what the node is now.
  const kindChoices = (current) => KINDS.map((kind) => ({ kind, selected: kind === current }));

  return { applyNodeEdit, fieldGroups, setField, addNode, removeNode, reviewGate, connect, disconnect, renameNode, layoutRename, changeKind, kindChoices, unseenValues, READ_ONLY_TOP };
}

// Dashboard core module: layout and view: auto layout, layout for save, fit, zoom, pan. A factory: it takes what it uses from the modules below it, and returns its functions. No DOM here.
// scripts/build_dashboard.py bundles every file of dashboard/core/ in dependency order; nothing loads one file alone.

function layoutModule() {
  // A node's children, by graph edge: `children` plus, for a dispatch, its agent entry, its check gates and its review gate.
  function graphKids(n) {
    if (!n) return [];
    return [...(Array.isArray(n.children) ? n.children : []), ...(n.kind === "dispatch" ? [n.entry, ...(n.checks || []), ...("review" in n ? [n.review] : [])] : [])];
  }

  // A layered, dependency-free DAG layout (a layout library would break
  // that, and a plain layered pass is enough for a graph this small). Two passes:
  //
  // 1. Layer: a node's column is the longest path from the root, by relaxation (as many rounds as there are nodes, which
  //    bounds any DAG's longest path). An edge then never points left, and a node reached two ways sits right of every
  //    parent, so growing the graph never pushes an existing node's column left.
  // 2. Order: within a column, nodes sort by the mean row of their parents in the column before (the barycenter
  //    heuristic), a few sweeps to settle. This keeps a node's row near its parent's, so the graph spreads out as
  //    siblings arrive instead of stacking in first-seen order, and keeps related nodes close, which cuts how often an
  //    edge crosses a third node on its way across the page.
  // The grid: a column is COL_STEP wide, a row ROW_STEP tall, and the first cell sits ORIGIN from the corner.
  const COL_STEP = 230, ROW_STEP = 96, ORIGIN = 20;
  function autoLayout(doc, narrow) {
    const nodes = Object.fromEntries(doc.nodes.map((n) => [n.name, n]));
    const names = Object.keys(nodes);
    const kidsOf = (nm) => graphKids(nodes[nm]).filter((c) => nodes[c]);
    const parentsOf = (nm) => names.filter((p) => kidsOf(p).includes(nm));

    const layer = Object.fromEntries(names.map((n) => [n, n === doc.root ? 0 : -Infinity]));
    for (let i = 0; i < names.length; i++) for (const n of names) if (layer[n] > -Infinity) for (const c of kidsOf(n)) layer[c] = Math.max(layer[c], layer[n] + 1);
    const maxLayer = Math.max(0, ...names.map((n) => layer[n]).filter((v) => v > -Infinity));
    for (const n of names) if (layer[n] === -Infinity) layer[n] = maxLayer + 1;   // unreachable from the root: past everything, not mixed in

    const order = Object.fromEntries(names.map((n, i) => [n, i]));   // the tiebreak for a column's first sweep: the order nodes appear in the graph
    for (let pass = 0; pass < 3; pass++) {
      for (let col = 1; col <= maxLayer + 1; col++) {
        const row = names.filter((n) => layer[n] === col);
        const score = (n) => { const ps = parentsOf(n).filter((p) => layer[p] < col); return ps.length ? ps.reduce((s, p) => s + order[p], 0) / ps.length : order[n]; };
        row.sort((a, b) => score(a) - score(b) || order[a] - order[b]);
        row.forEach((n, i) => { order[n] = i; });
      }
    }
    const pos = {};
    if (narrow) {
      [...names].sort((a, b) => layer[a] - layer[b] || order[a] - order[b]).forEach((n, i) => { pos[n] = { x: ORIGIN, y: ORIGIN + i * ROW_STEP }; });
      return pos;
    }
    for (const n of names) pos[n] = { x: ORIGIN + layer[n] * COL_STEP, y: ORIGIN + order[n] * ROW_STEP };
    return pos;
  }

  // The layout file is a map from node name to position: a key for a node that is gone is dropped on the next layout save.
  function layoutForSave(layout, names) {
    const keep = new Set(names), out = {}, dropped = [];
    for (const k of Object.keys(layout)) { if (keep.has(k)) out[k] = layout[k]; else dropped.push(k); }
    return { layout: out, dropped };
  }

  // The view is {k, tx, ty}: a graph point (x, y) shows at (x*k + tx, y*k + ty). Pure, so node can test it.
  const VIEW_MIN = 0.1, VIEW_MAX = 3;
  const clampK = (k) => Math.min(VIEW_MAX, Math.max(VIEW_MIN, k));
  function viewFit(layout, box, size, pad) {
    const ps = Object.values(layout);
    if (!ps.length) return { k: 1, tx: pad, ty: pad };
    const x0 = Math.min(...ps.map((p) => p.x)), y0 = Math.min(...ps.map((p) => p.y));
    const w = Math.max(...ps.map((p) => p.x)) + box.w - x0, h = Math.max(...ps.map((p) => p.y)) + box.h - y0;
    const k = Math.min(1, clampK(Math.min((size.w - 2 * pad) / w, (size.h - 2 * pad) / h)));
    return { k, tx: (size.w - w * k) / 2 - x0 * k, ty: (size.h - h * k) / 2 - y0 * k };
  }
  // The fit, but never smaller than `minK`: a graph that would shrink below it is shown at `minK` instead, with the graph point `anchor` at the
  // top-left (by `pad`), so the part that matters stays readable and the rest is a pan away. Pure, so node can test it.
  function viewFitFloor(layout, box, size, pad, minK, anchor) {
    const v = viewFit(layout, box, size, pad);
    return v.k >= minK || !anchor ? v : { k: minK, tx: pad - anchor.x * minK, ty: pad - anchor.y * minK };
  }
  function viewZoomAt(v, cx, cy, factor) {
    const k = clampK(v.k * factor), r = k / v.k;
    return { k, tx: cx - (cx - v.tx) * r, ty: cy - (cy - v.ty) * r };
  }
  const viewPanBy = (v, dx, dy) => ({ k: v.k, tx: v.tx + dx, ty: v.ty + dy });

  // Pan, never zoom, so a graph rect {x, y, w, h} shows inside the map minus the insets {left, right, top, bottom}: the left inset is the
  // side panel, which overlays the map. A rect already inside leaves the view as it is. A rect wider than the free space keeps its
  // left edge in view. Pure, so node can test it.
  function viewReveal(v, rect, size, insets) {
    const l = rect.x * v.k + v.tx, r = l + rect.w * v.k, t = rect.y * v.k + v.ty, b = t + rect.h * v.k;
    const x0 = insets.left, x1 = size.w - insets.right, y0 = insets.top, y1 = size.h - insets.bottom;
    const fix = (lo, hi, a, z) => (a < lo ? lo - a : z > hi ? Math.max(hi - z, lo - a) : 0);
    const dx = fix(x0, x1, l, r), dy = fix(y0, y1, t, b);
    return dx || dy ? viewPanBy(v, dx, dy) : v;
  }

  // Edge routes: one orthogonal polyline per graph edge, in the order of `pairs` ({from, to}). Each edge owns its leaving port and
  // its entering port (rows PORT_STEP px apart, leaving in the upper half of the box and entering in the lower half) and its own vertical lane in the gap between columns, so
  // no two edges share a port or a segment. Lanes are counted per source column: a column of sources uses LANE_SLOTS lanes, then
  // repeats. A segment is {x1, y1, x2, y2, arrow}; only the last segment of a route carries the arrow.
  const PORT_STEP = 8, LANE_BASE = 8, LANE_STEP = 3, LANE_SLOTS = 6, STUB = 3;
  function edgeRoutes(layout, pairs, box) {
    const live = (pairs || []).filter((p) => layout && layout[p.from] && layout[p.to]);
    const outN = {}, inN = {};
    for (const p of live) { outN[p.from] = (outN[p.from] || 0) + 1; inN[p.to] = (inN[p.to] || 0) + 1; }
    // A leaving edge uses the upper band of its node, an entering edge the lower band, so an exit and an entry in one gap rarely share a row.
    const portY = (i, n, mid) => Math.min(mid + PORT_STEP * 1.5, Math.max(mid - PORT_STEP * 1.5, mid + (i - (n - 1) / 2) * PORT_STEP));
    const seen = {}, lanes = {};
    const take = (map, key) => { const i = map[key] || 0; map[key] = i + 1; return i; };
    return live.map((p) => {
      const a = layout[p.from], b = layout[p.to];
      const oi = take(seen, "out:" + p.from), ii = take(seen, "in:" + p.to);
      const y1 = a.y + portY(oi, outN[p.from], box.h / 4), y2 = b.y + portY(ii, inN[p.to], (3 * box.h) / 4);
      const x1 = a.x + box.w, x2 = b.x - STUB;
      const lane = take(lanes, String(a.x)) % LANE_SLOTS, xm = x1 + LANE_BASE + lane * LANE_STEP;
      const pts = [[x1, y1], [xm, y1], [xm, y2], [x2, y2]];
      const segs = pts.slice(1).map((q, i) => ({ x1: pts[i][0], y1: pts[i][1], x2: q[0], y2: q[1], arrow: i === pts.length - 2 }));
      return { from: p.from, to: p.to, segs };
    });
  }

  return { autoLayout, graphKids, layoutForSave, viewFit, viewFitFloor, viewZoomAt, viewPanBy, viewReveal, edgeRoutes };
}

// Dashboard core module: save gate, draft copy, hash chip, diff, declared caps, command template, review sheet. A factory: it takes what it uses from the modules below it, and returns its functions. No DOM here.
// scripts/build_dashboard.py bundles every file of dashboard/core/ in dependency order; nothing loads one file alone.

function reviewModule({ canonText, graphHash, cmpCodePoints }) {
  // Save, draft copy, and the changed-file stop. Pure, so node can test them.
  const saveText = (text) => (text.endsWith("\n") ? text : text + "\n");
  async function hashChip(text) { const full = await graphHash(saveText(text)); return { full, short: full.slice(0, 12) }; }
  const hashRelation = (record, chip) => (record ? (record === chip ? "matches" : "does not match") : null);
  // A draft is a recovery copy in browser storage. It is never a graph key and never written to the graph or layout file.
  const draftRecord = ({ name, text, layout, time, baseHash }) => ({ name, text, layout, time, baseHash });
  const draftOffer = (draft, name, text) => (draft && draft.name === name && draft.text !== text ? draft : null);

  // A save stops for a file conflict only. The number of validation errors never enters the decision.
  function saveGate({ mode, stored, current }) {
    if (mode !== "in-place" || !stored || !current) return "write";
    return stored.lastModified !== current.lastModified || stored.text !== current.text ? "stop" : "write";
  }
  function saveMode({ picker, handle }) { const inPlace = !!(picker && handle); return { mode: inPlace ? "in-place" : "download", label: inPlace ? "In-place save" : "Download save" }; }

  // --- review: plain text for a person. These functions start no process, write no file,
  // add no approval and compute no sum of caps. The command template is text that a person pastes into a terminal.
  const REVIEW_NOTE = "A shown cap and a matching hash approve nothing and authorize no live write. Approval is a person's act outside the graph. Launching stays a person's act in a terminal.";
  const named = (list, key) => { const m = new Map(); if (Array.isArray(list)) for (const x of list) if (x && typeof x === "object" && typeof x[key] === "string") m.set(x[key], x); return m; };
  const present = (v) => (v === undefined ? null : canonText(v));
  // The fields of two objects that differ: {key, before, after} in canonical text, null where a field is absent.
  function fieldDiff(a, b) {
    const x = a && typeof a === "object" ? a : {}, y = b && typeof b === "object" ? b : {};
    return [...new Set([...Object.keys(x), ...Object.keys(y)])].sort(cmpCodePoints).filter((k) => present(x[k]) !== present(y[k])).map((k) => ({ key: k, before: present(x[k]), after: present(y[k]) }));
  }
  function listDiff(prior, cur, key) {
    const p = named(prior, key), c = named(cur, key), added = [], removed = [], changed = [];
    for (const [name, v] of c) { if (!p.has(name)) added.push(name); else { const f = fieldDiff(p.get(name), v); if (f.length) changed.push({ name, fields: f }); } }
    for (const name of p.keys()) if (!c.has(name)) removed.push(name);
    return { added, removed, changed };
  }
  // Compare two graph documents by node name. Layout is not in a document, so it never appears.
  function diffGraphs(prior, cur) {
    const top = fieldDiff({ name: prior.name, description: prior.description, root: prior.root, schema_version: prior.schema_version }, { name: cur.name, description: cur.description, root: cur.root, schema_version: cur.schema_version });
    const out = { top, run: fieldDiff(prior.run, cur.run), nodes: listDiff(prior.nodes, cur.nodes, "name"), facts: listDiff(prior.facts, cur.facts, "name"), gates: listDiff(prior.gates, cur.gates, "id") };
    const parts = [out.top, out.run, ...["nodes", "facts", "gates"].flatMap((k) => [out[k].added, out[k].removed, out[k].changed])];
    out.empty = parts.every((x) => x.length === 0);
    return out;
  }
  // The caps the document declares, one row per node, as written. Nothing is added up: the engine enforces the run cap before each entry.
  function declaredCaps(doc) {
    const nodes = Array.isArray(doc.nodes) ? doc.nodes.filter((n) => n && typeof n.name === "string") : [];
    const rows = [], gates = [];
    for (const n of nodes) {
      if (n.kind === "gate") { gates.push({ name: n.name, check: present(n.check), params: present(n.params) }); continue; }
      const row = { name: n.name, kind: n.kind };
      for (const k of ["deadline", "budget", "max_depth", "max_children", "max_parallel"]) if (n[k] !== undefined) row[k] = canonText(n[k]);
      if (Object.keys(row).length > 2) rows.push(row);
    }
    return { run: present(doc.run), nodes: rows, gates };
  }
  const shq = (t) => (/^[A-Za-z0-9_@%+=:,./-]+$/.test(t) ? t : "'" + String(t).replace(/'/g, "'\\''") + "'");
  // The run command a person sets up: the graph file name and the engine options. An override may only go down from the run block
  //. With any error the text is null, so no wrong command is ever shown. The hash binds the command to the reviewed graph.
  function commandTemplate({ file, hash, opts, doc }) {
    const o = opts || {}, run = (doc && doc.run) || {}, errors = [], args = ["squad", "run", shq(file || "graph.json")];
    const num = (t) => (t === "" || t === undefined || t === null ? null : Number(t));
    if (!hash) errors.push("The graph has no canonical form, so it has no hash to bind.");
    if (o.adapter === "sdk") args.push("--adapter", "sdk");
    else if (o.adapter === "script" && o.script) args.push("--script", shq(o.script));
    else errors.push("Choose --adapter sdk, or --script with a file name: the run command needs one of them.");
    const names = new Set(Array.isArray(doc && doc.nodes) ? doc.nodes.map((n) => n && n.name) : []);
    if (o.stopAfter) { if (names.has(o.stopAfter)) args.push("--stop-after", shq(o.stopAfter)); else errors.push(`--stop-after names no node: ${o.stopAfter}.`); }
    const cap = (key, flag, runKey, whole) => {
      const v = num(o[key]);
      if (v === null) return;
      const bad = !Number.isFinite(v) || v <= 0 || (whole && !Number.isInteger(v));
      if (bad) errors.push(`${flag} needs a ${whole ? "whole number" : "number"} above 0.`);
      else if (typeof run[runKey] === "number" && v > run[runKey]) errors.push(`${flag} ${v} is above the run block's ${run[runKey]}: an option only goes down.`);
      else args.push(flag, String(v));
    };
    cap("spendCap", "--spend-cap", "spend_cap", false);
    cap("deadline", "--deadline", "deadline", false);
    cap("maxParallel", "--max-parallel", "max_parallel", true);
    if (o.tierPin) args.push("--tier-pin", shq(o.tierPin));
    if (hash) args.push("--expect-graph-hash", hash);
    return { text: errors.length ? null : args.join(" "), errors };
  }
  const fmtList = (d) => [...d.added.map((n) => `  + ${n}`), ...d.removed.map((n) => `  - ${n}`), ...d.changed.flatMap((c) => [`  ~ ${c.name}`, ...c.fields.map((f) => `      ${f.key}: ${f.before === null ? "(absent)" : f.before} -> ${f.after === null ? "(absent)" : f.after}`)])];
  // The review sheet: a plain-text export for a ticket or a commit message. No code reads it, and it records no approval.
  function reviewSheet({ file, hash, nodeCount, errors, caps, diff, prior, template }) {
    const L = [`Review sheet for ${file || "graph"}`, `Graph hash: ${hash || "(none: no canonical form)"}`, `Nodes: ${nodeCount}`, `Errors: ${errors.length}`, ...errors.map((e) => `  ${e}`), "", "Declared caps (as written, none added up):", `  run: ${caps.run === null ? "(none)" : caps.run}`];
    for (const r of caps.nodes) L.push(`  ${r.name} (${r.kind}): ${Object.entries(r).filter(([k]) => k !== "name" && k !== "kind").map(([k, v]) => `${k} ${v}`).join(", ")}`);
    for (const g of caps.gates) L.push(`  gate ${g.name}: check ${g.check}, params ${g.params}`);
    L.push("");
    if (!prior || !diff) L.push("Diff: no prior graph opened.");
    else {
      L.push(`Diff against ${prior.file} (hash ${prior.hash || "none"}):`);
      if (diff.empty) L.push("  no difference");
      else {
        for (const f of [...diff.top, ...diff.run.map((x) => ({ ...x, key: "run." + x.key }))]) L.push(`  ${f.key}: ${f.before === null ? "(absent)" : f.before} -> ${f.after === null ? "(absent)" : f.after}`);
        for (const k of ["nodes", "facts", "gates"]) { const lines = fmtList(diff[k]); if (lines.length) L.push(` ${k}:`, ...lines); }
      }
    }
    L.push("", "Command template:", template ? `  ${template}` : "  (none: fix the options first)", "", REVIEW_NOTE);
    return L.join("\n") + "\n";
  }

  return { REVIEW_NOTE, diffGraphs, declaredCaps, commandTemplate, reviewSheet, saveText, hashChip, hashRelation, draftRecord, draftOffer, saveGate, saveMode };
}

// Dashboard core module: undo and redo history. A factory: it takes what it uses from the modules below it, and returns its functions. No DOM here.
// scripts/build_dashboard.py bundles every file of dashboard/core/ in dependency order; nothing loads one file alone.

function historyModule({ clone }) {
  // ---- undo and redo: a pure history of graph-and-layout snapshots; it lives in the page and is never saved ----
  const snapshot = (doc, layout) => ({ doc: clone(doc), layout: clone(layout) });
  const histNew = (limit) => ({ past: [], future: [], limit: limit > 0 ? limit : 100 });
  // `before` is the state an edit is about to change. A new edit clears redo; the oldest step goes when the limit is reached.
  function histRecord(h, before) {
    const past = [...h.past, before];
    while (past.length > h.limit) past.shift();
    return { past, future: [], limit: h.limit };
  }
  function histUndo(h, now) {
    if (!h.past.length) return null;
    const past = h.past.slice(0, -1);
    return { h: { past, future: [...h.future, now], limit: h.limit }, state: h.past[h.past.length - 1] };
  }
  function histRedo(h, now) {
    if (!h.future.length) return null;
    const future = h.future.slice(0, -1);
    return { h: { past: [...h.past, now], future, limit: h.limit }, state: h.future[h.future.length - 1] };
  }

  return { snapshot, histNew, histRecord, histUndo, histRedo };
}

// Dashboard core module: page constants and run sources: legend, help, httpSource, followPush. A factory: it takes what it uses from the modules below it, and returns its functions. No DOM here.
// scripts/build_dashboard.py bundles every file of dashboard/core/ in dependency order; nothing loads one file alone.

function sourcesModule({ STATES }) {
  // The legend and the help are data. The page draws a swatch as a card group, so the card CSS paints it, and a Python test
  // holds the legend to the colors the page paints and the help to the controls the page answers.
  // A row with a `glyph` draws it in the swatch: the same glyph the card carries, so the color is never the only cue.
  // The icon of a node kind: one glyph and one class per kind, so a gate and an agent differ by shape as well as by color (#914).
  // The class names the kind's chip color in page.css, and the legend lists the same seven. An unknown kind keeps a glyph and its own class; it never throws.
  const KIND_LEGEND = [
    { kind: "agent", glyph: "\u25c6", label: "Agent: calls a model" },
    { kind: "gate", glyph: "\u2713", label: "Gate: a check that passes or fails" },
    { kind: "action", glyph: "\u25b6", label: "Action: a fixed step, no model" },
    { kind: "wait", glyph: "\u2016", label: "Wait: a person decides" },
    { kind: "loop", glyph: "\u21bb", label: "Loop: repeats until it passes" },
    { kind: "each", glyph: "\u2261", label: "Each: runs for every item" },
    { kind: "dispatch", glyph: "\u21c9", label: "Dispatch: starts children" },
  ];
  // The seven kinds, one row each, in the legend's own "Node kinds" group: the states table stays the one list of card states.
  const KIND_GLYPHS = Object.fromEntries(KIND_LEGEND.map((k) => [k.kind, k.glyph]));
  function kindMark(kind) {
    const k = typeof kind === "string" && kind ? kind : "unknown";
    return { kind: k, glyph: KIND_GLYPHS[k] || "\u25cb", cls: `k-${k}` };
  }
  const LEGEND = [
    ...STATES.filter((x) => x.legend).map((x) => ({ cls: x.cls, glyph: x.glyph, label: x.legend, group: "node" })),   // the card states: from the one STATES table
    { cls: "err", label: "Breaks a graph rule: fix it", group: "node" },   // an editor state (core.validate), never a record event: a run refuses a graph with one
    { cls: "sel", label: "Selected", group: "interaction" },
    { cls: "drop", label: "Target of the link you drag", group: "interaction" },
  ];
  // The hub serves and the dashboard embeds the same run-state table from contrib/squad-goal/scripts/run-states.json. Every page draws these rows;
  // `hub_only` names states the hub derives rather than the run record carrying them.
  const RUN_STATES = [{"state": "completed", "cls": "v-ok", "text": "completed", "label": "Run completed", "color": "ok", "css": "", "mark": "filled", "tone": "ok", "word": "completed"}, {"state": "verified", "cls": null, "text": "verified", "label": "Failed or unverified run, verified by hand", "color": "ok", "css": "font-style:italic", "mark": "hollow", "hub_only": true, "tone": "ok", "word": "verified"}, {"state": "unverified", "cls": null, "text": "unverified", "label": "Work landed, the final gate had no command", "color": "ok", "css": "border-style:dashed", "mark": "bar", "hub_only": true, "tone": "ok", "word": "unverified"}, {"state": "failed", "cls": "v-bad", "text": "failed", "label": "Run failed", "color": "err", "css": "", "mark": "filled", "tone": "err", "word": "failed"}, {"state": "taken over", "cls": null, "text": "taken over", "label": "Run taken over at the takeover bound, its cause recorded", "color": "warn", "css": "", "mark": "bar", "hub_only": true, "tone": "warn", "word": "taken over"}, {"state": "retired-age-cap", "cls": null, "text": "retired (age cap)", "label": "Run retired at the wave age cap, its cause recorded", "color": "none", "css": "", "mark": "hollow", "hub_only": true, "tone": "none", "word": "retired (age cap)"}, {"state": "needs-human", "cls": "v-human", "text": "ended · needs a decision", "label": "Run needs a person", "color": "warn", "css": "", "mark": "filled", "tone": "warn", "word": "ended · needs a decision"}, {"state": "handled", "cls": null, "text": "ended · handled (landed in fork)", "label": "Needs-human run, landed in the fork", "color": "ok", "css": "", "mark": "none", "hub_only": true, "tone": "ok", "word": "ended · handled (landed in fork)"}, {"state": "running", "cls": "v-live", "text": "running", "label": "Run in progress", "color": "run", "css": "", "mark": "filled", "tone": "run", "word": "running"}, {"state": "starting", "cls": null, "text": "starting", "label": "Run starting", "color": "run", "css": "border-style:dotted", "mark": "hollow", "hub_only": true, "tone": "run", "word": "starting"}, {"state": "unreadable", "cls": null, "text": "unreadable", "label": "Record could not be read on the last poll", "color": "warn", "css": "border-style:dotted", "mark": "hollow", "hub_only": true, "tone": "warn", "word": "unreadable"}, {"state": "stalled", "cls": "v-wait", "text": "stalled", "label": "Run stalled", "color": "wait", "css": "border-style:dashed", "mark": "filled", "tone": "wait", "word": "stalled"}, {"state": "no verdict yet", "cls": "v-none", "text": "no verdict yet", "label": "No verdict yet", "color": "none", "css": "", "mark": "none", "tone": "none", "word": "no verdict yet"}];
  // What a pill prints for a state, on any surface: the hub badges a run with the same words. The run header chip and the legend read this one map.
  const STATE_TEXT = Object.fromEntries(RUN_STATES.map((x) => [x.state, x.text]));
  // The top-bar verdict chip, one row per class it paints (a guard holds this list to the page's CSS and to the chip's class map).
  const LEGEND_CHIPS = RUN_STATES.filter((x) => !x.hub_only).map((x) => ({ cls: x.cls, label: x.label }));
  const HELP = [
    { how: "Drag empty space", what: "Pan the graph.", covers: ["pan"] },
    { how: "Mouse wheel or trackpad pinch", what: "Zoom at the cursor.", covers: ["wheel"] },
    { how: "Drag a node", what: "Move it. Only the layout file changes, never the graph.", covers: ["drag-node"] },
    { how: "Drag from a node's right port to another node", what: "Connect them. A refused link says why in the status line.", covers: ["drag-port"] },
    { how: "Click a link", what: "Select it.", covers: ["select-link"] },
    { how: "Click a group card, a square on it, or a row in the side panel's child table", what: "Select that group or child. Three or more children of one dispatch that finished with one outcome, or run on one harness, draw one group card.", covers: ["select-square"] },
    { how: "Double-click a group card", what: "Show one card per child in its place. Double-click one of those cards to fold the group back.", covers: ["expand-group"] },
    { how: "Tab to a card or a square, then Enter or Space", what: "Enter selects the card or the child, as a click does. Space opens a group card, or folds the group of a card that came from one.", covers: ["key: "] },
    { how: "Double-click a node", what: "Rename it. Every reference follows.", covers: ["double-press"] },
    { how: "Right-click a node or empty space", what: "Rename or remove the node, or add a node at that spot.", covers: ["contextmenu"] },
    { how: "Delete or Backspace", what: "Remove the selected link or node.", covers: ["key:Delete", "key:Backspace"] },
    { how: "Left or Right arrow", what: "Move the replay cursor one event back or forward, while a run record is open.", covers: ["key:ArrowLeft", "key:ArrowRight"] },
    { how: "Enter in the name field", what: "Apply the rename.", covers: ["key:Enter"] },
    { how: "Ctrl or Cmd + Z", what: "Undo. Add Shift to redo.", covers: ["key:z"] },
    { how: "Ctrl or Cmd + Y", what: "Redo.", covers: ["key:y"] },
    { how: "Drag the side panel's edge, or the arrow keys on its grip", what: "Set how wide the panel is — how tall it is when a narrow window makes it a bottom sheet. Home and End go to the narrowest and the widest; a double-click brings the default back.", covers: ["key:Home", "key:End"] },
    { how: "[", what: "Show or hide the side panel.", covers: ["key:["] },
    { how: "?", what: "Show or hide this help.", covers: ["key:?"] },
    { how: "Esc", what: "Close the menu and this help.", covers: ["key:Escape"] },
  ];

  // The source of a run that a loopback server serves: fetch the record and the graph by path. A missing file is null, like the other sources.
  // `fetchFn(path)` returns {ok, text()}; the page passes fetch with no-store, a test passes a map.
  // `streamFn(path, handlers)` opens a push stream and returns {close()}; a source built with it offers `stream`.
  // `paths` names the file each read opens, so a slow or failed read can say what it read.
  function httpSource(fetchFn, name, streamFn) {
    const get = async (p) => { try { const r = await fetchFn(p); return r && r.ok ? await r.text() : null; } catch (e) { return null; } };
    const src = { name, live: true, paths: { record: "run/record.jsonl", graph: "run/graph.json" }, graph: () => get("run/graph.json"), record: () => get("run/record.jsonl") };
    if (typeof streamFn === "function") src.stream = (handlers) => streamFn("run/events", handlers);
    return src;
  }

  // Follow a run by push. `events` is what the page already read; each pushed line is one more event.
  // hooks: changed(events), ended(), fail(reason), status(text, bad). A repeated position is skipped; a skipped one is a gap and is never painted.
  // A stream that errors reconnects by itself (the browser sends Last-Event-ID); after MAX_STREAM_ERRORS errors with no event between, the follow gives up.
  const MAX_STREAM_ERRORS = 3;
  function followPush(src, events, hooks) {
    let list = events.slice(), done = false, errors = 0, handle = null;
    const last = () => (list.length && Number.isInteger(list[list.length - 1].pos) ? list[list.length - 1].pos : 0);
    const stop = () => { done = true; if (handle && handle.close) try { handle.close(); } catch (e) { /* already closed */ } };
    const fail = (why) => { if (done) return; stop(); hooks.fail(why); };
    const handlers = {
      line(text) {
        if (done) return;
        errors = 0;
        let ev;
        try { ev = JSON.parse(text); } catch (e) { return fail("a pushed event was not JSON"); }
        if (!ev || !Number.isInteger(ev.pos)) return fail("a pushed event named no position");
        if (ev.pos <= last()) return;
        if (ev.pos !== last() + 1) return fail(`position gap: expected ${last() + 1}, got ${ev.pos}`);
        list = list.concat([ev]);
        hooks.changed(list);
        if (ev.event === "verdict") { stop(); hooks.ended(); }
      },
      end(reason) {
        if (done) return;
        if (reason === "verdict") { stop(); hooks.ended(); } else fail(`the server ended the stream: ${reason}`);
      },
      error(closed) {
        if (done) return;
        errors++;
        if (closed || errors >= MAX_STREAM_ERRORS) return fail("the stream dropped");
        hooks.status("The stream dropped; reconnecting from the last position.", true);
      },
    };
    try { handle = src.stream(handlers); } catch (e) { fail("the stream did not open"); }
    return { close: stop, handlers };
  }

  return { LEGEND, LEGEND_CHIPS, RUN_STATES, STATE_TEXT, HELP, httpSource, followPush, kindMark, KIND_LEGEND };
}

// Dashboard core module: Where a pause leaves the run.
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function controlModule({ lastOf }) {
  // The page shows what the engine recorded and never works the frontier out: the `paused` event is the resume point,
  // shown as the record holds it. A pause counts for the last start of the run only (`run_start`, or a `resume`), and only while the run
  // is without a verdict, or its verdict is the `stopped` that a pause writes.
  //   state "live"   : a run with no verdict yet. A request may still pause it.
  //   state "paused" : the run ended on a pause. `held` and `completed` are the engine's own lists.
  //   state "ended"  : any other verdict. The server takes no request for it.
  function pauseView(events) {
    const verdict = lastOf(events.filter((e) => e.event === "verdict"));
    const start = lastOf(events.filter((e) => e.event === "run_start" || e.event === "resume"));
    const since = start ? start.pos : 0;
    const pause = lastOf(events.filter((e) => e.event === "paused" && e.pos > since));
    const run = events.length ? events[0].run_id : null;
    if (verdict && verdict.pos > since) {
      const byPause = verdict.verdict === "stopped" && (verdict.reasons || []).some((r) => String(r).startsWith("paused:"));
      if (!byPause) return { state: "ended", node: null, held: [], completed: [], resume: null };
    }
    if (!pause) return { state: "live", node: null, held: [], completed: [], resume: null };
    return { state: "paused", node: pause.node, held: pause.held.slice(), completed: pause.completed.slice(), resume: `squad resume ${run}` };
  }

  // The body of one request. `nodes` empty or null means the whole run.
  function controlBody(action, nodes) {
    return JSON.stringify(nodes && nodes.length ? { action, nodes } : { action });
  }

  return { pauseView, controlBody };
}


// Dashboard core module: a gui-test/1 test script as a step diagram. No DOM here; the page puts the markup in a view.
// Nothing runs: the diagram reads the script file only. The format check mirrors squad/gui_test_render.py.

function scriptModule() {
  const SCRIPT_FORMATS = ["gui-test/1"];
  const SECTIONS = ["setup", "steps", "teardown"];
  const STEP = { w: 280, h: 74, gap: 26, colGap: 40, head: 34, pad: 16, line: 14, lines: 2, chars: 40 };
  const escXml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // The model: batches in order, each with its setup, steps and teardown sections; one node per step, in script order.
  // A step's variants read as `axis=value` tags; a step with none runs under every variant, tagged "all".
  function scriptDiagram(script) {
    if (!script || typeof script !== "object" || !SCRIPT_FORMATS.includes(script.format)) {
      return { error: `unknown format ${JSON.stringify(script && script.format)}; the dashboard draws ${JSON.stringify(SCRIPT_FORMATS)}` };
    }
    const node = (s) => ({ id: s.id, text: s.expect, tags: s.variants && Object.keys(s.variants).length ? Object.entries(s.variants).map(([k, v]) => `${k}=${v}`) : ["all"],
      manual: s.mode === "manual", sensitive: s.sensitive === true, severity: s.severity });
    return { name: script.name, batches: (script.batches || []).map((b) => ({ id: b.id,
      sections: SECTIONS.filter((k) => (b[k] || []).length).map((k) => ({ label: k, nodes: b[k].map(node) })) })) };
  }

  function wrap(text) {
    const words = String(text).split(/\s+/), rows = [""];
    for (const w of words) {
      const cur = rows[rows.length - 1];
      if (cur && (cur + " " + w).length > STEP.chars) rows.push(w); else rows[rows.length - 1] = cur ? cur + " " + w : w;
    }
