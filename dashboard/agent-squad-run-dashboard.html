// --- single-card mode (ticket #1782): the page paints ONE card of the panel, named by its URL ---
// The hub's pip, floating over the maximized board, points a frame at this page with `?card=<name>`, so the second
// view shows the panel's own card instead of a copy that drifts. The page still reads the run (the same push stream
// or reread timer it always uses), so the card follows a live run rather than a snapshot; the mode only cuts what is
// painted. A name the panel does not have is answered with a message inside the card, never an empty frame. The page
// tells whoever framed it that it answered the mode, which is how the window tells an older dashboard (one that does
// not know the parameter at all) from one that does.
const CARD = (new URLSearchParams(location.search).get("card") || "").trim();
// The window is a second page paint of the same run: it must not be told twice about anything, so the card is
// rebuilt only when its own text changed, like the panel's own list.
let cardHTML = null;

function renderCard() {
  const box = $("card");
  // The card reads the same run as the page: it says it is reading, and it names the empty run, rather than a blank frame.
  const read = !S.doc && !S.events ? readKey("record", "graph") : null;
  if (read) { paintRead(box, read, "run"); cardHTML = null; }
  else {
    const card = core.cardBody(CARD, S.children);
    const groups = card.groups.map((g) => {
      const rows = g.kids.map((k) => `<div class="crow s-${esc(core.childMark(k).state)}" title="${esc(k.name)}">${esc(core.childMark(k).glyph)} <b>${esc(k.title || k.label || k.name)}</b>${k.running_for ? ` <span class="cmeta">${esc(core.fmt.seconds(k.running_for))}</span>` : ""}</div>`).join("");
      return `<section class="cgroup s-${esc(g.state)}"><h3>${esc(g.name)}</h3>${rows}</section>`;
    }).join("");
    const html = card.ok ? groups || emptyHtml(card.empty) : `<p class="cnote">${esc(card.message)}</p>`;
    if (html !== cardHTML) { box.innerHTML = html; cardHTML = html; }
  }
  if (window.parent !== window) window.parent.postMessage({ squadCard: CARD }, "*");   // the window's own handshake: it knows this page answered the mode
}

if (CARD) {
  document.body.classList.add("card-mode");
  $("card").setAttribute("aria-label", `One card of the run panel: ${CARD}`);
  renderCard();
  window.addEventListener("message", (e) => { if (e.data && e.data.card === CARD) renderCard(); });   // the window may ask for a repaint
}

// --- save, draft copy, hash chip, and the changed-file stop ---
const PICKER = !!window.showOpenFilePicker;
const JSON_TYPES = [{ description: "JSON", accept: { "application/json": [".json"] } }];
const stampOf = async (h) => { const f = await h.getFile(); return { lastModified: f.lastModified, text: await f.text() }; };
const hidePanels = () => { $("stop").hidden = true; $("offer").hidden = true; };
const layoutText = () => JSON.stringify(core.layoutForSave(S.layout, nodesOf().map((n) => n.name)).layout, null, 2) + "\n";
function dropNote(dropped) { return dropped.length ? ` Dropped ${dropped.length} layout key${dropped.length > 1 ? "s" : ""} for nodes that no longer exist: ${dropped.join(", ")}.` : ""; }

function refreshMode() {
  const m = core.saveMode({ picker: PICKER, handle: !!S.handle });
  $("mode").textContent = m.label;
  $("mode").title = m.mode === "in-place" ? "Save graph writes the opened file. It stops when the file changed on disk." : "Save graph downloads a file. The page cannot see a change to the file on disk, and a download can create name (1).graph.json.";
}

// The hash chip shows the short hash of the text that Save graph writes now. With a record open, a second line compares the record's hash.
let chipFor = null;
async function updateChip() {
  const chip = $("chip");
  if (!S.doc) { chip.textContent = "no graph"; chip.disabled = true; $("rechash").textContent = ""; chipFor = null; return; }
  if (chipFor !== S.text) { chipFor = S.text; const t = S.text; let c = null; try { c = await core.hashChip(t); } catch (e) { c = null; } if (S.text === t) S.chip = c; }
  chip.textContent = S.chip ? "hash " + S.chip.short : "no canonical form";
  chip.disabled = !S.chip;
  const rec = S.events && S.events[0] && S.events[0].event === "run_start" ? S.events[0].graph_hash : null;
  const rel = core.hashRelation(rec, S.chip && S.chip.full);
  $("rechash").textContent = rel ? `record ${String(rec).slice(0, 12)} ${rel}` : "";
  $("rechash").className = rel === "does not match" ? "msg-bad" : "";
  renderReview();
}
$("chip").addEventListener("click", async () => {
  if (!S.chip) return;
  try { await navigator.clipboard.writeText(S.chip.full); setStatus("Copied the full graph hash."); } catch (e) { window.prompt("Full graph hash", S.chip.full); }
});

// The draft copy: graph text, layout, name, a time, and the hash of the last file loaded or saved. It lives in browser storage only.
const DRAFT_DB = "agent-squad-run-dashboard-draft";
const draftIdb = (mode, fn) => new Promise((ok, no) => {
  const open = indexedDB.open(DRAFT_DB, 1);
  open.onupgradeneeded = () => open.result.createObjectStore("drafts");
  open.onerror = () => no(open.error);
  open.onsuccess = () => { const tx = open.result.transaction("drafts", mode), req = fn(tx.objectStore("drafts")); tx.oncomplete = () => { open.result.close(); ok(req.result); }; tx.onerror = () => no(tx.error); };
});
let draftTimer = null, noRecoveryTold = false;
function noRecovery(e) { if (noRecoveryTold) return; noRecoveryTold = true; setStatus($("status").textContent + ` There is no recovery in this session: the browser storage is not available (${e && e.message ? e.message : e}).`); }
const isDirty = () => !!S.doc && (core.saveText(S.text) !== S.baseText || JSON.stringify(S.layout) !== S.baseLayout);
function scheduleDraft() {
  if (!S.doc || S.offerPending || !isDirty()) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(async () => {
    if (!isDirty() || S.offerPending) return;
    try { await draftIdb("readwrite", (st) => st.put(core.draftRecord({ name: S.name, text: core.saveText(S.text), layout: S.layout, time: Date.now(), baseHash: S.baseHash }), S.name)); } catch (e) { noRecovery(e); }
  }, 500);
}
// A save clears the draft. A graph save also takes the layout as it is: a node added since the last save has an automatic position, not a saved choice.
async function settleDraft() {
  clearTimeout(draftTimer);
  try { if (isDirty()) await draftIdb("readwrite", (st) => st.put(core.draftRecord({ name: S.name, text: core.saveText(S.text), layout: S.layout, time: Date.now(), baseHash: S.baseHash }), S.name)); else await draftIdb("readwrite", (st) => st.delete(S.name)); } catch (e) { noRecovery(e); }
}
async function offerDraft() {
  let d = null;
  try { d = await draftIdb("readonly", (st) => st.get(S.name)); } catch (e) { noRecovery(e); return; }
  const o = core.draftOffer(d, S.name, S.baseText);
  if (!o) return;
  S.offerPending = o;
  const box = $("offer");
  box.hidden = false; openSide();
  box.innerHTML = `A draft copy of <b>${esc(o.name)}</b> from ${esc(new Date(o.time).toLocaleString())} was kept in this browser. It differs from the file you opened.<div class="row"><button id="b-restore">Restore the draft</button><button id="b-discard">Discard the draft</button></div>`;
  $("b-restore").onclick = async () => {
    const r = core.parseImport(o.text);
    if (r.error) { setStatus("The draft is not a graph: " + r.error, true); return; }
    S.doc = r.doc; S.text = o.text; S.layout = o.layout || core.autoLayout(S.doc, narrowScreen()); S.hist = core.histNew(100); S.selected = null; S.offerPending = null; box.hidden = true;
    setStatus(`Restored the draft of ${o.name}. It is not saved to the file yet.`);
    await recompute(); fit();
  };
  $("b-discard").onclick = async () => { S.offerPending = null; box.hidden = true; try { await draftIdb("readwrite", (st) => st.delete(S.name)); } catch (e) { noRecovery(e); } setStatus("Discarded the draft."); };
}

// One save path for the graph file and the layout file. A save stops for a file conflict only, never for a validation error.
const TARGETS = {
  graph: { label: "graph", handle: () => S.handle, stamp: () => S.stamp, setStamp: (v) => { S.stamp = v; }, text: () => core.saveText(S.text), copyName: () => S.name + ".copy.graph.json", done: async (text) => { S.baseText = text; S.baseLayout = JSON.stringify(S.layout); try { S.baseHash = (await core.hashChip(text)).full; } catch (e) { S.baseHash = null; } },
    reload: async (cur, h) => { const keep = S.layout; try { await draftIdb("readwrite", (st) => st.delete(S.name)); } catch (e) { noRecovery(e); } if (await loadGraph(cur.text, h.name)) { S.handle = h; S.stamp = cur; S.layout = keep && Object.keys(keep).length ? { ...S.layout, ...keep } : S.layout; refreshMode(); render(); } } },
  layout: { label: "layout", handle: () => S.layoutHandle, stamp: () => S.layoutStamp, setStamp: (v) => { S.layoutStamp = v; }, text: layoutText, copyName: () => S.name + ".copy.layout.json", done: async () => { S.baseLayout = JSON.stringify(S.layout); },
    reload: async (cur) => { try { S.layout = { ...S.layout, ...JSON.parse(cur.text) }; S.layoutStamp = cur; S.baseLayout = JSON.stringify(S.layout); setStatus("Reloaded the layout from disk."); render(); } catch (x) { setStatus("The layout on disk is not JSON: " + x.message, true); } } },
};
async function writeInPlace(t, text) {
  const h = t.handle();
  try { const w = await h.createWritable(); await w.write(text); await w.close(); } catch (e) { setStatus(`In-place save of the ${t.label} failed: ${e.message}. Use Export for a copy.`, true); return false; }
  t.setStamp(await stampOf(h)); await t.done(text); await settleDraft();
  return true;
}
function showStop(t, cur, why) {
  const box = $("stop");
  box.hidden = false; openSide();
  box.innerHTML = `<b>The ${t.label} file changed on disk.</b> ${esc(why)} Nothing was written.<div class="row"><button id="b-reload">Reload from disk</button><button id="b-copy">Save a copy</button><button id="b-over">Overwrite anyway</button></div>`;
  $("b-reload").onclick = async () => { if (!cur) { setStatus("The file cannot be read, so there is nothing to reload.", true); return; } if (!window.confirm("Reload from disk? Your edits to the " + t.label + " are dropped.")) return; box.hidden = true; await t.reload(cur, t.handle()); };
  $("b-copy").onclick = () => { download(t.copyName(), t.text()); box.hidden = true; setStatus(`Saved a copy as ${t.copyName()}. The file on disk is unchanged.`); };
  $("b-over").onclick = async () => { box.hidden = true; const text = t.text(); if (await writeInPlace(t, text)) setStatus(`Overwrote the ${t.label} file.`); };
}
async function saveTarget(key) {
  const t = TARGETS[key];
  if (!S.doc) return;
  const text = t.text();
  if (!(PICKER && t.handle())) {
    download(key === "graph" ? (S.fileName || S.name + ".graph.json") : S.name + ".layout.json", text); await t.done(text); await settleDraft();
    const note = key === "graph" && !S.downloadNoted ? " In download mode the page cannot see a change to the file on disk, and the browser can create name (1).graph.json if the name exists." : "";
    if (key === "graph") S.downloadNoted = true;
    setStatus((key === "graph" && S.errors.length ? `Saved with ${S.errors.length} error(s). The engine refuses an invalid graph at load.` : `Saved the ${t.label}.`) + note + (key === "layout" ? dropNote(core.layoutForSave(S.layout, nodesOf().map((n) => n.name)).dropped) : ""));
    return;
  }
  let cur = null, why = "";
  try { cur = await stampOf(t.handle()); } catch (e) { why = "The file cannot be read any more: " + e.message + "."; }
  if (!why && core.saveGate({ mode: "in-place", stored: t.stamp(), current: cur }) === "stop") why = "It is newer than the copy you opened or last saved.";
  if (why) { showStop(t, cur, why); return; }
  if (await writeInPlace(t, text)) setStatus(key === "graph" && S.errors.length ? `Saved in place with ${S.errors.length} error(s). The engine refuses an invalid graph at load.` : `Saved the ${t.label} in place.` + (key === "layout" ? dropNote(core.layoutForSave(S.layout, nodesOf().map((n) => n.name)).dropped) : ""));
}

async function openGraphPicked() {
  let h;
  try { [h] = await window.showOpenFilePicker({ types: JSON_TYPES }); } catch (e) { if (e.name !== "AbortError") pickerFailed("graph", e); return; }
  let cur; try { cur = await stampOf(h); } catch (e) { setStatus("Could not read the file: " + e.message, true); return; }
  if (await loadGraph(cur.text, h.name)) { S.handle = h; S.stamp = cur; refreshMode(); }
}
async function openLayoutPicked() {
  let h;
  try { [h] = await window.showOpenFilePicker({ types: JSON_TYPES }); } catch (e) { if (e.name !== "AbortError") pickerFailed("layout", e); return; }
  try { const cur = await stampOf(h); S.layout = { ...S.layout, ...JSON.parse(cur.text) }; S.layoutHandle = h; S.layoutStamp = cur; S.baseLayout = JSON.stringify(S.layout); setStatus(`Opened layout ${h.name} (in-place save).`); render(); } catch (x) { setStatus("Layout is not JSON: " + x.message, true); }
}
// With a picker, the two Open buttons use it. Without one, the file inputs stay the way in, and Save downloads.
// A picker that fails (a browser can refuse it at file://) hands the button back to the file input, and the page says so.
const onOpenGraph = (e) => { e.preventDefault(); openGraphPicked(); };
const onOpenLayout = (e) => { e.preventDefault(); openLayoutPicked(); };
function pickerFailed(which, e) {
  $(which === "graph" ? "l-open" : "l-open-layout").removeEventListener("click", which === "graph" ? onOpenGraph : onOpenLayout);
  $(which === "graph" ? "f-graph" : "f-layout").click();
  setStatus(`The browser refused the file picker (${e.message}). Choose the file in the plain dialog; Save graph downloads in this session.`, true);
}
if (PICKER) { $("l-open").addEventListener("click", onOpenGraph); $("l-open-layout").addEventListener("click", onOpenLayout); }
$("f-layout").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { const l = JSON.parse(await readFile(f)), before = S.doc ? snap() : null; S.layout = { ...S.layout, ...l }; if (before) track(before); S.layoutHandle = null; S.layoutStamp = null; S.baseLayout = JSON.stringify(S.layout); setStatus(`Opened layout ${f.name}.`); render(); } catch (x) { setStatus("Layout is not JSON: " + x.message, true); }
  e.target.value = "";
});
$("b-save").addEventListener("click", () => saveTarget("graph"));
$("b-save-layout").addEventListener("click", () => saveTarget("layout"));
// Export is a download of a copy, in every browser, even where a handle exists. It changes no handle and clears no draft.
$("b-export").addEventListener("click", () => { if (S.doc) { download(S.fileName || S.name + ".graph.json", core.saveText(S.text)); setStatus("Exported a copy of the graph."); } });
$("b-layout").addEventListener("click", () => { if (S.doc) { const r = core.layoutForSave(S.layout, nodesOf().map((n) => n.name)); download(S.name + ".layout.json", JSON.stringify(r.layout, null, 2) + "\n"); setStatus("Exported a copy of the layout." + dropNote(r.dropped)); } });
refreshMode();

render();

// The page chrome: a collapsible side panel, a Run | Edit mode, a verdict chip, and the toast. No run logic lives here.
const UI_KEY = "agent-squad-dashboard-ui";
const UI = (() => { try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch (e) { return {}; } })();
function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify(UI)); } catch (e) { /* no storage: the choice lasts this page only */ } }

// An explicit toggle is remembered; an automatic open (a selection, a notice) is not, so the panel starts hidden every time.
function setSide(open, auto) {
  document.body.classList.toggle("noside", !open);
  $("b-panel").setAttribute("aria-expanded", String(open));
  if (!auto) { UI.side = open; saveUI(); }
  if (S.doc) fit();   // the drawer takes its width off the map, so an open or closed panel is a fit the graph can feel
}
function sideOpen() { return !document.body.classList.contains("noside"); }
function openSide() { if (!sideOpen()) setSide(true, true); }
setSide(!!UI.side, true);
$("b-panel").addEventListener("click", () => setSide(!sideOpen()));
// Escape closes the panel; the map behind it stays the map, so a click there is a click, not a dismissal.
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sideOpen() && !e.defaultPrevented) setSide(false); });
$("vchip").addEventListener("click", () => setSide(!sideOpen()));

// The drawer's grip. A drag on the 8px strip at its edge, or the arrows on the handle, sets --side-w between the stylesheet's
// --side-min and --side-max; a double-click puts the 420px default back. The width is page state, like the panel's open flag.
const SIDE_HIT = 8, SIDE_STEP = 24, SIDE_RESET = 420;
const sideProbe = document.createElement("div");
sideProbe.style.cssText = "position:fixed;top:-9999px;left:-9999px;height:0;pointer-events:none";
document.body.appendChild(sideProbe);
// The CSS owns the limits: --side-min and --side-max are measured through a probe, so the page and the stylesheet cannot drift.
function sidePx(tok) { sideProbe.style.width = `var(${tok})`; return Math.round(sideProbe.getBoundingClientRect().width); }
// A narrow window turns the drawer into a bottom sheet: the same variable is its height and the grip is sideways.
function sideRow() { return window.matchMedia("(max-width: 900px)").matches; }
function narrowScreen() { return window.matchMedia("(max-width: 600px)").matches; }
function sideWidth() { const r = $("left").getBoundingClientRect(); return Math.round(sideRow() ? r.height : r.width); }
function sideAria(now) {
  const grip = $("side-grip");
  grip.setAttribute("aria-orientation", sideRow() ? "horizontal" : "vertical");
  grip.setAttribute("aria-valuemin", String(sidePx("--side-min"))); grip.setAttribute("aria-valuemax", String(sidePx("--side-max"))); grip.setAttribute("aria-valuenow", String(now));
}
function setSideWidth(px, store) {
  const v = Math.min(Math.max(Math.round(px), sidePx("--side-min")), sidePx("--side-max"));
  document.body.style.setProperty("--side-w", v + "px");
  sideAria(v);
  if (store) { UI.sideW = v; saveUI(); }
  if (S.doc) fit();   // every change to the drawer is a change to the room the graph has
  return v;
}
// The grip is the whole 8px strip either side of the drawer's edge, so the press is judged by where it landed.
function onGrip(e) { const r = $("left").getBoundingClientRect(); return Math.abs(sideRow() ? e.clientY - r.top : e.clientX - r.left) <= SIDE_HIT; }
let sideDrag = null;
function startSideDrag(e) { sideDrag = { x: e.clientX, y: e.clientY, w: sideWidth() }; document.body.style.cursor = sideRow() ? "row-resize" : "col-resize"; }
document.addEventListener("pointerdown", (e) => { if (sideOpen() && onGrip(e)) startSideDrag(e); });
document.addEventListener("pointermove", (e) => { if (sideDrag) setSideWidth(sideRow() ? sideDrag.w + (sideDrag.y - e.clientY) : sideDrag.w + (sideDrag.x - e.clientX), false); });
document.addEventListener("pointerup", () => { if (!sideDrag) return; sideDrag = null; document.body.style.cursor = ""; UI.sideW = sideWidth(); saveUI(); });
$("side-grip").addEventListener("pointerdown", (e) => { e.stopPropagation(); if (sideOpen()) startSideDrag(e); });
$("side-grip").addEventListener("keydown", (e) => {
  const grow = sideRow() ? "ArrowDown" : "ArrowRight", shrink = sideRow() ? "ArrowUp" : "ArrowLeft";
  if (e.key === grow || e.key === shrink) setSideWidth(sideWidth() + (e.key === grow ? SIDE_STEP : -SIDE_STEP), true);
  else if (e.key === "Home" || e.key === "End") setSideWidth(sidePx(e.key === "Home" ? "--side-min" : "--side-max"), true);
  else return;
  e.preventDefault();
});
$("side-grip").addEventListener("dblclick", () => setSideWidth(SIDE_RESET, true));
window.addEventListener("resize", () => sideAria(sideWidth()));   // the sheet's limits are in vh: the handle follows a resize
if (UI.sideW !== undefined) setSideWidth(UI.sideW, false); else sideAria(sideWidth());   // a reload lands where the drag left the drawer

// Run mode reads a run; Edit mode shows every control that changes the graph. A loaded run opens in Run mode, a bare page in Edit mode, until the person picks.
var modePicked = false;
function setMode(edit, picked) {
  if (picked) modePicked = true;
  document.body.classList.toggle("edit", edit);
  $("m-edit").classList.toggle("on", edit); $("m-run").classList.toggle("on", !edit);
  $("m-edit").setAttribute("aria-pressed", String(edit)); $("m-run").setAttribute("aria-pressed", String(!edit));
  if (S.doc) renderSide();
}
$("m-run").addEventListener("click", () => setMode(false, true));
$("m-edit").addEventListener("click", () => setMode(true, true));
function inEdit() { return document.body.classList.contains("edit"); }

var VERDICT_CLASS = Object.fromEntries(core.RUN_STATES.filter((x) => x.cls).map((x) => [x.state, x.cls]));
function renderChrome() {
  if (!modePicked && inEdit() !== !S.events) setMode(!S.events);
  const st = S.stats, v = st && st.verdict, chip = $("vchip");
  chip.hidden = !st;
  $("ident").textContent = st ? `${st.graph_name} · ${st.run_id}` : (S.doc ? S.name : "no graph");
  $("ident").title = st ? `graph ${st.graph_name}, run ${st.run_id}` : "";
  if (st) {
    const past = S.replay && !S.replay.at_end;
    const words = core.STATE_TEXT[st.state] || st.state;   // the sidebar badges the same run with these words, from the one state table
    chip.textContent = past ? `replay · ${words}` : (v ? `${words} · exit ${v.exit_code}` : words);
    chip.className = VERDICT_CLASS[st.state] || "v-bad";
    const row = core.RUN_STATES.find((x) => x.state === st.state);
    chip.dataset.mk = (row && row.mark) || "none";
    chip.title = v && v.reasons.length ? core.causeSummary(v.reasons) : "The run's verdict. Click to open the details.";
  }
  // A record cut at a bad line shows its valid prefix under a banner that names the line. The banner takes height from the map.
  const rb = $("recbad"), bad = S.events ? S.recordBad : null, shown = !rb.hidden;
  rb.hidden = !bad;
  if (bad) rb.textContent = `Record line ${bad.line} is not JSON (${bad.message}). Showing the ${bad.shown} events before it; the line and everything after it are not shown.`;
  if (shown !== !!bad && S.fitted && S.doc) fit();
  // One delete button at a time: the one that can act.
  const rm = $("b-remove"), ul = $("b-unlink");
  rm.hidden = rm.disabled && !ul.disabled; ul.hidden = ul.disabled;
  followSelection();
}

// A selection opens the panel once; closing it again stays closed until the next new selection.
var lastSel = null;
function followSelection() { if (S.selected && S.selected !== lastSel) openSide(); lastSel = S.selected; }

// File menu: closes on a choice, on a click elsewhere and on Esc.
const fmenu = $("fmenu");
fmenu.addEventListener("click", (e) => { if (e.target.closest(".drop button, .drop label.btn")) setTimeout(() => { fmenu.open = false; }, 0); });
document.addEventListener("pointerdown", (e) => { if (fmenu.open && !fmenu.contains(e.target)) fmenu.open = false; });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && fmenu.open) fmenu.open = false;
  const tag = (e.target.tagName || "").toLowerCase();
  if (e.key === "[" && !e.metaKey && !e.ctrlKey && tag !== "input" && tag !== "textarea" && tag !== "select") setSide(!sideOpen());
});

// The status line is a toast: a plain message fades, an error stays until clicked.
var toastTimer = null;
function toast() {
  const el = $("status");
  clearTimeout(toastTimer);
  if (el.textContent && el.className !== "msg-bad") toastTimer = setTimeout(() => { el.textContent = ""; }, 8000);
}
$("status").addEventListener("click", () => { $("status").textContent = ""; });

</script>
</body>
</html>
