/* --edge is the meaningful non-text boundary, at 3:1 on panel and card: a card border on hover and on selection, a

   --line is a decorative rule and may sit lower; a card keeps --line at rest.
   The tint roles carry a state tone over a surface: --tint-* is the fill, --tint-*-line its border. --tint-alpha is the one
   opacity a tinted chip draws its tone at over card, and --on-tint is the ink drawn on that fill at 4.5:1 or more.
   --tint-ok is the fixed dark fill of the approved pull-request badge, a named role and not a tone at the opacity.
   --on-tone is the ink drawn on a solid tone fill. --err-strong is the lighter error ink drawn on an error tint. --code-bg is the fill of an
   inline code span. --alert-important is the accent of an

   lens, a drawing and never a surface.

  :root { --edge-rest:color-mix(in srgb, var(--edge), var(--fg) 10%); }   /* the resting border of an inactive indicator: a step lighter than --edge, 3:1 on panel and card */

  ul.errs { margin:0; padding-left:18px; color:var(--err); }

  #progress.on { display:flex; }
  #progress .cell { display:inline-flex; align-items:baseline; gap:6px; cursor:help; }

  #zoom { min-width:44px; text-align:center; color:var(--mute); font:var(--fs-field) var(--font-mono); }
  /* #replay is #footer's own transport row (#1813): the panel's bottom edge carries it, flat and hairline-thin, so the

  #replay { display:none; align-items:center; gap:4px; flex:0 1 auto; min-width:0; grid-column:2; justify-self:center; padding:2px 0 0; border-top:1px solid var(--line); pointer-events:auto; }
  #replay input[type=range] { flex:0 1 150px; width:150px; min-width:24px; accent-color:var(--acc); }
  #replay button { flex:none; height:var(--ctl-h); padding:0 3px; background:none; border:0; border-radius:var(--radius-sm); color:var(--mute); font:var(--fs-field) var(--font-mono); cursor:pointer; }
  #replay button:hover:not(:disabled) { background:var(--hover); color:var(--fg); }
  #replay button:disabled { opacity:.35; cursor:default; }
  #replay button, #r-pos { white-space:nowrap; }
  #r-pos { flex:none; color:var(--mute); font:var(--fs-field) var(--font-mono); text-align:right; }
  #r-pos.past { color:var(--warn); }
  /* #footer holds #hint and #replay as one row of three columns (#1859): the hint opens it, the transport takes the middle column
     and is centred in it, and the third column is the empty mirror of the first -- so the bar lands on the middle of the row's own
     width, whatever that width is, with no placement of its own. It stays in the flow: bottomReserve() and the legend's floor both
     measure the row's top, and a bar lifted out of the flow would collapse the row to the hint's height. */
  #footer { position:absolute; left:12px; right:12px; bottom:10px; display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:12px; pointer-events:none; }
  /* The row stops where the drawer begins, exactly as #view does: the transport rides the map's visible width, so an open panel
     slides the bar left instead of drawing it under the drawer. */
  body:not(.noside) #footer { right:calc(var(--side-w) + 12px); }

  .card rect { fill:var(--card); stroke:var(--line); stroke-width:1.2; }
  .card:hover rect { stroke:var(--edge); }
  .card.sel rect { stroke:var(--edge); fill:var(--raise); stroke-width:2; }
  .card.err rect { stroke:var(--err); }
  .card text { pointer-events:none; font:var(--fs-caption) var(--font-ui); }
  .card .nm { fill:var(--fg); font-size:var(--fs-caption); font-weight:600; font-family:var(--font-mono); }
  .card .kd { font-family:var(--font-ui); }
  .card, .group-card { font-variant-numeric:tabular-nums; }
  .card .kd { fill:var(--mute); font-size:var(--fs-caption); }
  .card .bd-e { fill:var(--err); font-size:var(--fs-caption); font-family:var(--font-mono); }
  .card .bd-o { fill:var(--warn); font-size:var(--fs-caption); font-family:var(--font-mono); }
  .card .st { fill:var(--mute); font-size:var(--fs-caption); font-family:var(--font-mono); }
  .card .bd-c { fill:var(--err-strong); font-size:var(--fs-caption); font-weight:600; font-family:var(--font-mono); }   /* a failure reason: 12 px, light on the dark red card */
  .card .rw { fill:var(--ok); font-size:var(--fs-caption); font-weight:600; font-family:var(--font-mono); }   /* a redo that passed, or a later attempt */

.card .kc { stroke:none; fill:var(--mute); }
.card .ki { fill:var(--well); font:600 var(--fs-caption) sans-serif; pointer-events:none; }
.card.k-agent .kc { fill:var(--s1); } .card.k-gate .kc { fill:var(--s2); } .card.k-action .kc { fill:var(--s3); }
.card.k-wait .kc { fill:var(--s5); } .card.k-loop .kc { fill:var(--s6); } .card.k-each .kc { fill:var(--s7); }
.card.k-dispatch .kc { fill:var(--s8); }

.card .kd.model { font-size:var(--fs-caption,13px); }
  pre.ev { margin:4px 0 8px; padding:6px; background:var(--bg); border:1px solid var(--line); border-radius:var(--radius-sm); font:var(--fs-field)/1.4 var(--font-mono); white-space:pre-wrap; word-break:break-all; max-height:200px; overflow:auto; color:var(--err-strong); }

  #edges g.edge.child line.ln { stroke-dasharray:4 3; }

  .card.o-fail rect { stroke:var(--err); fill:var(--tint-err); stroke-width:1.8; }
  .card.o-fail .gl { fill:var(--err); } .card.o-pass .gl { fill:var(--ok); } .card.o-deadline .gl, .card.o-needs-human .gl { fill:var(--warn); } .card.o-started .gl { fill:var(--acc); } .card.running .gl { fill:var(--run); }
  .card.o-deadline rect, .card.o-needs-human rect { stroke:var(--warn); fill:var(--tint-warn); }

  .card.sel rect { stroke:var(--edge); stroke-width:2; }
  .runbox { background:var(--inset); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px; font:var(--fs-caption)/1.6 var(--font-mono); }
  .runbox b { color:var(--fg); }
  .note.stale{color:var(--warn)} .runbox.stale{opacity:.45;filter:grayscale(1)}
  .state-completed { color:var(--ok); } .state-none { color:var(--none); } .state-running { color:var(--acc); } .state-stalled { color:var(--warn); font-weight:600; }

  .group-card.s-deadline .gl, .group-card.s-needs-human .gl { fill:var(--warn); }
  .group-card.sel > rect { stroke:var(--edge); stroke-width:2.5; }

  .chip-sw.v-ok { border-color:var(--ok); color:var(--ok); } .chip-sw.v-bad { border-color:var(--err); color:var(--err); }
  .chip-sw.v-wait { border-color:var(--wait); color:var(--wait); } .chip-sw.v-none { border-color:var(--none); color:var(--none); }

  /* The run-state pill the legend draws: one rule per state of the hub's table (contrib/squad-goal/scripts/hub.py RUN_STATES), colour and border alike, so a

  .b { display:inline-block; padding:0 6px; border-radius:var(--radius-lg); font-size:var(--fs-caption); border:1px solid; }

  .b.failed { color:var(--err); } .b.taken-over { color:var(--warn); } .b.retired-age-cap { color:var(--none); } .b.needs-human { color:var(--warn); } .b.handled { color:var(--ok); }
  .b.running { color:var(--run); } .b.starting { color:var(--run); border-style:dotted; } .b.unreadable { color:var(--warn); border-style:dotted; } .b.stalled { color:var(--wait); border-style:dashed; }
  .b.no-verdict-yet { color:var(--none); }
  .card:focus { outline:var(--focus-w) solid var(--focus); } .card:focus-visible > rect { stroke:var(--highlight); stroke-width:2.5; }   /* the keyboard ring: a white outline, like a hovered square */

  .group-card .sq.s-passed rect { fill:var(--tint-ok); stroke:var(--ok); } .group-card .sq.s-passed text { fill:var(--ok); }
  .group-card .sq.s-failed rect { fill:var(--tint-err); stroke:var(--err); } .group-card .sq.s-failed text { fill:var(--err); }
  .group-card .sq.s-deadline rect, .group-card .sq.s-needs-human rect { fill:var(--tint-warn); stroke:var(--warn); } .group-card .sq.s-deadline text, .group-card .sq.s-needs-human text { fill:var(--warn); }
  .group-card .sq.s-running rect { fill:var(--tint-acc); stroke:var(--run); } .group-card .sq.s-running text { fill:var(--run); }
  .group-card .sq.s-started rect { stroke:var(--acc); stroke-dasharray:3 2; }
  .group-card .sq.sup rect { stroke-dasharray:3 2; }   /* a failed child a later attempt replaced */
  .group-card .sq:hover rect { stroke:var(--highlight); }
  .group-card .sq:focus { outline:var(--focus-w) solid var(--focus); } .group-card g.sq.sq rect.fr { fill:none; stroke:none; } .group-card g.sq.sq:focus-visible rect.fr { stroke:var(--highlight); stroke-width:2; }   /* the keyboard ring: an outer white ring, so a focused selected square still differs from a selected one */

  table.roster { width:100%; border-collapse:collapse; font:var(--fs-field) var(--font-mono); }

  /* The legend is a strip on the map's right edge, under the zoom controls: always expanded; the graph keeps the remaining width. */
  #legend { position:absolute; right:12px; top:52px; z-index:4; box-sizing:border-box; width:220px; max-height:calc(100% - 52px - var(--legend-bottom, 40px)); overflow:auto; overscroll-behavior:contain; pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); color:var(--mute); font-size:var(--fs-caption); }

  #legend .lg { display:flex; align-items:center; gap:6px; padding:2px 1px; white-space:nowrap; }

  #fmenu .drop { position:absolute; right:0; top:calc(100% + 4px); z-index:12; display:flex; flex-direction:column; gap:2px; min-width:230px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:4px; box-shadow:0 6px 20px var(--shadow-soft); }

/* A window under 1024px starts with a narrower drawer; --side-max stays 520px short of the viewport, so 504px of travel at 1024. */
@media (max-width: 1024px) { body { --side-w:360px; } }
/* Under 900px the drawer becomes a bottom sheet: full width, 52vh tall, and the grip turns sideways between 30vh and 75vh.
   The map reserves the sheet's height, and the footer row — the hint and the replay bar together — rises clear of it. */
@media (max-width: 900px) {
  body { --side-w:52vh; --side-min:30vh; --side-max:75vh; grid-template-rows:auto 1fr; }
  /* The top bar wraps to as many rows as its controls need (#916). The map's row is the rest of the screen, so the page
     never runs sideways at a tablet or phone width; #left docks below this breakpoint, so its top edge follows no fixed bar height. */
  #topbar { height:auto; min-height:37px; flex-wrap:wrap; row-gap:6px; }
  #left { top:auto; left:0; right:0; width:auto; height:var(--side-w,52vh); border-top:1px solid var(--line); border-left:0; }
  #side-grip { top:auto; bottom:calc(var(--side-w,52vh) - 8px); left:0; right:0; width:auto; height:8px; cursor:row-resize; }
  #left::before { top:auto; bottom:var(--side-w,52vh); left:0; right:0; width:auto; height:8px; cursor:row-resize; }
  body:not(.noside) #mapbox { padding-bottom:52vh; }
  body:not(.noside) #view { right:12px; }
  body:not(.noside) #footer { bottom:calc(var(--side-w,52vh) + 10px); right:12px; }   /* the whole row clears the sheet: the bar rides in it, and the sheet takes no width off the row */
}

/* A phone (#916): the footer row keeps only the transport, which may wrap inside its middle column, and the hint goes;
   a file-menu label takes the phone's own tap height. The top bar already wraps under the 900px side-panel breakpoint,
   so nothing here adds width. */
@media (max-width: 600px) {
  #hint { display:none; }
  #replay { flex-wrap:wrap; }
  label.btn { min-height:var(--ctl-h-phone); }
}

/* The single-card mode (#1782): `?card=<name>` paints ONE card of the panel and nothing else, for the second view the
   hub's pip opens over its maximized board. The card is the panel's own data (core.cardBody), so the two cannot drift. */
body.card-mode { display: block; margin: 0; }
body.card-mode #topbar, body.card-mode #left, body.card-mode #graph, body.card-mode #footer,
body.card-mode #totals, body.card-mode #progress, body.card-mode #replay, body.card-mode #status, body.card-mode #help { display: none; }
body.card-mode #card { display: block; }

#card .cgroup { border: 1px solid var(--line); border-radius: var(--radius-md); margin: 0 0 6px; padding: 4px 8px 6px; background: var(--panel); }
#card .cgroup.s-running, #card .cgroup.s-started { border-color: var(--run); }
#card .cgroup.s-failed, #card .cgroup.s-rejected { border-color: var(--err); }
#card .crow { display: flex; gap: 6px; align-items: baseline; padding: 1px 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#card .crow b { font-weight: 600; }
#card .crow.s-passed { color: var(--ok); }
#card .crow.s-failed, #card .crow.s-rejected { color: var(--err); }
#card .crow.s-running, #card .crow.s-started { color: var(--run); }
#card .crow.s-queued { color: var(--mute); }
#card .cnote { color: var(--mute); line-height: 1.4; }

<script>"use strict";
// Dashboard core module: canonical form, hash and import. The module the others depend on.
// A factory: it takes ENGINE and the modules it depends on, and returns its functions. No DOM here.
// scripts/build_dashboard.py bundles every file of dashboard/core/ in dependency order; nothing loads one file alone.

function canonModule(ENGINE) {
  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);

  // ---- Canonical form and hash: json.dumps(doc, sort_keys=True, separators=(",", ":")) of the parsed document ----
  // JSON.parse loses the difference between 2 and 2.0, so a small parser reads the text and writes the canonical form.
  function pyFloat(raw) {
    const x = Number(raw);
    if (Object.is(x, -0)) return "-0.0";
    if (!Number.isFinite(x)) throw new Error("number out of range: " + raw);
    const [mant, ex] = x.toExponential().split("e");
    const e = parseInt(ex, 10);
    const neg = mant.startsWith("-");
    const digits = mant.replace("-", "").replace(".", "");
    let s;
    if (e >= -4 && e < 16) {
      if (e >= 0) {
        const ip = digits.slice(0, e + 1).padEnd(e + 1, "0");
        const fp = digits.slice(e + 1) || "0";
        s = `${ip}.${fp}`;
      } else s = `0.${"0".repeat(-e - 1)}${digits}`;
    } else {
      const m = digits.length > 1 ? `${digits[0]}.${digits.slice(1)}` : digits;
      s = `${m}e${e < 0 ? "-" : "+"}${String(Math.abs(e)).padStart(2, "0")}`;
    }
    return (neg ? "-" : "") + s;
  }

  function pyInt(raw) {
    const b = BigInt(raw);
    return b.toString();
  }

  function pyString(s) {
    let out = '"';
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i), ch = s[i];
      if (ch === '"') out += '\\"';
      else if (ch === "\\") out += "\\\\";
      else if (ch === "\n") out += "\\n";
      else if (ch === "\r") out += "\\r";
      else if (ch === "\t") out += "\\t";
      else if (ch === "\b") out += "\\b";
      else if (ch === "\f") out += "\\f";
      else if (c < 0x20 || c > 0x7e) out += "\\u" + c.toString(16).padStart(4, "0");
      else out += ch;
    }
    return out + '"';
  }

  const cmpCodePoints = (a, b) => {
    const x = Array.from(a), y = Array.from(b);
    for (let i = 0; i < Math.min(x.length, y.length); i++) {
      const d = x[i].codePointAt(0) - y[i].codePointAt(0);
      if (d) return d;
    }
    return x.length - y.length;
  };

  function canonText(v) {
    if (v === null) return "null";
    if (typeof v === "boolean") return v ? "true" : "false";
    if (typeof v === "number") return Number.isInteger(v) ? String(v) : pyFloat(String(v));
    if (typeof v === "string") return pyString(v);
    if (Array.isArray(v)) return "[" + v.map(canonText).join(",") + "]";
    return "{" + Object.keys(v).sort(cmpCodePoints).map((k) => pyString(k) + ":" + canonText(v[k])).join(",") + "}";
  }

  // Canonical form straight from the JSON text.
  function canonFromText(text) {
    let i = 0;
    const ws = () => { while (" \t\n\r".includes(text[i])) i++; };
    const fail = (m) => { throw new Error(`${m} at ${i}`); };
    function val() {
      ws();
      const c = text[i];
      if (c === "{") {
        i++; ws();
        const items = new Map();
        if (text[i] === "}") { i++; return "{}"; }
        for (;;) {
          ws(); if (text[i] !== '"') fail("expected a key");
          const k = str(); ws(); if (text[i++] !== ":") fail("expected :");
          items.set(k, val()); ws();
          if (text[i] === ",") { i++; continue; }
          if (text[i] === "}") { i++; break; }
          fail("expected , or }");
        }
        return "{" + [...items.keys()].sort(cmpCodePoints).map((k) => pyString(k) + ":" + items.get(k)).join(",") + "}";
      }
      if (c === "[") {
        i++; ws();
        const out = [];
        if (text[i] === "]") { i++; return "[]"; }
        for (;;) {
          out.push(val()); ws();
          if (text[i] === ",") { i++; continue; }
          if (text[i] === "]") { i++; break; }
          fail("expected , or ]");
        }
        return "[" + out.join(",") + "]";
      }
      if (c === '"') return pyString(str());
      for (const [w, v] of [["true", "true"], ["false", "false"], ["null", "null"]]) if (text.startsWith(w, i)) { i += w.length; return v; }
      const m = /^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?/.exec(text.slice(i));
      if (!m) fail("unexpected token");
      i += m[0].length;
      return m[2] || m[3] ? pyFloat(m[0]) : pyInt(m[0]);
    }
    function str() {
      const start = i++;
      while (text[i] !== '"') { if (i >= text.length) fail("unterminated string"); if (text[i] === "\\") i++; i++; }
      i++;
      return JSON.parse(text.slice(start, i));
    }
    const out = val(); ws();
    if (i !== text.length) fail("trailing text");
    return out;
  }

  async function sha256Hex(s) {
    const buf = await globalThis.crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  const graphHash = (text) => sha256Hex(canonFromText(text));

  // ---- Import: any parseable JSON that holds a schema_version ----
  function parseImport(text) {
    let doc;
    try { doc = JSON.parse(text); } catch (e) { return { error: "This file is not parseable JSON: " + e.message }; }
    if (!isObj(doc) || !("schema_version" in doc)) return { error: "This file has no schema_version, so it is not a graph document." };
    return { doc };
  }

  // The workflow a `squad editor` link names in its fragment: { name, text }; null when there is none; { error } when it cannot be read.
  function openedWorkflow(hash) {
    const m = /^#workflow=(.+)$/.exec(hash);
    if (!m) return null;
    let got = null;
    try {
      const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64.padEnd(Math.ceil(b64.length / 4) * 4, "=")), (c) => c.charCodeAt(0));
      got = JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { got = null; }
    if (!isObj(got) || typeof got.name !== "string" || typeof got.text !== "string") return { error: "The workflow in this link could not be read; use Open graph." };
    return { name: got.name, text: got.text };
  }

  const same = (a, b) => canonText(a) === canonText(b);
  const clone = (v) => JSON.parse(JSON.stringify(v));

  return { isObj, same, clone, pyFloat, pyInt, pyString, cmpCodePoints, canonText, canonFromText, sha256Hex, graphHash, parseImport, openedWorkflow };
}

// Dashboard core module: The numbers every read module sums, and the token and timeline figures of a record.. Moved from rest.js with no change.
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function figuresModule() {
  // ---- A finished run: statistics, harness, and the hash rule ----
  // Every figure comes from a field the record has today. A field the record lacks is null, never zero (a sum of nulls is null).
  const num = (v) => typeof v === "number" && Number.isFinite(v);

  const sumOf = (vs) => { const xs = vs.filter(num); return xs.length ? xs.reduce((a, b) => a + b, 0) : null; };

  const orNull = (v) => v === undefined ? null : v;

  const lastOf = (xs) => xs.length ? xs[xs.length - 1] : undefined;

  function runTimeline(events) {
    const t0 = events[0].ts;
    return events.map((e) => ({ pos: orNull(e.pos), at: num(e.ts) && num(t0) ? e.ts - t0 : null, event: e.event, node: orNull(e.node), entry: orNull(e.entry),
      outcome: e.event === "verdict" ? e.verdict : orNull(e.outcome) }));
  }

  // Tokens per second is tokens out over elapsed, counted only over the calls that have both and a positive elapsed.
  // A call with no tokens, or with no time, adds nothing to the rate: unknown stays null, never zero.
  function tokenFigures(outs) {
    const timed = outs.filter((o) => num(o.tokens_out) && num(o.elapsed) && o.elapsed > 0);
    const secs = sumOf(timed.map((o) => o.elapsed));
    return { tokens_in: sumOf(outs.map((o) => o.tokens_in)), tokens_out: sumOf(outs.map((o) => o.tokens_out)), tps: secs ? sumOf(timed.map((o) => o.tokens_out)) / secs : null };
  }

  return { num, sumOf, orNull, lastOf, tokenFigures, runTimeline };
}

// Dashboard core module: The run record: parse, the live reread, and the adaptation overlay.. Moved from rest.js with no change.
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function recordModule({ graphHash }) {
  // ---- Run record (read-only) and the overlay ----
  // A line that is not JSON ends the record there: the lines before it are shown, the line and the lines after it are not, and
  // `bad` names the line and what was wrong. The page never skips the bad line to read on: events after a gap would be a wrong run.
  // With no valid prefix (line 1 is bad, or the first event is not run_start) there is nothing to show, and `error` says why.
  // Local patch: the SDK's spend is an estimate at the wrong list prices for non-Claude models; re-price from tokens (same table as the hub).
  const PRICES = [[/deepseek-.*pro/, 0.044, 1.32, 3.96], [/deepseek/, 0.006, 0.3, 1.2], [/grok-4\.5/, 0.30, 2, 6], [/grok-4\.[67]/, 0.50, 2, 6],
    [/gpt-5\.6-sol-fast/, 0.8, 8, 40], [/gpt-5\.6-sol/, 0.4, 4, 20], [/gpt-5\.6-terra-fast/, 0.4, 4, 24], [/gpt-5\.6-terra/, 0.2, 2, 12],
    [/gpt-5\.5-fast/, 1.25, 12.5, 75], [/gpt-5\.5/, 0.5, 5, 30], [/gpt-6\.1-sol-fast/, 0.2, 4, 20], [/gpt-6\.1-sol/, 0.1, 2, 10]];
  function repriced(ev) {
    if (ev.event !== "outcome" || typeof ev.model !== "string" || typeof ev.tokens_in !== "number") return ev;
    for (const [rx, hit, miss, out] of PRICES) if (rx.test(ev.model)) {
      const cr = ev.cache_read || 0;
      return { ...ev, spend_sdk: ev.spend, spend: (cr * hit + Math.max(ev.tokens_in - cr, 0) * miss + (ev.tokens_out || 0) * out) / 1e6 };
    }
    return ev;
  }
  function parseRecord(text) {
    const events = [];
    const lines = text.split("\n");
    let bad = null;
    for (let n = 0; n < lines.length && !bad; n++) {
      if (!lines[n].trim()) continue;

      } catch (e) { bad = { line: n + 1, message: e.message }; }
    }

    if (!events[0] || events[0].event !== "run_start") return { error: "A run record starts with a run_start event." };
    return bad ? { events, bad: { ...bad, shown: events.length } } : { events };
  }

  function parseLive(text) {
    const cut = text.lastIndexOf("\n");
    return parseRecord(cut < 0 ? "" : text.slice(0, cut + 1));
  }

  const REPORT_NOTE = "one observation, not a measurement: each entry is a fresh session, so the two entries may be different tasks";

  const REPORT_INSTRUMENT = "code: outcome events of the run record; spend is the measured SDK result; elapsed is wall-clock";

  const FIELDS = ["outcome", "spend", "turns", "elapsed"];

  const entryOf = (e) => e === undefined ? null : { entry: e.entry, pos: e.pos, reasons: e.reasons, ...Object.fromEntries(FIELDS.map((k) => [k, e[k] === undefined ? null : e[k]])) };

  function deltaOf(prev, next) {
    if (!prev || !next) return Object.fromEntries(FIELDS.map((k) => [k, null]));
    const out = { outcome: `${prev.outcome} -> ${next.outcome}` };
    for (const k of ["spend", "turns", "elapsed"]) out[k] = prev[k] === null || next[k] === null ? null : Math.round((next[k] - prev[k]) * 1e6) / 1e6;
    return out;
  }

  function overlayRows(events) {
    const outs = events.filter((e) => e.event === "outcome");
    return events.filter((e) => e.event === "applied").map((a) => {
      const mine = outs.filter((o) => o.node === a.target);
      const prev = [...mine].reverse().find((o) => o.pos < a.pos);
      const next = mine.find((o) => o.pos > a.pos);
      const p = entryOf(prev), n = entryOf(next);
      return { proposal_id: a.proposal_id, kind: a.kind, target: a.target, old: a.old, requested: a.requested, range: a.range, facts: a.facts,
        proposer: a.proposer, previous: p, next: n, delta: deltaOf(p, n), instrument: REPORT_INSTRUMENT, note: REPORT_NOTE };
    });
  }

  // The overlay shows only when the record's graph hash equals the loaded graph's hash.
  async function overlayFor(graphText, events) {
    const start = events.find((e) => e.event === "run_start");
    let hash;
    try { hash = await graphHash(graphText); } catch (e) { return { shown: false, reason: "The loaded graph text has no canonical form: " + e.message }; }
    if (start.graph_hash !== hash) return { shown: false, reason: `The record's graph hash (${String(start.graph_hash).slice(0, 12)}…) differs from the loaded graph's (${hash.slice(0, 12)}…). No overlay.`, hash };
    return { shown: true, hash, rows: overlayRows(events) };
  }

  return { parseRecord, parseLive, REPORT_NOTE, REPORT_INSTRUMENT, FIELDS, entryOf, deltaOf, overlayRows, overlayFor };
}

// Dashboard core module: A run still being written: the read delay, the calls in flight, the live state.. Moved from rest.js with no change.
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function liveModule({ lastOf, num, orNull }) {
  // The key one call is known by: its node, its entry, and its item. A call_start, the progress events of that call, and
  // its outcome all carry the same three, so the record's own fields pair them without a new index.
  const callKey = (e) => `${e.node}|${e.entry}|${orNull(e.item)}`;

  // Where each call in flight has got to, as the call itself last reported it. A running call records a
  // `progress` event now and then; the last one for a call wins. A call that reported nothing has no entry here, so its
  // figures stay unknown, never zero.
  function callProgress(events) {
    const out = new Map();
    for (const e of events) if (e.event === "progress") out.set(callKey(e), { messages: orNull(e.messages), context_tokens: orNull(e.context_tokens), tool: orNull(e.tool) });
    return out;
  }

  // The open call of each node, with the time it has run and what it last reported. A node runs one entry at a time, so
  // the map is keyed by the node; where two entries of one node are open, the longer-running one is the one shown.
  // A call whose call_start carries no start time has no duration, so it makes no entry: unknown time stays unknown.
  // A run with a verdict has nothing in flight (liveState says the same): a call_start left open by a killed call must
  // never read as running again.
  function openCalls(events, now) {
    const prog = callProgress(events), out = new Map();
    if (lastOf(events.filter((e) => e.event === "verdict"))) return out;
    for (const c of inFlight(events, now)) {
      const prev = out.get(c.node);
      if (num(c.since) && (!prev || c.since > prev.running_for)) out.set(c.node, { running_for: c.since, live: prog.get(callKey(c)) || null });
    }
    return out;
  }

  // ---- A live run ----
  // The reread interval is an engine setting that run_start records. A record made before it, or a bad value, gets one second.
  function readDelay(events) {
    const d = events && events[0] && events[0].defaults && events[0].defaults.engine && events[0].defaults.engine.dashboard;
    const r = d && d.reread_seconds;
    return num(r) && r > 0 ? r : 1;
  }

  // Stalled is a display state, not a gate: no new event for longer than the longest call in flight may take, plus a grace.
  // With no call in flight, a gate command or an effect can be quiet for a while, so the idle period is longer.
  const STALL_IDLE = 300, STALL_GRACE = 60;

  // A call in flight is a call_start with no outcome for the same node, entry and item. A gate_start opens a gate's
  // check the same way (#680); a record made before it has none, and its gates never read as in flight.
  const STARTS = new Set(["call_start", "gate_start"]);
  function inFlight(events, now) {
    const done = new Set(events.filter((e) => e.event === "outcome").map((e) => `${e.node}|${e.entry}|${orNull(e.item)}`));
    return events.filter((e) => STARTS.has(e.event) && !done.has(`${e.node}|${e.entry}|${orNull(e.item)}`))
      .map((e) => ({ node: e.node, entry: e.entry, item: orNull(e.item), since: num(e.started_at) ? now - e.started_at : null, limit: e.limit }));
  }

  function liveState(events, now) {
    const v = lastOf(events.filter((e) => e.event === "verdict"));
    const flight = v ? [] : inFlight(events, now);
    // A call with no deadline (limit null) may run as long as it likes, so the run is never called stalled while it is in flight.
    const limits = flight.map((c) => c.limit);
    const stallAfter = limits.some((l) => !num(l)) ? null : (limits.length ? Math.max(...limits) : STALL_IDLE) + STALL_GRACE;
    const end = lastOf(events), sinceLast = num(end.ts) ? now - end.ts : null;
    const state = v ? v.verdict : stallAfter !== null && sinceLast !== null && sinceLast > stallAfter ? "stalled" : "running";
    return { state, since_last: sinceLast, stall_after: stallAfter, in_progress: flight.map(({ node, entry, item, since }) => ({ node, entry, item, since })) };
  }

  return { readDelay, STALL_IDLE, inFlight, liveState, callKey, callProgress, openCalls };
}

// Dashboard core module: Why a node failed, and a node's label.. Moved from rest.js with no change.
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function failuresModule({ orNull }) {
  // ---- Failures and dispatch children ----
  // A reason is `<check id>:<code>:<detail>` from a gate, `check:<gate>:<code>:<detail>` from a dispatch check, or a bare code.
  // A check id has no underscore, a code has no hyphen: that is how `after_failed:route.router.1` stays a code.
  function reasonParts(text) {
    const raw = String(text), seg = raw.split(":");
    const isGate = (x) => /^[a-z][a-z0-9-]*$/.test(x) && !x.includes("_");
    let gate = null, rest = seg;
    if (seg[0] === "check" && seg.length > 1) { gate = seg[1]; rest = seg.slice(2); }
    else if (seg.length > 1 && isGate(seg[0])) { gate = seg[0]; rest = seg.slice(1); }
    const code = rest.length ? rest[0] : seg[0], detail = rest.slice(1).join(":");
    // The subject names what failed: the first python file of an acceptance command (the issue's test), else the detail cut short.
    const py = code === "ac_failed" ? /(?:^|[\s/])([\w.-]+\.py)\b/.exec(detail) : null;
    const subject = py ? py[1] : detail.length > 60 ? detail.slice(0, 59) + "…" : detail;
    return { raw, gate, code, detail, subject };
  }

  // One short line for a card: each code once, with a count when it repeats.
  function causeSummary(reasons) {
    const rs = (Array.isArray(reasons) ? reasons : []).map(reasonParts);
    if (!rs.length) return null;
    const by = new Map();
    for (const r of rs) by.set(r.code, (by.get(r.code) || 0) + 1);
    return [...by].map(([c, n]) => n > 1 ? `${c} ×${n}` : c).join(", ");
  }

  // Every failure the record shows, in order: a node that did not pass, a landing that failed, a request that code rejected.
  // An outcome whose reasons repeat an earlier one is a fold of it (a loop that carries its child's reasons), so it is skipped.
  function failureCauses(events) {
    const seen = new Set(), out = [];
    const add = (e, kind, node, outcome, reasons, evidence) => {
      const key = JSON.stringify(reasons);
      if (!reasons.length || seen.has(key)) return;
      seen.add(key);
      out.push({ kind, node, outcome, pos: orNull(e.pos), reasons: reasons.map((r) => ({ ...reasonParts(r), evidence: evidence && evidence[r] !== undefined ? evidence[r] : null })) });
    };
    for (const e of events) {
      if (e.event === "outcome" && e.outcome !== "pass") add(e, "node", e.node, e.outcome, e.reasons || [], e.evidence);
      else if (e.event === "land" && e.outcome !== "pass") add(e, "land", e.node, e.outcome, e.reasons || [], e.effect && e.effect.stderr ? Object.fromEntries((e.reasons || []).map((r) => [r, e.effect.stderr])) : null);
      else if (e.event === "spawn_rejected") add(e, "rejected", `${e.envelope} request ${e.request_key}`, "rejected", e.reasons || [e.reason], null);
    }
    return out;
  }

  // The bare skill name of a node or a dispatch child: a skill field is a string, or a {name, version} object already
  // resolved by squad/envelope.py. The label drops the version; the detail panel keeps it.
  const skillName = (s) => (typeof s === "string" && s ? s : s && typeof s.name === "string" && s.name ? s.name : null);

  // The role label on a node card: what the node IS, derived from the graph node, never its bare name when a
  // role is known. Display only: it never writes the graph and never enters the graph hash. A node the rule does
  // not cover falls back to its name, so the label is never empty. A loop, an each, and a dispatch carry no role field of
  // their own (their bound and their kind sit on the detail line), and two loops would collide on the bare kind, so they
  // keep their own name, the only token that tells them apart.
  function nodeLabel(node) {
    const n = node || {};
    const name = typeof n.name === "string" && n.name ? n.name : null;
    const field = (k) => (typeof n[k] === "string" && n[k] ? n[k] : null);
    if (n.kind === "gate") return field("check") || name || "gate";
    if (n.kind === "action") return field("effect") || name || "action";
    if (n.kind === "wait") return field("owner") || name || "wait";
    if (n.kind === "agent") return skillName(n.skill) || name || "agent";
    return name || field("kind") || "node";
  }

  return { reasonParts, causeSummary, failureCauses, skillName, nodeLabel };
}

// Dashboard core module: The children a dispatch spawned: their rows, layout and checks.. Moved from rest.js with no change.
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function childrenModule({ num, openCalls, orNull, skillName }) {
  // The issue a spawn ran, read from its own prompt: a tracker reference ("GitHub issue #1179", "issue #14") or the issue
  // file ("issues/14-slug.md" -> 14), whichever the prompt names first. A prompt states its own issue first and cites a
  // blocker after ("... issues/20-x.md ... Issue #19 has landed"), so the first reference is the one it ran. The file form
  // must sit under issues/, so another numbered file the prompt cites ("docs/adr/gui/0272-the-hook.md") never reads as the
  // issue. A prompt with neither names none.
  const issueNumber = (prompt) => {
    const t = typeof prompt === "string" ? prompt : "";
    const found = [/\bissue\s+#(\d+)/i, /(?:^|[\s/`"'(])issues\/(\d+)-[\w-]+\.md/].map((re) => re.exec(t)).filter(Boolean);
    const first = found.sort((a, b) => a.index - b.index)[0];
    return first ? Number(first[1]) : null;
  };
  // Every issue one child works (#954): a cluster dispatch packs several into one child, and its own form is
  // "GitHub issue(s) 897, 908, 910". Only that form counts, so a blocker the pasted ticket text quotes is not the
  // child's work. Empty when the text carries no cluster form.
  const issueNumbers = (prompt) => {
    const t = typeof prompt === "string" ? prompt : "";
    const out = [];
    const re = /GitHub issues?(?:\s*\(s\))?\s*#?([0-9][0-9,\s]*)/g;
    let m;
    while ((m = re.exec(t))) for (const x of m[1].split(/[^0-9]+/)) if (x && !out.includes(Number(x))) out.push(Number(x));
    return out;
  };

  // A dispatch child's short name for display: route.router.1 -> router.1. The full name stays in the tooltip.
  const shortChildName = (name, dispatch) => (typeof name === "string" && typeof dispatch === "string" && name.startsWith(dispatch + ".") ? name.slice(dispatch.length + 1) : name);

  // The review of one child, as its record has it: the last round's verdict, time and findings, and how many rounds ran. A review
  // is live while the child's last event of the review kind is a `review_progress`: it is still running, so it has no verdict yet.
  // A child with no review gate has none. A landing without a round event (an older record) still carries its review.
  function childReview(events, child, land) {
    const mine = events.filter((e) => e.node === child && ["outcome", "review_progress", "review_round", "land"].includes(e.event));
    const rounds = mine.filter((e) => e.event === "review_round");
    const tail = mine[mine.length - 1];
    const live = !!tail && tail.event === "review_progress";
    const done = rounds.length ? rounds[rounds.length - 1].review : land && land.effect && land.effect.review ? land.effect.review : null;
    if (!done && !live) return null;
    const count = rounds.length || (land && land.effect && num(land.effect.rounds) ? land.effect.rounds : 1);
    return { verdict: live ? null : orNull(done.verdict), elapsed: live ? orNull(tail.elapsed) : orNull(done.elapsed), findings: !live && done && done.findings ? done.findings : "",
      exit_code: !live && done ? orNull(done.exit_code) : null, rounds: count, live };
  }

  // The children of every dispatch, in request order. Each carries what its call recorded and what landing did to it.
  // An outcome that is not pass after landing is fail, so a landing failure shows on the child, not only in its own event.
  // `now` (epoch seconds) makes a child that is running now read as running, with its time and its live figures; without
  // it a child in flight keeps the static `started` state.
  function runChildren(events, now) {
    const last = (kind) => new Map(events.filter((e) => e.event === kind).map((e) => [e.node, e]));
    const outs = last("outcome"), lands = last("land"), started = new Set(events.filter((e) => e.event === "call_start").map((e) => e.node));
    const open = num(now) ? openCalls(events, now) : new Map();
    const kids = events.filter((e) => e.event === "spawn_accepted").map((a) => {
      const o = outs.get(a.child), l = lands.get(a.child), d = a.definition || {}, run = open.get(a.child) || null;
      const landFailed = !!(l && l.outcome !== "pass");
      const outcome = landFailed ? "fail" : o ? o.outcome : started.has(a.child) ? "started" : null;
      const reasons = landFailed ? l.reasons || [] : o ? o.reasons || [] : [];
      const evidence = landFailed && l.effect && l.effect.stderr ? Object.fromEntries(reasons.map((r) => [r, l.effect.stderr])) : o && o.evidence ? o.evidence : null;
      const checks = o && o.checks ? o.checks : null;
      const short = shortChildName(a.child, a.envelope);   // the display name: route.router.1 -> router.1
      const issue = issueNumber(d.prompt), issues = issueNumbers(d.prompt), skill = skillName(d.skill);
      return { name: a.child, dispatch: a.envelope, proposer: orNull(a.parent), depth: orNull(a.depth), rejected: false, outcome, reasons, evidence, checks, issue, task: orNull(d.task),
        review: childReview(events, a.child, l),
        running_for: run ? run.running_for : null, live: run ? run.live : null,   // a child in flight: how long it has run, and what it last reported
        skill: orNull(d.skill), skillLabel: skill,   // the bare skill name, for the detail line
        // The task first: every child of one dispatch usually runs the same skill, so the skill alone tells no two children
        // apart, while the issue does. A child with no task falls back to its skill, then to its own name.
        label: issues.length > 1 ? `issues ${issues.map((x) => `#${x}`).join(', ')}` : issue === null ? skill || short : `issue #${issue}`,
        model: o && o.model ? o.model : orNull(d.model), effort: o && o.effort ? o.effort : orNull(d.effort), after: Array.isArray(d.after) ? d.after : [],
        workspace: orNull(d.workspace), spend: o ? orNull(o.spend) : null, turns: o ? orNull(o.turns) : null, elapsed: o ? orNull(o.elapsed) : null,
        tokens_in: o ? orNull(o.tokens_in) : null, tokens_out: o ? orNull(o.tokens_out) : null, tps: o && num(o.tokens_out) && num(o.elapsed) && o.elapsed > 0 ? o.tokens_out / o.elapsed : null,
        land: l ? { outcome: l.outcome, head: l.effect ? orNull(l.effect.head) : null, held_out: l.effect ? orNull(l.effect.held_out) : null, reasons: l.reasons || [] } : null };
    });
    const bad = events.filter((e) => e.event === "spawn_rejected").map((e) => ({ name: `${e.envelope} request ${e.request_key}`, dispatch: e.envelope, proposer: orNull(e.parent), depth: null,
      rejected: true, outcome: "fail", reasons: e.reasons || [e.reason], evidence: null, checks: null, skill: null, skillLabel: null, label: `${e.envelope} request ${e.request_key}`,
      model: null, effort: null, after: [], workspace: null, spend: null, turns: null, running_for: null, live: null, review: null,
      elapsed: null, tokens_in: null, tokens_out: null, tps: null, land: null, issue: null }));
    // The position of each child among the children of its dispatch, and a title no two children share: "issue #11" can
    // repeat across waves, "3 · issue #11" cannot.
    const seen = {};
    const all = [...kids, ...bad];
    for (const c of all) { c.index = seen[c.dispatch] = (seen[c.dispatch] || 0) + 1; c.title = `${c.index} · ${c.label}`; }
    markRework(all);
    return all;
  }

  // Which children are attempts at one task. Attempts are the children of one dispatch that share a task
  // key: the spawn's own `task`, else the issue its prompt names. The marks are derived text. The record holds no "redo of" fact, so
  // no edge is drawn, and a failed attempt stays failed. It reads superseded once a later attempt of the same task passed.
  // A child passed when its call and its landing passed and its held-out command did not fail.
  const passedClean = (c) => c.outcome === "pass" && !(c.land && c.land.held_out === "fail");

  function reworkText(c, winner) {
    if (winner) return `superseded by ${winner.index} · ${winner.label}, which passed`;
    if (c.attempt === 1) return null;
    if (passedClean(c)) return `passed after ${c.attempt} attempts`;
    const why = c.outcome === "pass" ? "held-out test failed" : c.outcome === "fail" ? "failed" : c.outcome && c.outcome !== "started" ? c.outcome : "";
    return `attempt ${c.attempt}${why ? ", " + why : ""}`;
  }

  // The tasks one child worked: its `task` split at commas, else the issue its prompt names. A router may fold two issues into one child
  // ("13, 21"), so a child can belong to more than one task.
  const taskKeys = (c) => {
    if (c.rejected) return [];
    const t = c.task === null || c.task === undefined ? "" : String(c.task);
    const parts = t.split(/[,\s]+/).filter(Boolean);
    return parts.length ? parts : c.issue === null ? [] : [String(c.issue)];
  };

  function markRework(all) {
    const keys = new Map(all.map((c) => [c, taskKeys(c)]));
    for (const c of all) Object.assign(c, { attempt: null, superseded_by: null, rework: null });
    const same = (c) => all.filter((o) => o.dispatch === c.dispatch && keys.get(o).some((t) => keys.get(c).includes(t)));
    for (const c of all) {
      const mine = keys.get(c);
      if (!mine.length) continue;
      const related = same(c);
      if (related.length < 2) continue;
      const i = related.indexOf(c);
      c.attempt = i + 1;
      // superseded: every task of this child has a later clean attempt. The first such attempt is the one named.
      const later = related.slice(i + 1).filter(passedClean);
      const covered = !passedClean(c) && mine.every((t) => later.some((o) => keys.get(o).includes(t)));
      const winner = covered ? later.find((o) => keys.get(o).some((t) => mine.includes(t))) : null;
      c.superseded_by = winner ? winner.index : null;
      c.rework = reworkText(c, winner);
    }
  }

  // The available-vs-used harness of one selected node, read from the record and the graph, never authored.
  // A dispatch child resolves its own harness in `definition` (squad/envelope.py) and inherits the allow ceiling from its
  // dispatch envelope. A plain agent declares its own fields. A gate or a loop carries no harness, so the
  // caller says so plainly instead of showing an empty list. A missing field stays null, never zero.
  const skillLabel = (s) => (typeof s === "string" ? s : s && typeof s.name === "string" ? (s.version ? `${s.name}@${s.version}` : s.name) : null);

  // A column of child cards past this many rows wraps into a new column, so a wide fan-out (#94: 18 children on a real
  // 24-issue run) spreads across the page instead of running one column far past the viewport.
  const CHILD_COLUMN_HEIGHT = 7;

  // Where each child card sits: right of its dispatch's agent entry, one row each, wrapping into a new column every
  // CHILD_COLUMN_HEIGHT rows, on the nearest free cell. Never saved in a layout file. `doc` is optional, for a caller
  // with no graph to hand (a test fixture); without it a child anchors on the dispatch node itself, one column further
  // out, matching where it sat before #92.
  function childLayout(children, layout, box, gap, doc) {
    const taken = { ...layout }, pos = {}, row = {};
    for (const c of children) {
      const p = doc ? childAnchor(doc, c.dispatch, layout) : layout[c.dispatch];
      if (!p) continue;
      const i = row[c.dispatch] || 0;
      row[c.dispatch] = i + 1;
      const col = Math.floor(i / CHILD_COLUMN_HEIGHT), r = i % CHILD_COLUMN_HEIGHT;
      const stepX = (doc ? box.w + gap : 2 * (box.w + gap)) + col * (box.w + gap);
      pos[c.name] = taken[c.name] = freeSpot(taken, box, { x: p.x + stepX, y: p.y + r * (box.h + gap) }, gap);
    }
    return pos;
  }

  // A gate that a dispatch runs as a `checks` gate has no outcome of its own: its state is what the children's checks said.
  function dispatchChecks(events, doc) {
    const nodes = doc && Array.isArray(doc.nodes) ? doc.nodes : [];
    const kids = runChildren(events).filter((c) => c.checks);
    const out = {};
    for (const d of nodes.filter((n) => n && n.kind === "dispatch" && Array.isArray(n.checks))) {
      for (const g of d.checks) {
        const seen = kids.filter((c) => c.dispatch === d.name && c.checks[g] !== undefined);
        if (seen.length) out[g] = { dispatch: d.name, pass: seen.filter((c) => c.checks[g] === "pass").length, fail: seen.filter((c) => c.checks[g] !== "pass").length, of: seen.length };
      }
    }
    return out;
  }

  // The free place nearest to `want`: `want` itself, else the closest cell of a grid of the node's size (a ring around it, growing).
  function freeSpot(layout, box, want, gap) {
    const taken = Object.values(layout), sw = box.w + gap, sh = box.h + gap;
    const free = (x, y) => !taken.some((p) => Math.abs(p.x - x) < sw && Math.abs(p.y - y) < sh);
    for (let r = 0; r < 60; r++) {
      const ring = [];
      for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) if (Math.max(Math.abs(i), Math.abs(j)) === r) ring.push([i, j]);
      ring.sort((p, q) => p[0] * p[0] + p[1] * p[1] - q[0] * q[0] - q[1] * q[1] || p[1] - q[1]);
      for (const [i, j] of ring) if (free(want.x + i * sw, want.y + j * sh)) return { x: want.x + i * sw, y: want.y + j * sh };
    }
    return { ...want };
  }

  // Where a dispatch's own edges and children anchor: the position of its agent entry, one layer right of the
  // dispatch itself, so a child two layers out draws from an adjacent column instead of past the entry and its checks.
  function childAnchor(doc, dispatchName, layout) {
    const nodes = doc && Array.isArray(doc.nodes) ? Object.fromEntries(doc.nodes.map((n) => [n.name, n])) : {};
    const dn = nodes[dispatchName];
    return (dn && dn.entry && layout[dn.entry]) || layout[dispatchName] || null;
  }

  return { issueNumber, issueNumbers, shortChildName, runChildren, skillLabel, CHILD_COLUMN_HEIGHT, childLayout, dispatchChecks, freeSpot, childAnchor };
}

// Dashboard core module: The one state a card shows, and the class it paints.. Moved from rest.js with no change.
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function stateModule({ num }) {
  // ---- The one state a node's card shows ----
  // Every node the run has touched reads one definite state, so a root or a structural node is never an ambiguous
  // flat grey. A node that never ran (after the verdict) reads "not-run", not a plain card. The states reuse the
  // legend's: passed, failed, deadline, needs-human, running, started, and not-run.
  const OUTCOME_STATE = { pass: "passed", fail: "failed", deadline: "deadline", "needs-human": "needs-human" };

  // One table for every state a card reads: its class, glyph, label and legend row. The card class table, the mark table and the legend
  // are all derived from it, so a state added here shows in all three. `queued` has no class: a child not started stays unmarked.
  // The order is the legend's: what the reader does, not what the engine does. Nothing (passed, not run), look (failed, deadline,
  // started with no outcome), wait (running), act (needs a decision). A legend row names the record's state and the reader's move, in one line.
  // `started` is a call_start with no outcome and no live call: the run ended inside the call, or the replay cursor sits inside it.
  const STATES = [
    { state: "passed", cls: "o-pass", glyph: "✓", label: "passed", legend: "Passed" },
    { state: "not-run", cls: "o-not-run", glyph: "∅", label: "not run", legend: "Not run: the run ended first" },
    { state: "failed", cls: "o-fail", glyph: "✗", label: "failed", legend: "Failed: read the cause" },
    { state: "deadline", cls: "o-deadline", glyph: "◷", label: "deadline", legend: "Deadline hit: counts as failed" },
    { state: "started", cls: "o-started", glyph: "…", label: "started", legend: "Started, no outcome recorded" },
    { state: "running", cls: "running", glyph: "▶", label: "running", legend: "Running now: wait" },
    { state: "needs-human", cls: "o-needs-human", glyph: "!", label: "needs-human", legend: "Needs your decision" },
    { state: "queued", cls: null, glyph: "–", label: "not started", legend: null },
  ];
  const STATE_CLASS = Object.fromEntries(STATES.filter((x) => x.cls).map((x) => [x.state, x.cls]));
  // A call in flight reads running; a call started with no outcome yet reads started. Both are "in flight" for grouping and the group card.
  const inFlight = (state) => state === "running" || state === "started";
  // A state with an outcome: the call is over.
  const DONE = new Set(Object.values(OUTCOME_STATE));
  const isDone = (state) => DONE.has(state);
  // A node or a child whose call is running now (its stats carry the time it has run).
  const isRunning = (x) => !!x && num(x.running_for);

  // The primary state of a node's card. `running` wins over an earlier outcome, since a node running now is running now.
  // A missing stats entry (ns null) is not a state: the node is not in the record and its card stays unmarked.
  function nodeState(ns) {
    if (!ns) return null;
    if (isRunning(ns)) return "running";
    if (ns.not_run) return "not-run";
    if (ns.outcome) return OUTCOME_STATE[ns.outcome] || ns.outcome;
    if (ns.started) return "started";
    return "not-run";
  }

  // The card class for a node's state, or null when the node is not in the record.
  const stateClass = (ns) => { const s = nodeState(ns); return s ? STATE_CLASS[s] || "o-" + s : null; };

  // The class a child card paints. A child reads the same states a node reads, except the never-ran
  // marker: a child whose call has not started is queued, not done, so its card stays unmarked. Without this a child
  // in flight kept the static `started` outline for the whole call and showed a result only at the end.
  function childStateClass(c) {
    if (!c) return null;
    if (isRunning(c)) return "running";
    return c.outcome ? STATE_CLASS[OUTCOME_STATE[c.outcome] || c.outcome] || null : null;
  }

  return { OUTCOME_STATE, STATES, STATE_CLASS, inFlight, isDone, isRunning, nodeState, stateClass, childStateClass };
}

// Dashboard core module: The totals bar and the top bar of issue progress.. Moved from rest.js with no change.
// modelreg: seam-clean
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function totalsModule({ lastOf, num, sumOf, tokenFigures, models }) {
  const REG = models || {};
  // ---- The totals bar (owner request after #86) ----
  // The cap comes from the run's own options, else from the loaded graph. No cap is null.
  function runCap(start, doc) {
    return num((start.engine_options || {}).spend_cap) ? start.engine_options.spend_cap : doc && doc.run && num(doc.run.spend_cap) ? doc.run.spend_cap : null;
  }

  // The run totals over `events`: a whole record, or the cut a replay cursor makes, so a cursor at pos P shows what the run had spent by P.
  // Tokens are null when no call recorded them (never zero). `partial_tokens` is true when an agent call has a spend but no tokens: the sum is a floor.
  // `tps` is tokenFigures' estimate: output tokens over the summed elapsed time of the calls that have both. Parallel calls add their times,
  // so the rate is per call-second, not per wall second. `wall` counts on from run_start while the run is live (now given, no verdict).
  function runTotals(events, cap, now) {
    const start = events[0], end = events[events.length - 1], v = lastOf(events.filter((e) => e.event === "verdict"));
    const outs = events.filter((e) => e.event === "outcome"), spend = sumOf(outs.map((o) => o.spend)), tok = tokenFigures(outs);
    const partial = tok.tokens_out !== null && outs.some((o) => num(o.spend) && (!num(o.tokens_in) || !num(o.tokens_out)));
    return { spend, turns: sumOf(outs.map((o) => o.turns)), ...tok, partial_tokens: partial, cap, cap_pct: spend !== null && cap ? spend / cap : null,
      wall: num(start.ts) ? (num(now) && !v ? now - start.ts : num(end.ts) ? end.ts - start.ts : null) : null };
  }

  // The bar's cells as data: a label, the text, and a tooltip that names the rule. Unknown tokens read "unknown", never 0.
  function totalsCells(t) {
    const f = fmt, unk = "unknown", floor = t.partial_tokens ? "≥ " : "";
    return [
      { id: "cost", label: "Cost", text: t.spend === null ? unk : `${f.usd(t.spend)}${t.cap === null ? "" : ` of $${t.cap} (${f.pct(t.cap_pct)})`}`,
        title: "Sum of the spend on every outcome so far. The cap is the run's spend cap." },
      { id: "time", label: "Time", text: t.wall === null ? unk : f.seconds(t.wall),
        title: "Run time. While the run is live it counts on from run_start; otherwise it is the span from run_start to the last event shown." },
      { id: "in", label: "Tokens in", text: t.tokens_in === null ? unk : floor + f.tokens(t.tokens_in),
        title: t.partial_tokens ? "Sum over the calls that recorded tokens. Some agent call has no tokens, so this is a floor." : "Sum of tokens in over every call that recorded them." },
      { id: "out", label: "Tokens out", text: t.tokens_out === null ? unk : floor + f.tokens(t.tokens_out),
        title: t.partial_tokens ? "Sum over the calls that recorded tokens. Some agent call has no tokens, so this is a floor." : "Sum of tokens out over every call that recorded them." },
      { id: "tps", label: "tk/s (estimate)", text: t.tps === null ? unk : "~" + f.rate(t.tps),
        title: "Estimate: tokens out divided by the summed elapsed time of the calls that have both. Calls that overlap in time add their times, so this is a rate per call-second, not per wall-clock second." },
    ];
  }

  // ---- The top bar: the issues the run landed, of the issue set ----
  // The record carries no issue-set size, so `total` comes from the run folder the page was given (the page counts
  // `target/issues/*.md` and passes the number in). `done` is the distinct issues a `land` event landed, read from
  // the record's own ledger: no new event type. Both figures stay null-ish when the record shows nothing.
  function issueProgress(events, total, held) {
    const lands = new Set(events.filter((e) => e.event === "land" && e.outcome === "pass").map((e) => e.node));
    // A one-issue run lands through the merge_land action, which logs no `land` event. Its issue is delivered when
    // the merge passed and the run completed, so the gate after the merge held; the set is that one issue, not the folder's.
    const merged = events.some((e) => e.event === "outcome" && e.outcome === "pass" && e.effect && e.effect.name === "merge_land");
    if (lands.size === 0 && (merged || (num(held) && held > 0))) {
      const done = merged && events.some((e) => e.event === "verdict" && e.verdict === "completed") ? 1 : 0;
      // A chained run starts from a tree that already holds `held` issues: the strip counts them, of the folder's set.
      if (num(held) && held > 0 && num(total)) return { done: held + done, total, text: `${held + done} of ${total} issues` };
      return { done, total: 1, text: `${done} of 1 issue` };
    }
    const done = lands.size;
    const t = num(total) ? total : null;
    return { done, total: t, text: t === null ? `${done} landed` : `${done} of ${t} issue${t === 1 ? "" : "s"}` };
  }

  // The top bar's cells, the same shape as totalsCells: a label, the text, and a tooltip that names the rule.
  // With no issue set (a single-run folder, or no run folder at all) the bar is empty and the page hides it.
  function progressCells(p) {
    if (p.total === null) return [];
    return [{ id: "issues", label: "Issues", text: p.text,
      title: "Issues the run landed, of the issue set in the run folder. A land event marks one landed issue, and a one-issue run counts its passing merge once the run completes; the run folder's target/issues holds the set of a multi-issue run. The record itself carries no issue count." }];
  }

  // One place for the unit and the dash. A missing value is a dash, never a zero.
  const DASH = "\u2014";

  const fmt = {
    seconds: (v) => !num(v) ? DASH : v === 0 ? "0s" : v < 1 ? v.toFixed(2) + "s" : v < 60 ? v.toFixed(1) + "s" : `${Math.floor(v / 60)}m ${String(Math.round(v % 60)).padStart(2, "0")}s`,
    usd: (v) => !num(v) ? DASH : "$" + v.toFixed(v < 10 ? 3 : 2),
    pct: (v) => !num(v) ? DASH : v === 0 ? "0%" : v * 100 < 1 ? "<1%" : Math.round(v * 100) + "%",
    count: (v) => !num(v) ? DASH : String(v),
    tokens: (v) => !num(v) ? DASH : v < 1000 ? String(v) : v < 9950 ? (v / 1e3).toFixed(1) + "k" : v < 1e6 ? Math.round(v / 1e3) + "k" : (v / 1e6).toFixed(1) + "M",
    rate: (v) => !num(v) ? DASH : (v === 0 ? "0" : v < 10 ? v.toFixed(1) : String(Math.round(v))) + " tk/s",
    // A model reads as its registry label. An alias resolves to its canonical id first, so an old record still shows the
    // right name. A harness phrase (`model effort skill`) starts with the id and keeps the rest. An id the registry does
    // not know renders raw: display never guesses. The record, the graph and an editable field keep the id whole.
    // An empty value is a dash, like every other missing figure here.
    model: (m) => {
      if (m === null || m === undefined || m === "") return DASH;
      const text = String(m), head = text.split(/\s+/)[0];
      const id = (REG.aliases || {})[head] || head, label = (REG.labels || {})[id];
      return label ? label + text.slice(head.length) : text;
    },
    // A box that stands for a model (#677): the registry label, as `model` reads it, and an id the registry does not
    // know marked "unregistered" in plain words. Every spelling a route serves is in the alias map, so no parse here.
    llm: (m) => {
      if (m === null || m === undefined || m === "") return DASH;
      const text = String(m), head = text.split(/\s+/)[0], label = labelOf(head);
      return (label || head + " \u00b7 unregistered") + text.slice(head.length);
    },
  };

  function labelOf(head) {
    const id = (REG.aliases || {})[head] || (REG.spellings || {})[head] || head;
    return (REG.labels || {})[id] || null;
  }

  // What a node card says about its LLM (#677, ADR-0137): the card renders this and decides nothing. An agent shows
  // the model the record says it used, else the graph's model marked "configured". A node that calls no model says
  // "no LLM" and what it runs instead; a loop or an each is control only. A review-command gate runs a command that
  // picks its own LLM, so it claims none. The card prefixes the kind, so the text stays short enough for the card.
  // `node` is the graph node, `ns` its run statistics (runStats), or null before the record touches it.
  function nodeModel(node, ns) {
    const n = node || {}, kind = n.kind;
    if (kind === "agent") {
      const used = ns && ns.harness && ns.harness.used ? ns.harness.used.model : null;
      const m = used || n.model || null;
      if (!m) return { llm: true, source: null, registered: null, text: "model not set" };
      return { llm: true, source: used ? "used" : "configured", registered: !!labelOf(m), text: fmt.llm(m) + (used ? "" : " (configured)") };
    }
    const none = (text) => ({ llm: false, source: null, registered: null, text: "no LLM \u00b7 " + text });
    if (kind === "gate") {
      const argv = n.params && Array.isArray(n.params.argv) ? n.params.argv : null;
      if (n.check === "review-command") {
        // `sh -c 'body' name ...` names its program in the slot after the body, as $0.
        const shell = argv && /^(?:.*\/)?(?:ba|z)?sh$/.test(String(argv[0])) && argv[1] === "-c";
        const prog = shell ? (argv[3] || "a shell command") : argv && argv.length ? argv[0] : "a command";
        return { llm: null, source: null, registered: null, text: `${String(prog).split("/").pop()} \u00b7 own LLM` };
      }
      return none(n.check || "a check");
    }
    if (kind === "action") return none(n.effect || "an action");
    if (kind === "wait") return none(`waits for ${n.owner || "a person"}`);
    if (kind === "dispatch") return none("children");
    if (kind === "loop" || kind === "each") return { llm: false, source: null, registered: null, text: "no LLM" };
    return none(kind || "unknown kind");
  }

  return { runCap, runTotals, totalsCells, issueProgress, progressCells, DASH, fmt, nodeModel };
}

// Dashboard core module: The replay cursor.. Moved from rest.js with no change.
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function replayModule({ num, orNull }) {
  // ---- The replay cursor ----
  // The cursor is one record `pos`. It folds nothing into the record and keeps no index: events are in file order, so `pos` is sorted and a
  // binary search finds the cut. A null cursor means "pinned to the end": a live run keeps the cursor there until the owner moves it.
  function countUpTo(events, pos) {
    let lo = 0, hi = events.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (events[mid].pos <= pos) lo = mid + 1; else hi = mid; }
    return lo;
  }

  // An accepted child with no outcome event at the cursor. Not the engine's frontier (GLOSSARY.md, Unresolved child).
  function unresolvedChildren(events, cursor) {
    const seen = events.slice(0, countUpTo(events, cursor));
    const done = new Set(seen.filter((e) => e.event === "outcome").map((e) => e.node));
    return seen.filter((e) => e.event === "spawn_accepted" && !done.has(e.child))
      .map((e) => ({ child: e.child, parent: orNull(e.parent), parent_entry: orNull(e.parent_entry), depth: orNull(e.depth), pos: e.pos }));
  }

  // The record up to the cursor. A cursor that is null, past the end, or before the start lands on the end or the first event;
  // a cursor between two positions lands on the one before. The verdict shows only at or after its own pos, since it is one event.
  function replayAt(events, cursor) {
    const first = events[0].pos, last = events[events.length - 1].pos;
    const want = num(cursor) ? Math.min(Math.max(cursor, first), last) : last;
    const n = countUpTo(events, want), at = events[n - 1].pos;
    return { cursor: at, first, last, at_end: at === last, events: events.slice(0, n), unresolved: unresolvedChildren(events, at) };
  }

  // The next cursor for one move. A move that reaches the end gives null (pinned), so a live run goes on following the record.
  function moveCursor(events, cursor, move, to) {
    const first = events[0].pos, last = events[events.length - 1].pos;
    const here = replayAt(events, cursor).cursor;
    const n = countUpTo(events, here);
    const target = move === "start" ? first : move === "end" ? last : move === "back" ? events[Math.max(n - 2, 0)].pos
      : move === "forward" ? events[Math.min(n, events.length - 1)].pos : replayAt(events, to).cursor;
    return target >= last ? null : target;
  }

  return { countUpTo, unresolvedChildren, replayAt, moveCursor };
}

// Dashboard core module: how the children of one dispatch are drawn: the group card, the roster, the bus edge.
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function groupsModule({ OUTCOME_STATE, STATES, inFlight, isDone, isRunning, childAnchor, childLayout, fmt, freeSpot, num, sumOf }) {
  // Every state has its own glyph (the STATES table): the fill of a square or a card is never the only cue that tells two outcomes apart.
  const MARKS = Object.fromEntries(STATES.map((x) => [x.state, { glyph: x.glyph, label: x.label }]));
  // The glyph and label of a state a card reads, or null for a state with none.
  const stateMark = (state) => (MARKS[state] ? { state, glyph: MARKS[state].glyph, label: MARKS[state].label } : null);

  // The one state of a child: a call in flight reads running, else its outcome, else started, else queued.
  function childMark(c) {
    const state = isRunning(c) ? "running" : c.outcome ? OUTCOME_STATE[c.outcome] || c.outcome : "queued";
    const m = MARKS[state] || { glyph: "?", label: String(state) };
    return { state, glyph: m.glyph, label: m.label };
  }

  // A group needs this many children; fewer stay single cards.
  const MIN_GROUP = 3;

  // The harness of a child: model, effort and skill. Children that run the same harness read as one group while they run.
  const harnessOf = (c) => [c.model, c.effort, c.skillLabel].filter((x) => x !== null && x !== undefined && x !== "").join(" ");

  // The key of the group a child belongs to, or null when it has none: done children group by dispatch and outcome, children in
  // flight (a call running, or started with no outcome yet) by dispatch and harness. A queued child and a rejected request stay cards.
  // The key is a JSON array, so a dispatch name or a harness with a ':' in it cannot make two groups read as one.
  const groupKey = (dispatch, state, harness) => JSON.stringify(["group", dispatch, state, harness || ""]);
  const isGroupKey = (k) => typeof k === "string" && k.startsWith('["group",');
  function groupKeyOf(c) {
    if (c.rejected) return null;
    const s = childMark(c).state;
    if (isDone(s)) return groupKey(c.dispatch, s, "");
    if (inFlight(s)) return groupKey(c.dispatch, "running", harnessOf(c));
    return null;
  }

  // Split the children into group cards and single cards. `expanded` lists the keys the owner opened: those children come back as
  // cards, and `groupOf` says which group each of them came from, so a double-press on one collapses the group again.
  function splitChildren(children, expanded) {
    const open = new Set(expanded || []);
    const by = new Map();
    for (const c of children) { const k = groupKeyOf(c); if (k) by.set(k, (by.get(k) || []).concat([c])); }
    const groups = [], grouped = new Set(), groupOf = {};
    for (const [key, kids] of by) {
      if (kids.length < MIN_GROUP) continue;
      if (open.has(key)) { for (const c of kids) groupOf[c.name] = key; continue; }
      const first = kids[0], st = childMark(first).state, running = inFlight(st);
      const label = running ? "running" : MARKS[st].label;
      const time = sumOf(kids.map((c) => (num(c.elapsed) ? c.elapsed : c.running_for)));
      const cost = sumOf(kids.map((c) => c.spend)), tin = sumOf(kids.map((c) => c.tokens_in)), tout = sumOf(kids.map((c) => c.tokens_out));
      // The summary strings come from core.fmt, the one formatter, so the card, its tooltip and the panel read the same text; tests pin them.
      const lineTime = `${fmt.seconds(time)} of calls · ${fmt.usd(cost)}`, lineTokens = `${fmt.tokens(tin)} in · ${fmt.tokens(tout)} out`;
      for (const c of kids) grouped.add(c.name);
      // A failed group says how many of its children a later attempt replaced, so a collapsed card never reads as an open failure.
      const redone = kids.filter((c) => c.superseded_by !== null && c.superseded_by !== undefined).length;
      groups.push({ key, dispatch: first.dispatch, state: running ? "running" : st, label, harness: running ? harnessOf(first) : "", redone, name: `${first.dispatch} · ${kids.length} ${label}${redone ? ` · ${redone} redone` : ""}`, kids, time, cost, tokens_in: tin, tokens_out: tout, lineTime, lineTokens, line: `${lineTime} · ${lineTokens}` });
    }
    return { groups, singles: children.filter((c) => !grouped.has(c.name)), groupOf };
  }

  // The next `expanded` list after a double-press on a group card (adds the key) or on a card of an expanded group (removes it).
  const toggleKey = (expanded, key) => (expanded.includes(key) ? expanded.filter((k) => k !== key) : expanded.concat([key]));

  // Two presses on one name less than DOUBLE_PRESS_MS apart. `last` is {name, t} of the press before, or null.
  const DOUBLE_PRESS_MS = 400;
  const isDoublePress = (last, name, t, within) => !!last && last.name === name && t - last.t < (within || DOUBLE_PRESS_MS);

  // The side panel's table for the children of one dispatch: one row each, in order.
  function childRoster(children, dispatch) {
    return children.filter((c) => c.dispatch === dispatch).map((c) => {
      const m = childMark(c);
      return { index: c.index, name: c.name, label: c.label, state: m.state, glyph: m.glyph, outcome: m.label, model: c.model === null || c.model === undefined ? fmt.count(null) : c.model,
        time: fmt.seconds(c.elapsed), cost: fmt.usd(c.spend), turns: fmt.count(c.turns), rework: c.rework || null };
    });
  }

  // Squares of a group card: eight to a row, so the card is as wide as a child card. The card is as tall as its rows need.
  const SQUARE_STEP = 23, SQUARES_PER_ROW = 8, GROUP_HEAD = 62;
  const groupBox = (n, w) => ({ w, h: GROUP_HEAD + Math.ceil(n / SQUARES_PER_ROW) * SQUARE_STEP + 4 });

  // Where each group card sits: right of its dispatch's entry, like the first child column, or right of the single cards of that
  // dispatch (`after[dispatch]` is the x past them). Two groups of one dispatch stack. `taken` holds the cards already placed; the
  // rows the group covers below its first cell are marked taken too, so a later card does not land on it. `pts` are the far corners,
  // in the shape fit() reads (a point plus the standard box reaches the card's far corner).
  function groupLayout(groups, layout, taken, box, gap, doc, after) {
    const used = { ...taken }, pos = {}, pts = {}, squares = {}, below = {};
    for (const g of groups) {
      const a = doc ? childAnchor(doc, g.dispatch, layout) : layout[g.dispatch];
      if (!a) continue;
      const gb = groupBox(g.kids.length, box.w);
      const x = after && num(after[g.dispatch]) ? after[g.dispatch] : a.x + (doc ? box.w + gap : 2 * (box.w + gap));
      const want = { x, y: Math.max(a.y, below[g.dispatch] === undefined ? a.y : below[g.dispatch]) };
      const p = freeSpot(used, box, want, gap);
      used[g.key] = p;
      let rows = 1;
      for (; rows * (box.h + gap) < gb.h; rows++) used[g.key + "#" + rows] = { x: p.x, y: p.y + rows * (box.h + gap) };
      below[g.dispatch] = p.y + rows * (box.h + gap);   // the next free cell under this card
      pos[g.key] = { ...p, ...gb };
      pts[g.key] = { x: p.x + gb.w - box.w, y: p.y + gb.h - box.h };
      squares[g.key] = g.kids.map((c, i) => ({ name: c.name, x: 10 + (i % SQUARES_PER_ROW) * SQUARE_STEP, y: GROUP_HEAD + Math.floor(i / SQUARES_PER_ROW) * SQUARE_STEP }));
    }
    return { pos, pts, squares };
  }

  // The whole drawing plan of the children: which are groups, which are cards, and where each sits. Single cards take their columns
  // first; a group card sits right of them. A page with no graph places nothing.
  function childPlan(children, expanded, layout, box, gap, doc) {
    const sp = splitChildren(children, expanded), laid = !!(doc && Array.isArray(doc.nodes));
    if (!laid) return { ...sp, childPos: {}, groupPos: {}, groupPts: {}, groupSq: {} };
    const childPos = childLayout(sp.singles, layout, box, gap, doc), after = {};
    for (const c of sp.singles) { const q = childPos[c.name]; if (q) after[c.dispatch] = Math.max(num(after[c.dispatch]) ? after[c.dispatch] : -Infinity, q.x + box.w + gap); }
    const gl = groupLayout(sp.groups, layout, { ...layout, ...childPos }, box, gap, doc, after);
    return { ...sp, childPos, groupPos: gl.pos, groupPts: gl.pts, groupSq: gl.squares };
  }

  // One bus per child column instead of a fan from the entry: a rail BUS_GUTTER px left of the column, a stub into each card, and the rails
  // chained along the gutter under the first row, so no line crosses a card. Segments are {x1, y1, x2, y2, arrow}.
  const BUS_GUTTER = 15;
  function childBus(a, pos, box) {
    const segs = [], seg = (x1, y1, x2, y2, arrow) => segs.push({ x1, y1, x2, y2, arrow: !!arrow });
    if (!a || !pos.length) return segs;
    const cols = {};
    for (const p of pos) (cols[p.x] = cols[p.x] || []).push(p);
    const xs = Object.keys(cols).map(Number).sort((p, q) => p - q);
    const gy = Math.min(...pos.map((p) => p.y)) + box.h + BUS_GUTTER, ay = a.y + box.h / 2;
    xs.forEach((x, i) => {
      const ps = cols[x], rail = x - BUS_GUTTER, ys = ps.map((p) => p.y + box.h / 2), via = i === 0 ? ay : gy;
      // the first rail also drops to the gutter line when a later column hangs off it
      seg(rail, Math.min(...ys, via), rail, Math.max(...ys, via, i === 0 && xs.length > 1 ? gy : -Infinity));
      for (const p of ps) seg(rail, p.y + box.h / 2, p.x - 3, p.y + box.h / 2, true);
      if (i === 0) seg(a.x + box.w, ay, rail, ay); else seg(xs[i - 1] - BUS_GUTTER, gy, rail, gy);
    });
    return segs;
  }

  // ---- the panel's single-card mode (ticket #1782) ----
  // One card of the panel, named by the page's `card` parameter, for the second view the hub's pip opens over its
  // maximized board. The panel has one card it can name cleanly, so the parameter takes that one alone: `groups`, the
  // run's children grouped by dispatch and state, unfinished first — the one thing worth glancing at while the board
  // is read. The card is derived from the same record and the same state table the panel's own rows read, never authored.
  const CARD_NAMES = ["groups"], CARD_TITLES = { groups: "Groups" };
  // A child in flight or still waiting comes before a finished one, then the outcomes. A rejected request groups as
  // `rejected`: the record refused it, so it never ran and its outcome alone would read as one more failed child.
  const CARD_ORDER = ["running", "started", "queued", "failed", "rejected", "deadline", "needs-human", "passed"];
  const cardRank = (s) => (CARD_ORDER.indexOf(s) < 0 ? CARD_ORDER.length : CARD_ORDER.indexOf(s));
  const cardStateOf = (c) => (c.rejected ? "rejected" : childMark(c).state);
  const cardWord = (s) => (MARKS[s] ? MARKS[s].label : s);

  // The children grouped by dispatch and state, unfinished first. Ordered by state, then by dispatch, so the card is
  // stable while a run works: a child that finishes moves its own group, and the others keep their place.
  function cardGroups(children) {
    const by = new Map();
    for (const c of children || []) {
      const key = `${c.dispatch}\u0000${cardStateOf(c)}`;
      if (!by.has(key)) by.set(key, { dispatch: c.dispatch, state: cardStateOf(c), kids: [] });
      by.get(key).kids.push(c);
    }
    return [...by.values()]
      .map((g) => ({ ...g, label: cardWord(g.state), count: g.kids.length, name: `${g.dispatch} · ${g.kids.length} ${cardWord(g.state)}` }))
      .sort((a, b) => cardRank(a.state) - cardRank(b.state) || String(a.dispatch).localeCompare(String(b.dispatch)));
  }

  // What the page paints for a `card` request: the card, or the message that names the cards the panel does have. A
  // card the panel does not have is a message, never an empty frame.
  function cardBody(name, children) {
    if (!CARD_NAMES.includes(name)) return { ok: false, message: `This dashboard has no card named "${name}". It has: ${CARD_NAMES.join(", ")}.` };
    const groups = cardGroups(children);
    return { ok: true, name, title: CARD_TITLES[name] || name, groups, empty: groups.length ? "" : "This run has no children yet." };
  }

  return { stateMark, childMark, splitChildren, groupKey, isGroupKey, toggleKey, DOUBLE_PRESS_MS, isDoublePress, childRoster, groupLayout, childPlan, childBus, CARD_NAMES, cardGroups, cardBody };
}

// Dashboard core module: Per-node statistics, the harness a node used, and the run statistics.. Moved from rest.js with no change.
// A factory: it takes what lower modules export and returns its own functions. No DOM here.

function statsModule({ causeSummary, dispatchChecks, failureCauses, lastOf, liveState, num, openCalls, orNull, runCap, runChildren, runTimeline, runTotals, skillLabel, sumOf, tokenFigures }) {
  function nodeStats(name, outs, starts, doc) {
    const last = lastOf(outs);
    const ratios = outs.filter((o) => num(o.spend) && num(o.cap) && o.cap > 0).map((o) => o.spend / o.cap);
    const gn = doc && Array.isArray(doc.nodes) ? doc.nodes.find((n) => n && n.name === name) : undefined;
    const usedOf = (k) => { const o = [...outs].reverse().find((x) => x[k] !== undefined && x[k] !== null); return o ? o[k] : null; };
    return {
      entries: outs.length, started: starts > outs.length,
      outcome: last ? last.outcome : null, routed: last ? orNull(last.routed) : null, reasons: last ? last.reasons || [] : [],
      cause: last && last.outcome !== "pass" ? causeSummary(last.reasons) : null, evidence: last && last.evidence ? last.evidence : null,
      elapsed: sumOf(outs.map((o) => o.elapsed)), spend: sumOf(outs.map((o) => o.spend)), turns: sumOf(outs.map((o) => o.turns)),
      cap_pct: ratios.length ? Math.max(...ratios) : null, ...tokenFigures(outs),
      harness: gn && gn.kind === "agent" ? { configured: { model: orNull(gn.model), effort: orNull(gn.effort), tools: orNull(gn.tools) }, used: { model: usedOf("model"), effort: usedOf("effort") } } : null,
    };
  }

  // The engine-level harness the run recorded in run_start: what no node sets.
  function engineHarness(start) {
    const d = (start.defaults && start.defaults.engine) || {}, o = d.options || {}, l = d.limits || {};
    return { permission_mode: orNull(o.permission_mode), setting_sources: orNull(o.setting_sources), disallowed_tools: orNull(o.disallowed_tools),
      max_output_tokens: orNull(l.max_output_tokens), context_tokens: orNull(l.context_tokens), auth: d.auth ? orNull(d.auth.source) : null,
