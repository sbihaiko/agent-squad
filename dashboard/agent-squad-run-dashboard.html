    if (rows.length > STEP.lines) { rows.length = STEP.lines; rows[STEP.lines - 1] = rows[STEP.lines - 1].slice(0, STEP.chars - 1) + "…"; }
    return rows;
  }

  // One column per batch, left to right; its steps run top to bottom with an arrow between neighbors. The box keeps the clipped text; <title> keeps all of it.
  function scriptSvg(script) {
    const m = scriptDiagram(script);
    if (m.error) return m;
    let out = "", x = STEP.pad, height = 0;
    for (const b of m.batches) {
      let y = STEP.pad + STEP.head, prev = null;
      out += `<g class="batch" data-batch="${escXml(b.id)}"><text class="batch-name" x="${x}" y="${STEP.pad + 16}">${escXml(b.id)}</text>`;
      for (const sec of b.sections) {
        for (const n of sec.nodes) {
          if (prev !== null) out += `<path class="flow" d="M${x + STEP.w / 2} ${prev} V${y}" marker-end="url(#arrow)"/>`;
          const cls = (n.manual ? "step manual" : "step auto") + (n.sensitive ? " sensitive" : "");
          out += `<g class="${cls}" data-step="${escXml(n.id)}" data-section="${sec.label}"><title>${escXml(n.id)}: ${escXml(n.text)}</title>`
            + `<rect x="${x}" y="${y}" width="${STEP.w}" height="${STEP.h}" rx="6"/>`
            + `<text class="step-id" x="${x + 8}" y="${y + 14}">${escXml(sec.label === "steps" ? "" : sec.label + " · ")}${escXml(n.id)}${n.manual ? " · manual" : ""}</text>`
            + wrap(n.text).map((r, i) => `<text class="step-text" x="${x + 8}" y="${y + 30 + i * STEP.line}">${escXml(r)}</text>`).join("")
            + `<text class="step-tags" x="${x + 8}" y="${y + STEP.h - 8}">${escXml(n.tags.join(" "))}</text></g>`;
          prev = y + STEP.h; y += STEP.h + STEP.gap;
        }
      }
      out += "</g>";
      height = Math.max(height, y);
      x += STEP.w + STEP.colGap;
    }
    const w = x - STEP.colGap + STEP.pad;
    return `<svg class="script-diagram" viewBox="0 0 ${w} ${height}" width="${w}" height="${height}">`
      + `<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z"/></marker></defs>${out}</svg>`;
  }

  // A GUI test run as nodes, one per step in record order: the runner's gui_step, gui_capture and gui_verdict events up to the replay cursor
  // (null is the end). A step shows `executed` once its wait was met, its capture was taken and its verdict is in; a verdict with no
  // capture is `failed` (its wait timed out); a step with no verdict yet is `running`; a manual step nobody ran is `pending`.
  function guiRun(events, cursor) {
    const nodes = new Map(), sources = new Map();
    for (const e of events) {
      if (cursor != null && e.pos > cursor) break;
      if (!String(e.event).startsWith("gui_")) continue;
      if (!nodes.has(e.node)) nodes.set(e.node, { id: e.node, status: "running", verdict: null, capture: null, held: false, manual: false, pos: e.pos });
      const n = nodes.get(e.node);
      if (e.manual) n.manual = true;
      // A step's event names its action and its objective check, so the node shows what decided it.
      if (e.event === "gui_step") { if (e.action) n.action = e.action; if (e.check) n.check = e.check; }
      // A held capture (a step marked sensitive) shows no path until a gui_approve event names its sha256.
      if (e.event === "gui_capture") { n.held = e.held === true; n.capture = { path: n.held ? null : e.path, size: e.size, sha256: e.sha256 }; sources.set(e.node, e.path); }
      if (e.event === "gui_approve" && n.capture && n.capture.sha256 === e.sha256) { n.held = false; n.capture.path = sources.get(e.node); }
      if (e.event === "gui_verdict") { n.verdict = e.verdict; n.status = e.verdict === "pending" ? "pending" : n.capture ? "executed" : "failed"; }
      // A vision verdict shows what the model saw and what the call cost; a run stopped by its spend cap marks the skipped steps.
      if (e.event === "gui_vision") { n.vision = { answer: e.answer, saw: e.saw, cost: e.cost }; n.cost = e.cost; }
      // A goal's decisions are sub-nodes of its step; their cost adds to the step's.
      if (e.event === "gui_decision") { (n.decisions = n.decisions || []).push({ options: e.options, choice: e.choice, probabilities: e.probabilities, state: e.state, cost: e.cost }); n.cost = (n.cost || 0) + e.cost; }
      if (e.event === "gui_stop") n.stop = e.reason;
      if (e.event === "gui_verdict" && String(e.verdict).startsWith("skipped")) n.status = "skipped";
    }
    return [...nodes.values()];
  }

  return { scriptDiagram, scriptSvg, guiRun };
}

// Dashboard core: the same JSON Schema and the same rules as squad/graph.py,
// the canonical graph hash (squad.graph.canon_hash), and the adaptation overlay (squad/report.py).
// No DOM here. A test runs the bundle under node and compares it with the engine (tests/test_dashboard.py).
// ENGINE comes from scripts/build_dashboard.py: the schema and the registries, read from the engine's own modules.
function make(ENGINE) {
  const { isObj, same, clone, pyFloat, canonText, canonFromText, graphHash, cmpCodePoints, parseImport, openedWorkflow } = canonModule(ENGINE);
  const { SCHEMA, KINDS, resolve, validate } = schemaModule({ ENGINE, isObj, canonText, same, pyFloat });
  const { applyNodeEdit, fieldGroups, setField, addNode, removeNode, reviewGate, connect, disconnect, renameNode, layoutRename, changeKind, kindChoices, unseenValues, READ_ONLY_TOP } = editsModule({ SCHEMA, KINDS, isObj, same, clone, resolve });
  const { autoLayout, graphKids, layoutForSave, viewFit, viewFitFloor, viewZoomAt, viewPanBy, viewReveal, edgeRoutes } = layoutModule();
  const { REVIEW_NOTE, diffGraphs, declaredCaps, commandTemplate, reviewSheet, saveText, hashChip, hashRelation, draftRecord, draftOffer, saveGate, saveMode } = reviewModule({ canonText, graphHash, cmpCodePoints });
  const { snapshot, histNew, histRecord, histUndo, histRedo } = historyModule({ clone });
  const { num, sumOf, orNull, lastOf, tokenFigures, runTimeline } = figuresModule();
  const { parseRecord, parseLive, overlayRows, overlayFor } = recordModule({ graphHash });
  const { readDelay, liveState, openCalls } = liveModule({ lastOf, num, orNull });
  const { reasonParts, causeSummary, failureCauses, skillName, nodeLabel } = failuresModule({ orNull });
  const { issueNumber, runChildren, skillLabel, CHILD_COLUMN_HEIGHT, childLayout, dispatchChecks, freeSpot, childAnchor } = childrenModule({ num, openCalls, orNull, skillName });
  const { OUTCOME_STATE, STATES, inFlight, isDone, isRunning, nodeState, stateClass, childStateClass } = stateModule({ num });
  const { LEGEND, LEGEND_CHIPS, RUN_STATES, STATE_TEXT, HELP, httpSource, followPush, kindMark, KIND_LEGEND } = sourcesModule({ STATES });
  const { pauseView, controlBody } = controlModule({ lastOf });
  const { scriptDiagram, scriptSvg, guiRun } = scriptModule();
  const { runCap, runTotals, totalsCells, issueProgress, progressCells, fmt, nodeModel } = totalsModule({ lastOf, num, sumOf, tokenFigures, models: ENGINE.models });
  const { unresolvedChildren, replayAt, moveCursor } = replayModule({ num, orNull });

    g.innerHTML = `<title>${esc(c.title)} | ${esc(c.name)} | ${esc(tip)}</title><rect width="${BOX.w}" height="${BOX.h}" rx="6"/><g clip-path="url(#card-clip)"><text class="nm" x="${TEXT.x}" y="${TEXT.name}">${esc(clipText(c.title, CLIP.name))}</text><text class="kd" x="${TEXT.x}" y="${TEXT.kind}">${esc(kind)}</text>${stat ? `<text class="st" x="${TEXT.x}" y="${TEXT.line1}">${esc(stat)}</text>` : ""}${line2 ? `<text class="${line2.cls}" x="${TEXT.x}" y="${line2.y}">${esc(line2.text)}</text>` : ""}</g><text class="gl" x="${BOX.w - GLYPH.right}" y="${GLYPH.top}" text-anchor="end">${mark.glyph}</text><circle class="port in" cx="0" cy="${BOX.h / 2}" r="5"/>`;
    g.addEventListener("pointerdown", (ev) => {
      ev.stopPropagation();
      // A second press on a card of an expanded group folds the group back into its group card.
      const again = tapTwice(c.name, ev);
      if (again && S.groupOf[c.name]) { toggleGroup(S.groupOf[c.name], again); return; }
      pick(c.name);
    });
    cards.appendChild(g);
  }
}

// Nothing selected, no link selected, the panel closed, the map redrawn: what a press on the selected card or on empty map does.
function clearSelection() { S.selected = null; S.link = null; setSide(false, true); render(); }
// One press on a card, a square or a group card: it selects the name and shows it; a press on the one already selected clears the selection and closes the panel.
function pick(name) {
  S.link = null;
  if (S.selected === name) { clearSelection(); return; }
  S.selected = name; render(); // the drawer takes the right edge: render() reveals the selection left of it
}
// The cards in reading order (top to bottom, then left to right), for the panel's previous / next.
function cardOrder() {
  return [...$("cards").children].filter((c) => c.dataset.name).map((c) => ({ n: c.dataset.name, r: c.getBoundingClientRect() }))
    .sort((a, b) => Math.round(a.r.top) - Math.round(b.r.top) || a.r.left - b.r.left).map((c) => c.n);
}
// Previous / next card without closing the panel: the ‹ › buttons, or ← → while the panel is open.
function stepCard(k) {
  const o = cardOrder(), i = o.indexOf(S.selected) + k;
  if (i < 0 || i >= o.length) return;
  S.selected = o[i]; S.link = null; render();
}
document.addEventListener("click", (e) => { const b = e.target.closest && e.target.closest("[data-step]"); if (b && !b.disabled) { e.stopPropagation(); stepCard(+b.dataset.step); } });
window.addEventListener("keydown", (e) => {
  if ((e.key !== "ArrowLeft" && e.key !== "ArrowRight") || !sideOpen() || !S.selected || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  if (["TEXTAREA", "INPUT", "SELECT"].includes(e.target.tagName)) return;
  e.preventDefault(); e.stopImmediatePropagation(); stepCard(e.key === "ArrowLeft" ? -1 : 1);
}, true);

// A card is a keyboard stop: Tab reaches it, Enter selects it, Space opens or folds a group. The cards are rebuilt on every render, so the key
// handler puts the focus back on the card it acted on.
function focusable(g, label) { g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("aria-label", label); }
function focusCard(name) { const el = [...$("cards").children].find((c) => c.dataset.name === name); if (el) el.focus(); }
// A square of a group card is a stop too: Enter or Space selects that child, and the focus stays on its square.
function focusSquare(name) { const el = [...$("cards").querySelectorAll("g.sq")].find((q) => q.dataset.sq === name); if (el) el.focus(); }
$("cards").addEventListener("keydown", (e) => {
  const q = e.target.closest ? e.target.closest("g.sq") : null;
  if (q && e.target === q && !e.metaKey && !e.ctrlKey && !e.altKey && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(q.dataset.sq); focusSquare(q.dataset.sq); return; }
  const g = e.target.closest ? e.target.closest(".card[data-name]") : null;
  if (!g || e.target !== g || e.metaKey || e.ctrlKey || e.altKey) return;
  const name = g.dataset.name, key = g.dataset.group ? name : S.groupOf[name];
  if (e.key === "Enter") { e.preventDefault(); pick(name); focusCard(name); return; }
  if (e.key === " " && key) {
    e.preventDefault();
    const was = S.groups.some((x) => x.key === key), first = S.groups.find((x) => x.key === key);
    toggleGroup(key, { open: sideOpen() }).then(() => focusCard(was ? (first ? first.kids[0].name : name) : key));
  }
});

// Text cut to `n` characters with an ellipsis; the full text stays in the card's tooltip.
function clipText(t, n) { const x = String(t); return x.length > n ? x.slice(0, n - 1) + "…" : x; }

// Two presses on one card or group card within DOUBLE_PRESS_MS. The cards are rebuilt on every press, so a dblclick event would be lost (see startDrag).
// Returns the first press ({name, t, open}: whether the panel was open before it) on a second press, else null.
function tapTwice(name, ev) {
  const prev = S.lastTap, twice = core.isDoublePress(prev, name, ev.timeStamp);
  S.lastTap = twice ? null : { name, t: ev.timeStamp, open: sideOpen() };
  return twice ? prev : null;
}

// Expand a group card into its cards, or fold the cards back. The flag is page state, keyed by dispatch + outcome (+ harness). The
// first press of the double-press selected something and may have opened the panel: both are undone, so the view stays as it was.
function toggleGroup(key, first) {
  const opening = !S.expanded.includes(key);
  S.expanded = core.toggleKey(S.expanded, key);
  S.selected = null; S.link = null;
  if (first && !first.open) setSide(false, true);
  return recompute().then(() => { if ((S.fitted || (!opening && S.floored)) && S.doc) fit(opening ? key : null); if (opening && S.floored) setStatus(`Opened at ${Math.round(READABLE_K * 100)}% so the cards stay readable. Drag to pan, or press Fit to see them all.`); });
}

// The group card of a set of three or more children of one dispatch: "dispatch · N outcome", a summary line, and one square
// per child. A square's fill and its glyph both show the outcome; a click selects that child. A double-press on the card expands it.
function renderGroups(cards) {
  for (const gr of S.groups) {
    const p = S.groupPos[gr.key];
    if (!p) continue;
    const g = document.createElementNS(SVGNS, "g");
    g.setAttribute("class", "card group-card s-" + gr.state + (S.selected === gr.key ? " sel" : ""));
    g.setAttribute("transform", `translate(${p.x} ${p.y})`);
    g.dataset.name = gr.key; g.dataset.group = "1";
    focusable(g, `${gr.name}, group of ${gr.kids.length}, Space opens it`);
    const sq = S.groupSq[gr.key].map((q, i) => {
      const c = gr.kids[i], m = core.childMark(c);
      return `<g class="sq s-${m.state}${S.selected === c.name ? " sel" : ""}${c.superseded_by ? " sup" : ""}" data-sq="${esc(c.name)}" tabindex="0" role="button" aria-label="${esc(c.title)}, ${esc(m.label)}${reworkNote(c, ", ")}" transform="translate(${q.x} ${q.y})"><title>${esc(c.title)} | ${esc(c.name)} | ${esc(m.label)} | ${esc(core.fmt.usd(c.spend))}${reworkNote(c, " | ")}</title><rect class="fr" x="-2.5" y="-2.5" width="25" height="25" rx="5"/><rect width="20" height="20" rx="3"/><text x="10" y="15" text-anchor="middle">${m.glyph}</text></g>`;
    }).join("");
    const mark = core.stateMark(gr.state);
    const harn = gr.harness ? core.fmt.llm(gr.harness) : "";
    g.innerHTML = `<title>${esc(gr.name)}${harn ? " | " + esc(harn) : ""} | ${esc(gr.line)} | double-click to expand</title><rect width="${p.w}" height="${p.h}" rx="6"/><g clip-path="url(#card-clip)"><text class="nm" x="${TEXT.x}" y="${TEXT.name}">${esc(clipText(gr.name, CLIP.name))}</text>${harn ? `<text class="kd" x="${TEXT.x}" y="${TEXT.kind}">${esc(clipText(harn, CLIP.harness))}</text>` : ""}<text class="st" x="10" y="${gr.harness ? 47 : 34}">${esc(gr.lineTime)}</text><text class="st" x="10" y="${gr.harness ? 58 : 48}">${esc(gr.lineTokens)}</text></g><text class="gl" x="${BOX.w - GLYPH.right}" y="${GLYPH.top}" text-anchor="end">${mark.glyph}</text>${sq}<circle class="port in" cx="0" cy="30" r="5"/>`;
    wireSquares(g, gr);
    cards.appendChild(g);
  }
}
function wireSquares(g, gr) {
  g.addEventListener("pointerdown", (ev) => {
    ev.stopPropagation();
    const again = tapTwice(gr.key, ev);
    if (again) { toggleGroup(gr.key, again); return; }
    const q = ev.target.closest && ev.target.closest("g.sq");
    pick(q ? q.dataset.sq : gr.key);
  });
}

// The lines under the kind on a card. A node that never ran says so; a gate a dispatch runs says on how many children; a failed node names its cause.
function cardLines(ns, running) {
  if (ns.not_run) return `<text class="st" x="${TEXT.x}" y="${TEXT.line1}">not run</text>`;
  if (ns.via) return `<text class="st" x="${TEXT.x}" y="${TEXT.line1}">${esc(`checked ${ns.via.of} child${ns.via.of > 1 ? "ren" : ""} of ${ns.via.dispatch}`)}</text><text class="${ns.via.fail ? "bd-c" : "st"}" x="${TEXT.x}" y="${ns.via.fail ? TEXT.cause : TEXT.line2}">${esc(clipText(ns.via.fail ? `${ns.via.fail} failed · ${ns.via.pass} passed` : `${ns.via.pass} passed`, CLIP.cause))}</text>`;
  const live = running ? ns.live : null;   // a call in flight: how far the call itself says it has got
  const head = running ? runningHead(ns.running_for, live) + (ns.entries ? " · " + statLine(ns) : "") : statLine(ns);
  const top = `<text class="st" x="${TEXT.x}" y="${TEXT.line1}">${esc(head)}</text>`;
  if (live) return top + `<text class="st" x="${TEXT.x}" y="${TEXT.line2}">${esc(progressLine(live))}</text>`;
  if (ns.cause) return top + `<text class="bd-c" x="${TEXT.x}" y="${TEXT.cause}">${esc(clipText(ns.cause, CLIP.cause))}</text>`;
  return top + (tokenLine(ns) ? `<text class="st" x="${TEXT.x}" y="${TEXT.line2}">${esc(tokenLine(ns))}</text>` : "");
}

// The tooltip of a call in flight: what the record says about it, in place of the figures that need an outcome.
function runningTitle(ns) {
  const f = core.fmt, live = ns.live;
  return `running for ${f.seconds(ns.running_for)}`
    + (live ? ` · ${f.count(live.messages)} assistant messages · ${f.tokens(live.context_tokens)} context` + (live.tool ? ` · last tool ${live.tool}` : "") : "");
}

// The first line of a call in flight: how long it has run and how many assistant messages it has produced. `msg` is not
// the outcome's `turns` — one turn reaches the stream as two messages — so the two never share one label.
function runningHead(running_for, live) {
  return "▶ " + core.fmt.seconds(running_for) + (live ? " · " + core.fmt.count(live.messages) + " msg" : "");
}

// The second line of a call in flight: the context it last read and the last tool it used. A call that has reported no
// context keeps "—" for it, never 0.
function progressLine(live) {
  return `${core.fmt.tokens(live.context_tokens)} context${live.tool ? " · " + live.tool : ""}`;
}

function renderMap() {
  const cards = $("cards");
  cards.innerHTML = "";
  for (const n of nodesOf()) {
    const p = S.layout[n.name] || (S.layout[n.name] = { x: 20, y: 20 });
    const g = document.createElementNS(SVGNS, "g");
    const errs = errsFor(n.name).length, ov = overlayFor(n.name).length;
    const ns = S.stats && S.stats.nodes ? S.stats.nodes[n.name] : null;
    const oc = ns ? (ns.outcome || (ns.started ? "started" : null)) : null;
    const running = !!ns && core.isRunning(ns);
    const nmark = ns ? core.stateMark(core.nodeState(ns)) : null;   // a glyph on every node the record touched: color is never the only cue
    const sc = core.stateClass(ns);   // not-run, running, passed, failed, deadline, needs-human, started
    const km = core.kindMark(n.kind);   // the icon and the color of the kind: a gate and an agent differ by shape, not by text alone
    g.setAttribute("class", "card " + km.cls + (S.selected === n.name ? " sel" : "") + (errs ? " err" : "") + (sc ? " " + sc : ""));
    g.setAttribute("transform", `translate(${p.x} ${p.y})`);
    g.dataset.name = n.name;
    const label = core.nodeLabel(n);
    focusable(g, `${label}, ${nmark ? nmark.label : n.kind}`);   // the role label on the card; the raw name stays in the tooltip
    const name = clipText(label, NODE_CLIP.name);   // the glyph sits at the top-right corner; the icon sits left of the name
    const ml = core.nodeModel(n, ns);   // the LLM line (#677): the core decides it, the card only renders it
    const routed = ns && ns.routed && ns.routed !== "continue" ? " \u2192 " + ns.routed : "";   // the model line is never cut: the text is fitted below
    g.innerHTML = `<title>${esc(n.name)} | ${esc(ml.text)}${ns ? ` | ${running ? esc(runningTitle(ns)) : `${esc(oc || "no outcome")}, time ${core.fmt.seconds(ns.elapsed)}, cost ${core.fmt.usd(ns.spend)}, ${core.fmt.pct(ns.cap_pct)} of the call cap, turns ${core.fmt.count(ns.turns)}${tokenLine(ns) ? ", tokens " + tokenLine(ns) : ""}, entries ${ns.entries}${ns.cause ? ", " + esc(ns.cause) : ""}`}` : ""}</title><rect width="${BOX.w}" height="${BOX.h}" rx="6"/><g clip-path="url(#card-clip)"><rect class="kc" x="${KIND_CHIP.x}" y="${KIND_CHIP.y}" width="${KIND_CHIP.w}" height="${KIND_CHIP.w}" rx="3"/><text class="ki" x="${KIND_CHIP.x + KIND_CHIP.w / 2}" y="${KIND_CHIP.y + 12}" text-anchor="middle">${km.glyph}</text><text class="nm" x="${NODE_TEXT_X}" y="${TEXT.name}">${esc(name)}</text><text class="kd model" x="${TEXT.x - 2}" y="${TEXT.kind}">${esc(ml.text + routed)}</text>${ns ? cardLines(ns, running) : ""}</g>${errs ? `<text class="bd-e" x="${BOX.w - 8}" y="34" text-anchor="end">${errs} error${errs > 1 ? "s" : ""}</text>` : ""}${ov ? `<text class="bd-o" x="${BOX.w - 26}" y="19" text-anchor="end">${ov} adapted</text>` : ""}${nmark ? `<text class="gl" x="${BOX.w - GLYPH.right}" y="${GLYPH.top}" text-anchor="end">${nmark.glyph}</text>` : ""}${n.name === S.doc.root ? "" : `<circle class="port in" cx="0" cy="${BOX.h / 2}" r="5"/>`}${["loop", "each", "dispatch"].includes(n.kind) ? `<circle class="port out" cx="${BOX.w}" cy="${BOX.h / 2}" r="5"><title>Drag to another node to connect</title></circle>` : ""}`;
    g.addEventListener("pointerdown", (ev) => { if (ev.target.classList && ev.target.classList.contains("out")) startLink(ev, n.name); else startDrag(ev, n.name, g); });
    cards.appendChild(g);
  }
  renderChildren(cards);
  renderGroups(cards);
  fitModelLines(cards);
  $("edges").innerHTML = edgeLines();
  applyView();
}

// The model line is one line on the card, never cut. A model name wider than the card is set narrower (the text is squeezed, not
// shortened); a name that fits keeps its size. The measure needs the cards in the document, so it runs after they are drawn.
function fitModelLines(cards) {
  for (const t of cards.querySelectorAll("text.kd.model")) {
    if (t.getComputedTextLength() > MODEL_W) { t.setAttribute("textLength", MODEL_W); t.setAttribute("lengthAdjust", "spacingAndGlyphs"); }
  }
}

// A node that can call a model shows its tokens, a dash when the record has none. Another node shows the line only if the record has tokens for it.
function tokenLine(ns) {
  if (!ns.harness && ns.tokens_in === null && ns.tokens_out === null) return "";
  const f = core.fmt;
  return `${f.tokens(ns.tokens_in)} in \u00b7 ${f.tokens(ns.tokens_out)} out \u00b7 ${f.rate(ns.tps)}`;
}
// `ns.entries` is how many times this node has run an entry so far (a loop, a dispatch, or a retried
// gate runs more than once). Shown as `\u00d7N` on every node kind, so a node that ran five times does not read
// the same as one that ran once (found while checking the dashboard with the owner, 2026-10-01).
function statLine(ns) { return [core.fmt.seconds(ns.elapsed), core.fmt.usd(ns.spend), core.fmt.pct(ns.cap_pct), core.fmt.count(ns.turns) + (ns.turns === null ? "" : "t"), "\u00d7" + core.fmt.count(ns.entries)].join(" \u00b7 "); }

function startDrag(ev, name, g) {
  if (ev.button !== 0) return;
  ev.stopPropagation();
  // Two quick presses on one node without a drag: the rename field takes focus. The cards are rebuilt on every release, so a dblclick event would be lost.
  const again = core.isDoublePress(S.lastDown, name, ev.timeStamp);
  S.lastDown = { name, t: ev.timeStamp };
  const was = S.selected === name;   // a press on the selected node that is not a drag or a rename press clears the selection and closes the panel
  S.selected = name; S.link = null; S.dragging = true;
  const p = S.layout[name], sx = ev.clientX, sy = ev.clientY, ox = p.x, oy = p.y, k = S.view.k, before = snap();
  let moved = false;
  const move = (e) => { if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > DRAG_SLOP) moved = true; p.x = ox + (e.clientX - sx) / k; p.y = oy + (e.clientY - sy) / k; g.setAttribute("transform", `translate(${p.x} ${p.y})`); $("edges").innerHTML = edgeLines(); };
  const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); S.dragging = false; if (moved && (p.x !== ox || p.y !== oy)) track(before); if (!moved && was && !again) { S.selected = null; setSide(false, true); } render(); if (!moved && !was) revealSelected(); if (again && !moved) focusName(); };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}

// A link drag starts on an out port and ends on any node. The pure connect() decides; a refusal shows in the status line.
function toGraph(e) { const r = $("map").getBoundingClientRect(); return { x: (e.clientX - r.left - S.view.tx) / S.view.k, y: (e.clientY - r.top - S.view.ty) / S.view.k }; }
function cardAt(e) { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest ? el.closest(".card") : null; }
function startLink(ev, from) {
  if (ev.button !== 0) return;
  ev.stopPropagation(); ev.preventDefault();
  const p = S.layout[from];
  const rb = document.createElementNS(SVGNS, "line");
  rb.setAttribute("id", "rubber");
  S.dragging = true;
  rb.setAttribute("x1", p.x + BOX.w); rb.setAttribute("y1", p.y + BOX.h / 2);
  rb.setAttribute("x2", p.x + BOX.w); rb.setAttribute("y2", p.y + BOX.h / 2);
  $("vp").appendChild(rb);
  let over = null;
  const move = (e) => {
    const g = toGraph(e); rb.setAttribute("x2", g.x); rb.setAttribute("y2", g.y);
    const c = cardAt(e);
    if (over && over !== c) over.classList.remove("drop");
    over = c && c.dataset.name !== from ? c : null;
    if (over) over.classList.add("drop");
  };
  const up = (e) => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
    S.dragging = false;
    rb.remove();
    if (over) over.classList.remove("drop");
    const c = cardAt(e);
    if (c) connectNodes(from, c.dataset.name);
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}
$("edges").addEventListener("pointerdown", (ev) => {
  const g = ev.target.closest && ev.target.closest("g.edge");
  if (!g || ev.button !== 0) return;
  ev.stopPropagation();
  S.link = { from: g.dataset.from, to: g.dataset.to }; S.selected = null;
  render();
});

function startPan(ev) {
  if (ev.button !== 0) return;
  if (ev.target.closest && ev.target.closest(".card")) return;
  const sx = ev.clientX, sy = ev.clientY, v0 = S.view;
  let moved = false;
  $("map").classList.add("panning");
  const move = (e) => { moved = true; S.view = core.viewPanBy(v0, e.clientX - sx, e.clientY - sy); S.fitted = false; applyView(); };
  const up = () => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
    $("map").classList.remove("panning");
    if (!moved && (S.selected || S.link)) clearSelection();
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}
$("map").addEventListener("pointerdown", startPan);
$("map").addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = $("map").getBoundingClientRect();
  zoomBy(Math.exp(-e.deltaY * WHEEL_RATE), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
$("b-in").addEventListener("click", () => zoomBy(ZOOM_STEP));
$("b-out").addEventListener("click", () => zoomBy(1 / ZOOM_STEP));
$("b-fit").addEventListener("click", () => fit());
// A resize refits the graph only while the view is still the fitted one; a pan or a zoom keeps the owner's view.
window.addEventListener("resize", () => { if (S.fitted && S.doc) fit(); });


function fmt(v) { return v === null || v === undefined ? "unavailable" : typeof v === "object" ? JSON.stringify(v) : String(v); }

function renderOverlayRow(r) {
  const entry = (label, e) => `${label} entry: ${e ? `#${e.entry} ${esc(e.outcome)}, spend ${fmt(e.spend)}, turns ${fmt(e.turns)}, elapsed ${fmt(e.elapsed)}${e.reasons && e.reasons.length ? ", reasons " + esc(JSON.stringify(e.reasons)) : ""}` : "none"}`;
  const facts = (r.facts || []).map((f) => `${esc(f.name || JSON.stringify(f))}${f.value !== undefined ? "=" + esc(JSON.stringify(f.value)) : ""}${f.instrument ? ` (instrument: ${esc(f.instrument)}${f.source ? ", source: " + esc(f.source) : ""}${f.timestamp ? ", at " + esc(f.timestamp) : ""})` : ""}`);
  return `<div class="ro"><b>${esc(r.proposal_id)}</b>: ${esc(r.kind)} on ${esc(r.target)}: ${esc(JSON.stringify(r.old))} → ${esc(JSON.stringify(r.requested))}
<br>range checked: ${esc(JSON.stringify(r.range))}
<br>cited facts: ${facts.length ? facts.join("; ") : "none"}
<br>${entry("previous", r.previous)}<br>${entry("next", r.next)}
<br>delta: ${Object.entries(r.delta).map(([k, v]) => `${k} ${esc(fmt(v))}`).join(", ")}
<br><span class="note">instrument: ${esc(r.instrument)}<br>${esc(r.note)}</span></div>`;
}

// One failure, as the record has it: the code, what it names, and the tail of the output when the engine kept it.
function reasonHtml(r) {
  const ev = r.evidence === null ? `<div class="note">The record keeps no output for this failure.</div>` : `<pre class="ev">${esc(r.evidence)}</pre>`;
  return `<div class="cause"><b class="bad" title="${esc(r.detail || r.raw)}">${esc(r.code)}</b>${r.gate ? ` <span class="note">(${esc(r.gate)})</span>` : ""}${r.subject ? ` \u00b7 ${esc(r.subject)}` : ""}${ev}</div>`;
}
function failuresHtml(causes) {
  if (!causes || !causes.length) return "";
  const kind = { node: "", land: " landing", rejected: " request" };
  return `<h2>Failures</h2><div class="runbox">${causes.map((c) => `<div><b>${esc(c.node)}</b>${esc(kind[c.kind] || "")} \u00b7 ${esc(c.outcome)}${c.reasons.map(reasonHtml).join("")}</div>`).join("")}</div>`;
}
// The review of one child: its verdict and time, a live mark while it runs, and the findings of a child it held. Nothing when the dispatch names no review.
function childReviewHtml(c) {
  const r = c.review, f = core.fmt;
  if (!r) return "";
  const word = r.live ? `<b class="state-running" title="The review command is still running">running now</b>` : `<b${r.verdict === "approve" || r.verdict === "no_review" ? "" : ' class="bad"'}>${esc(r.verdict === "no_review" ? "no review here" : r.verdict || "none yet")}</b>`;
  const line = `${word} \u00b7 time <b>${f.seconds(r.elapsed)}</b>${r.live ? " so far" : ""} \u00b7 round${r.rounds > 1 ? "s" : ""} <b>${r.rounds}</b>${r.exit_code === null || r.live ? "" : ` \u00b7 exit <b>${esc(r.exit_code)}</b>`}`;
  const held = r.live ? "" : r.findings ? `<pre class="ev">${esc(r.findings)}</pre>` : emptyHtml("The review reported no findings.");
  return `<h2>Review</h2><div class="runbox">${line}${held}</div>`;
}
// The review gate of a dispatch, with the command and deadline it runs: read-only here, as a gate's thresholds are (ADR-0111).
function reviewGateHtml(n) {
  const g = n.kind === "dispatch" ? core.reviewGate(S.doc, n.name) : null;
  if (!g) return "";
  const f = core.fmt;
  return `<h2>Review gate</h2><div class="ro">gate: <b>${esc(g.gate)}</b><br>command: ${g.command === null ? "none: the gate is missing or has no argv" : `<code>${esc(g.command)}</code>`}<br>deadline: <b>${g.deadline === null ? f.count(null) : f.seconds(g.deadline)}</b><br><span class="note">Code runs it in each passed child's worktree after the checks and before the merge. Exit 0 merges; exit 3 means no review here and merges; any other exit or the deadline holds the child.</span></div>`;
}
function childHtml(c) {
  const f = core.fmt;
  const rows = c.rejected ? [`request rejected by code, so no child started`] : [
    `outcome <b>${esc(c.outcome || "none yet")}</b>${c.land ? ` \u00b7 landing <b>${esc(c.land.outcome)}</b>${c.land.head ? " " + esc(c.land.head.slice(0, 10)) : ""}` : ""}`,
    `model <b>${esc(f.llm(c.model))}</b> \u00b7 effort <b>${esc(c.effort === null ? f.count(null) : c.effort)}</b> \u00b7 workspace ${esc(c.workspace === null ? f.count(null) : c.workspace)}`,
    `time <b>${f.seconds(c.elapsed)}</b> \u00b7 cost <b>${f.usd(c.spend)}</b> \u00b7 turns <b>${f.count(c.turns)}</b>`,
    `tokens <b>${f.tokens(c.tokens_in)}</b> in \u00b7 <b>${f.tokens(c.tokens_out)}</b> out \u00b7 <b>${f.rate(c.tps)}</b>`,
    `checks ${c.checks ? Object.entries(c.checks).map(([g, v]) => `${esc(g)} <b>${esc(v)}</b>`).join(", ") || "none" : f.count(null)}`,
    c.after.length ? `runs after request${c.after.length > 1 ? "s" : ""} ${esc(c.after.join(", "))}` : "",
  ].filter(Boolean);
  const evid = c.evidence || {};
  const why = c.outcome === "fail" ? `<h2>Why it failed</h2><div class="runbox">${c.reasons.map((r) => reasonHtml({ ...core.reasonParts(r), evidence: evid[r] !== undefined ? evid[r] : null })).join("")}</div>` : "";
  return `<h2>Child ${esc(c.name)} <span class="note">(of ${esc(c.dispatch)}${c.proposer ? ", asked by " + esc(c.proposer) : ""})</span></h2><div class="runbox">${rows.join("<br>")}</div>${childReviewHtml(c)}${why}`;
}
// The roster of one dispatch's children: one row each. A click on a row selects that child.
function rosterHtml(dispatch) {
  const rows = core.childRoster(S.children, dispatch);
  if (!rows.length) return `<h2>Children of ${esc(dispatch)}</h2>${emptyHtml("This dispatch started no child, or the record names none for it yet.")}`;
  const body = rows.map((r) => `<tr data-child="${esc(r.name)}" class="s-${esc(r.state)}${S.selected === r.name ? " sel" : ""}" title="${esc(r.name)}"><td>${r.index}</td><td>${esc(r.label)}</td><td class="m" title="${esc(r.outcome)}${r.rework ? " · " + esc(r.rework) : ""}">${r.glyph}${r.rework ? " ↻" : ""}</td><td>${esc(core.fmt.llm(r.model))}</td><td>${esc(r.time)}</td><td>${esc(r.cost)}</td><td>${esc(r.turns)}</td></tr>`).join("");
  return `<h2>Children of ${esc(dispatch)} <span class="note">(${rows.length})</span></h2><table class="roster"><thead><tr><th>#</th><th>name</th><th title="outcome">out</th><th>model</th><th>time</th><th>cost</th><th>turns</th></tr></thead><tbody>${body}</tbody></table>`;
}
function groupHtml(gr) {
  return `<h2>Group ${esc(gr.name)}</h2><div class="runbox">${gr.harness ? esc(core.fmt.llm(gr.harness)) + "<br>" : ""}${esc(gr.line)}<br>cost <b>${core.fmt.usd(gr.cost)}</b><br><span class="note">Time, cost and tokens are sums over the children (children run side by side, so the time can exceed the run's). Double-click the card, or press Space on it, to show one card per child.</span></div>`;
}

// What the record says of one graph node: how it ended, and why when it failed.
function nodeRunHtml(name) {
  const ns = S.stats && S.stats.nodes ? S.stats.nodes[name] : null;
  if (!ns) return "";
  if (ns.not_run) return `<h2>Run result</h2><div class="runbox">not run: the record has no call for this node, and no dispatch checked it.</div>`;
  if (ns.via) return `<h2>Run result</h2><div class="runbox">checked ${ns.via.of} child${ns.via.of > 1 ? "ren" : ""} of <b>${esc(ns.via.dispatch)}</b>: <b>${ns.via.pass}</b> passed, <b>${ns.via.fail}</b> failed. A child that fails a check fails; see the child cards.</div>`;
  if (!ns.cause) return "";
  const ev = ns.evidence || {};
  return `<h2>Why it failed</h2><div class="runbox">${ns.reasons.map((r) => reasonHtml({ ...core.reasonParts(r), evidence: ev[r] !== undefined ? ev[r] : null })).join("")}</div>`;
}

// The available-vs-used harness of the selected node: derived from the record and the graph, never authored.
// A dispatch child's available harness is its resolved `definition`; its ceiling is the dispatch envelope's `allow` set
//. A plain agent declares its own. A gate or a loop carries none, said plainly, never an empty list.
const HARNESS_NONE = {
  gate: "A gate runs a deterministic check and carries no harness of its own.",
  loop: "A loop repeats its children and carries no harness of its own.",
  each: "An each fans its children out and carries no harness of its own.",
  action: "An action runs deterministic code and carries no harness of its own.",
  wait: "A wait pauses for a person and carries no harness of its own.",
  dispatch: "A dispatch carries no harness of its own: its children inherit its envelope. Select a child to see its available vs used.",
};
function harnessHtml(h) {
  if (!h) return "";
  const f = core.fmt;
  if (h.kind === "none") return `<h2>Available vs used</h2><div class="ro">${esc(HARNESS_NONE[h.nodeKind] || "This node carries no harness of its own.")}</div>`;
  const listText = (arr) => (arr === null ? f.count(null) : arr.length ? arr.join(", ") : "none");
  const capText = (v) => (v === null ? f.count(null) : typeof v === "object" ? `${v.min}–${v.max}` : String(v));
  const row = (label, a) => {
    const line = [
      a.skill ? `skill <b>${esc(a.skill)}</b>` : "",
      `model <b>${esc(f.llm(a.model))}</b>`,
      `effort <b>${esc(a.effort === null ? f.count(null) : a.effort)}</b>`,
      `tools ${esc(listText(a.tools))}`,
      `stall cap ${esc(capText(a.stalls))}`,
      `spend cap ${esc(capText(a.spend))}`,
      `deadline ${esc(f.seconds(a.deadline))}`,
    ].filter(Boolean).join(" · ");
    return `<div class="ro"><b>${label}</b> · ${line}</div>`;
  };
  const parts = [row("Available", h.available)];
  if (h.allow) {
    const a = h.allow;
    const line = [
      `allowed models ${esc(listText(a.models === null ? null : a.models.map((m) => f.llm(m))))}`,
      `allowed efforts ${esc(listText(a.efforts))}`,
      `allowed tools ${esc(listText(a.tools))}`,
      `allowed skills ${esc(listText(a.skills))}`,
      `stall cap ${esc(capText(a.stalls))}`,
      `spend cap ${esc(capText(a.spend))}`,
      `deadline ${esc(f.seconds(a.deadline))}`,
    ].join(" · ");
    parts.push(`<div class="ro note">Inherited from the <b>${esc(h.dispatch)}</b> envelope · ${line}</div>`);
  }
  const u = h.used;
  const usedLine = [
    u.skill ? `skill <b>${esc(u.skill)}</b>` : "",
    `model <b>${esc(f.llm(u.model))}</b>`,
    `effort <b>${esc(u.effort === null ? f.count(null) : u.effort)}</b>`,
    `turns <b>${f.count(u.turns)}</b>`,
    `tokens ${f.tokens(u.tokens_in)} in · ${f.tokens(u.tokens_out)} out`,
    `spend <b>${f.usd(u.spend)}</b>`,
    `elapsed <b>${f.seconds(u.elapsed)}</b>`,
  ].filter(Boolean).join(" · ");
  parts.push(`<div class="ro"><b>Used</b> · ${usedLine}</div>`);
  return `<h2>Available vs used</h2>${parts.join("")}`;
}

// --- pause and resume: the one write this page makes, to the run server's control route ---
// The page asks; the engine decides at its next node entry. It never starts a run: a paused run is continued by `squad resume`.
const CONTROL = { state: null };   // the server's control.json: what was asked, not what the engine did
async function loadControl() {
  if (!FROM_SERVER) return;
  try { const r = await fetch("run/control.json", { cache: "no-store" }); if (r.ok) CONTROL.state = await r.json(); } catch (e) { /* the server went away: the next request says so */ }
}
async function sendControl(action, nodes) {
  try {
    const r = await fetch("run/control", { method: "POST", headers: { "Content-Type": "application/json" }, body: core.controlBody(action, nodes) });
    if (!r.ok) { setStatus(r.status === 409 ? "The run has ended: there is nothing to pause or resume." : `The server refused the request (${r.status}).`, true); return; }
    await loadControl();
    setStatus(`${action === "pause" ? "Pause" : "Resume"} requested for ${nodes && nodes.length ? nodes.join(", ") : "the run"}. The run acts on it at its next node entry.`);
  } catch (e) { setStatus("The server did not answer: " + e.message, true); }
  render();
}
// The tasks the selection names: one node or child, or every child of a selected group. Empty when nothing is selected.
function controlTargets() {
  const gr = S.groups.find((x) => x.key === S.selected);
  if (gr) return { names: gr.kids.map((k) => k.name), label: `the ${gr.kids.length} children of ${gr.name}` };
  return S.selected ? { names: [S.selected], label: S.selected } : { names: [], label: "" };
}
function pauseBoxHtml() {
  if (!FROM_SERVER || !S.events) return "";
  const pv = core.pauseView(S.events);
  if (pv.state === "ended") return "";
  const c = CONTROL.state, asked = c && (c.whole || c.nodes.length) ? `<br>asked: ${c.whole ? "pause the whole run" : ""}${c.whole && c.nodes.length ? "; " : ""}${c.nodes.length ? "pause " + esc(c.nodes.join(", ")) : ""}${c.released.length ? "; release " + esc(c.released.join(", ")) : ""}` : "";
  const t = controlTargets(), act = pv.state === "paused" ? "resume" : "pause", word = act === "pause" ? "Pause" : "Resume";
  const btn = (names, text) => `<button data-ctl="${act}" data-nodes="${esc(JSON.stringify(names))}" title="${word} ${esc(text)}. The run acts on it at its next node entry.">${word} ${esc(text)}</button>`;
  const where = pv.state === "paused"
    ? `<b>Paused</b> at <b>${esc(pv.node)}</b>. Held: ${esc(pv.held.join(", "))}. Done: ${pv.completed.length ? esc(pv.completed.join(", ")) : "nothing yet"}.<br><span class="note">The page never starts a run. After the resume request, type <code>${esc(pv.resume)}</code> in a terminal.</span>`
    : `<span class="note">A pause holds a task before it starts. A call that is running finishes first.</span>`;
  return `<h2>Pause and resume</h2><div class="runbox">${where}${asked}<div class="row">${btn([], "the run")}${t.names.length ? " " + btn(t.names, t.label) : ""}</div></div>`;
}
function wireControl(side) {
  side.querySelectorAll("button[data-ctl]").forEach((b) => b.addEventListener("click", () => sendControl(b.dataset.ctl, JSON.parse(b.dataset.nodes))));
}

function renderRunPanel() {
  const st = S.stats, f = core.fmt, v = st.verdict;
  const cls = core.RUN_STATES.find((row) => row.state === st.state)?.cls || "msg-bad";
  const rp = S.replay, past = rp && !rp.at_end;
  const state = past ? `<span class="state-none">replay at event ${rp.cursor} of ${rp.last}</span> <span class="note">(${esc(st.state)})</span>` : `<span class="${cls}">${esc(st.state)}</span>`;
  const unres = rp && rp.unresolved.length ? `<br>unresolved children: ${rp.unresolved.map((c) => `<b>${esc(c.child)}</b> <span class="note">(${esc(c.parent === null ? "?" : c.parent)}, accepted at ${c.pos})</span>`).join(", ")}` : "";
  const lv = st.live, flight = lv ? lv.in_progress : [];
  const stale = st.state === "stalled";   // a silent run is the stalled state; the one staleness line names it
  const liveLines = !lv || v ? "" : `<br><span class="note${stale ? " stale" : ""}">last event <b>${f.seconds(lv.since_last)}</b> ago${stale ? " (stale)" : ""}</span>${flight.length ? "<br>in progress: " + flight.map((c) => `<b>${esc(c.node)}</b> ${f.seconds(c.since)}`).join(", ") : ""}`;
  const head = `run ${esc(st.run_id)} \u00b7 graph ${esc(st.graph_name)}<br>state: ${state}${v ? ` (exit ${esc(v.exit_code)}${v.reasons.length ? ", " + esc(core.causeSummary(v.reasons)) + " (see Failures)" : ""})` : ""}${liveLines}${unres}`;
  if (!st.totals) {
    const rows = st.timeline.map((t) => `<tr><td>${f.seconds(t.at)}</td><td>${esc(t.event)}</td><td>${esc(t.node === null ? "" : t.node)}</td><td>${esc(t.outcome === null ? "" : t.outcome)}</td></tr>`).join("");
    return `<h2>Run</h2><div class="runbox${stale ? " stale" : ""}">${head}<br><span class="note">Timeline and verdict only: ${S.doc ? "the record's graph hash differs from the loaded graph's" : "no graph is loaded"}.</span></div><h2>Timeline</h2><table class="tl">${rows}</table>`;
  }
  const t = st.totals, e = st.engine;
  const agents = nodesOf().filter((n) => st.nodes[n.name] && st.nodes[n.name].harness).map((n) => {
    const h = st.nodes[n.name].harness, c = h.configured, u = h.used;
    const model = u.model || c.model, effort = u.effort || c.effort;
    return `<b>${esc(n.name)}</b>: ${esc(f.llm(model))} \u00b7 ${esc(effort === null ? f.count(null) : effort)} \u00b7 tools ${esc(c.tools === null ? f.count(null) : c.tools.join(", "))}${u.model ? "" : ` <span class="note">(graph setting; the record has no model)</span>`}`;
  });
  const skillsLine = e.skills === null ? "unrecorded" : e.skills.length ? e.skills.map((k) => `<span title="${esc(k.name)} ${esc(k.hash)}">${esc(k.name)} ${esc(String(k.hash).slice(0, 8))}</span>`).join(", ") : "none";
  const commit = e.skills_commit === null ? "unrecorded" : `<span title="${esc(e.skills_commit)}">${esc(String(e.skills_commit).slice(0, 8))}</span>`;
  const list = (x) => x === null ? f.count(null) : esc(x.join(", "));
  return `<h2>Run</h2><div class="runbox${stale ? " stale" : ""}">${head}<br>time <b>${f.seconds(t.wall)}</b> \u00b7 cost <b>${f.usd(t.spend)}</b> of ${t.cap === null ? f.count(null) : "$" + t.cap} (${f.pct(t.cap_pct)}) \u00b7 turns <b>${f.count(t.turns)}</b><br>tokens <b>${f.tokens(t.tokens_in)}</b> in \u00b7 <b>${f.tokens(t.tokens_out)}</b> out \u00b7 <b>${f.rate(t.tps)}</b></div>${failuresHtml(st.causes)}
<h2>Harness</h2><div class="ro">${agents.length ? agents.join("<br>") : "no agent node ran"}<br><span class="note">Engine: permission ${esc(e.permission_mode === null ? f.count(null) : e.permission_mode)} \u00b7 sources ${list(e.setting_sources)} \u00b7 blocked tools ${list(e.disallowed_tools)} \u00b7 max output ${f.count(e.max_output_tokens)} \u00b7 context ${f.count(e.context_tokens)} \u00b7 auth ${esc(e.auth === null ? f.count(null) : e.auth)}<br>Skills: ${skillsLine} \u00b7 vendor commit ${commit}</span></div>`;
}

function renderSide() {
  const side = $("side");
  // A read in flight, or one that failed, paints its own state: the panel says it is reading rather than showing a blank
  // page, and a failed read says which file failed. The first read of the run holds the panel until it settles.
  const key = readKey("record", "graph");
  if (!S.doc && key) { paintRead(side, key, "run"); return; }
  if (!S.doc) { side.innerHTML = `<h2>Start</h2><p>Open a graph document, or load the five-phase example.</p><div class="row"><button data-start="open" title="Choose a graph file (a JSON graph document)">Open graph</button> <button data-start="example" title="Load the five-phase example graph">Load the five-phase example</button></div><p class="note">The graph file stays as authored. A run record is read-only. Layout lives in a sibling file and never moves the graph hash.</p>`; return; }
  const parts = [];
  const load = readHtml(key, "run");
  if (load) parts.push(load);   // a failed or slow read of the run says so next to the graph it does not stop
  if (inEdit() || S.errors.length) parts.push(`<h2>Graph</h2><div>${esc(S.doc.name || "(no name)")} · ${nodesOf().length ? `${nodesOf().length} node${nodesOf().length > 1 ? "s" : ""}` : "no node"} · ${S.errors.length ? `<span class="msg-bad">${S.errors.length} error${S.errors.length > 1 ? "s" : ""}</span>` : `<span class="msg-ok">valid</span>`}</div>`);
  const top = S.errors.filter((e) => !e.node);
  if (top.length) parts.push(`<h2>Errors on the graph</h2><ul class="errs">${top.map((e) => `<li>${esc(e.message)}</li>`).join("")}</ul>`);
  if (S.warnings.length) parts.push(`<h2>Links the last change broke</h2><ul class="errs">${S.warnings.map((w) => `<li>${esc(w.message)}</li>`).join("")}</ul>`);
  if (S.selected) {
    const o = cardOrder(), i = o.indexOf(S.selected);
    if (o.length > 1 && i >= 0) parts.unshift(`<div class="pnav"><button data-step="-1" title="previous card (←)"${i > 0 ? "" : " disabled"}>‹</button><span class="note">${i + 1} / ${o.length}</span><button data-step="1" title="next card (→)"${i < o.length - 1 ? "" : " disabled"}>›</button></div>`);
    const n = nodesOf().find((x) => x.name === S.selected), ch = S.children.find((x) => x.name === S.selected);
    const gr = S.groups.find((x) => x.key === S.selected);
    if (gr) { parts.push(groupHtml(gr)); parts.push(rosterHtml(gr.dispatch)); }
    if (ch) { parts.push(childHtml(ch)); parts.push(rosterHtml(ch.dispatch)); }
    if (n) {
      parts.push(`<h2>Node ${esc(n.name)} (${esc(n.kind)})</h2>`);
      parts.push(nodeRunHtml(n.name));
      const errs = errsFor(n.name), ns = S.stats && S.stats.nodes ? S.stats.nodes[n.name] : null;
      // "no error on this node" speaks of the graph's rules; it is left out where the record shows the node failed, so the panel never says both.
      if (errs.length) parts.push(`<ul class="errs">${errs.map((e) => `<li>${esc(e.message)}</li>`).join("")}</ul>`);
      else if (!(ns && ns.cause !== null && ns.cause !== undefined)) parts.push(`<div class="msg-ok">no error on this node</div>`);
      const unseen = core.unseenValues(n, SERVED);
      if (unseen.length) parts.push(`<div class="note">Not in the served snapshot (allowed, never blocked): ${esc(unseen.join(", "))}.</div>`);
      parts.push(reviewGateHtml(n));
      if (n.kind === "gate") parts.push(`<h2>Read-only: check and thresholds</h2><div class="ro">check: <b>${esc(n.check)}</b><br>params: ${esc(JSON.stringify(n.params))}</div>`);
      if (inEdit()) {
      const gates = Array.isArray(S.doc.gates) ? S.doc.gates : [];
      parts.push(`<h2>Rename and kind</h2><div class="row"><input id="n-name" value="${esc(n.name)}" spellcheck="false" title="The new name replaces the old one in every reference"> <button id="b-rename">Rename</button></div>`
        + (n.kind === "gate"
          ? `<div class="note">A gate keeps its kind: its check id and thresholds are read-only. Remove it and add the node you want.</div>`
          : `<div class="row"><select id="n-kind" title="The new kind; every field stays and the rules judge the result">${core.kindChoices(n.kind).map((c) => `<option${c.selected ? " selected" : ""}>${c.kind}</option>`).join("")}</select> <select id="n-check" title="Registered check for the gate" hidden>${gates.map((g) => `<option>${esc(g.id)}</option>`).join("")}</select> <button id="b-kind">Change kind</button></div>`)
        + `<div id="nk-msg"></div>`);
      parts.push(`<h2>Fields</h2>${core.fieldGroups(n).map((g) => fieldGroupHtml(n, g)).join("")}`);
      parts.push(`<details><summary>Edit the whole node as JSON</summary><textarea id="node-json" spellcheck="false">${esc(JSON.stringify(n, null, 2))}</textarea><div><button id="b-apply">Apply to node</button> <span id="apply-msg"></span></div></details>`);
      }
      const ov = overlayFor(n.name);
      if (ov.length) parts.push(`<h2>Run-only overlay</h2>${ov.map(renderOverlayRow).join("")}`);
    }
    if (S.replay && !gr && !(ch && ch.rejected)) parts.push(harnessHtml(core.nodeHarness(S.doc, S.replay.events, S.selected)));
  }
  if (S.stats) parts.push(renderRunPanel());
  parts.push(pauseBoxHtml());
  if (S.events) {
    const start = S.events[0];
    const counts = {};
    for (const e of S.events) counts[e.event] = (counts[e.event] || 0) + 1;
    const verdict = S.events.filter((e) => e.event === "verdict").pop();
    parts.push(`<details class="ref"><summary>Run record (read-only)</summary><div class="ro">run ${esc(start.run_id)} · graph ${esc(start.graph_name)} · ${S.events.length} events<br>${Object.entries(counts).map(([k, v]) => `${esc(k)} ${v}`).join(" · ")}<br>verdict: ${verdict ? esc(verdict.verdict) : "none yet"}</div></details>`);

// --- the inspector form: fields grouped by purpose; the core builds the groups and applies each edit ---
const groupOpen = {};
for (const k of ["models", "efforts", "skills"]) $("dl-" + k).innerHTML = SERVED[k].map((v) => `<option value="${esc(v)}">`).join("");
// A nested field (budget, next, adapt, when) is one row per part from the core; each part sits at a path in the field's object.
function partHtml(p, cur) {
  const v = p.path.split(".").reduce((o, k) => (o && typeof o === "object" ? o[k] : undefined), cur);
  const a = `data-part="${esc(p.path)}" data-input="${p.input}"`;
  let input;
  if (p.input === "select") input = `<select ${a}>${["", ...p.choices].map((c) => `<option value="${esc(c)}"${c === v ? " selected" : ""}>${esc(c) || "(not set)"}</option>`).join("")}</select>`;
  else if (p.input === "check") input = p.choices.map((c) => `<label><input type="checkbox" data-part="${esc(p.path)}" data-input="check" data-val="${esc(c)}"${Array.isArray(v) && v.includes(c) ? " checked" : ""}> ${esc(c)}</label>`).join(" ");
  else input = `<input ${a} type="${p.input === "num" || p.input === "int" ? "number" : "text"}"${p.input === "num" ? ` step="any"` : ""} value="${esc(p.input === "list" && Array.isArray(v) ? v.join(", ") : v === undefined ? "" : String(v))}" spellcheck="false">`;
  return `<div class="fld"><label>${esc(p.label)}</label><div>${input}</div></div>`;
}
function structuredHtml(f) {
  const cur = f.value ? JSON.parse(f.value) : {};
  return `<div class="fld"><label>${esc(f.key)}${f.present ? "" : " · unset"}</label><div class="struct" data-struct="${esc(f.key)}">${f.parts.map((p) => partHtml(p, cur)).join("")}</div></div>`;
}
// The field's JSON from its parts; blank parts are left out, and no part set gives "" (the field is removed).
function structuredText(box) {
  const out = {}, checks = {};
  const set = (path, val) => { const ks = path.split("."), last = ks.pop(); let o = out; for (const k of ks) o = o[k] = o[k] || {}; o[last] = val; };
  const anyValue = (t) => (t === "true" ? true : t === "false" ? false : Number.isFinite(Number(t)) ? Number(t) : t);
  for (const el of box.querySelectorAll("[data-part]")) {
    const path = el.dataset.part, kind = el.dataset.input;
    if (kind === "check") { if (el.checked) (checks[path] = checks[path] || []).push(el.dataset.val); continue; }
    const t = el.value.trim();
    if (t === "") continue;
    set(path, kind === "num" || kind === "int" ? Number(t) : kind === "list" ? t.split(",").map((x) => x.trim()).filter(Boolean) : kind === "any" ? anyValue(t) : t);
  }
  for (const [path, vals] of Object.entries(checks)) set(path, vals);
  return Object.keys(out).length ? JSON.stringify(out) : "";
}
function fieldHtml(f) {
  if (f.type === "structured") return structuredHtml(f);
  const id = "f-" + f.key, dis = f.readonly ? " disabled" : "", a = `id="${id}" data-key="${esc(f.key)}"${dis}`;
  let input;
  if (f.type === "area") input = `<textarea ${a} rows="6" spellcheck="false">${esc(f.value)}</textarea><div class="note"><span id="ic">${[...f.value].length}</span> characters</div>`;
  else if (f.type === "json") input = `<textarea ${a} rows="${Math.min(8, Math.max(2, f.value.split("\n").length))}" spellcheck="false" placeholder="JSON">${esc(f.value)}</textarea>`;
  else if (f.type === "bool") input = `<select ${a}>${["", "true", "false"].map((v) => `<option value="${v}"${v === f.value ? " selected" : ""}>${v || "(not set)"}</option>`).join("")}</select>`;
  else if (f.type === "enum") input = `<select ${a}>${["", ...f.enum, ...(f.value && !f.enum.includes(f.value) ? [f.value] : [])].map((v) => `<option value="${esc(v)}"${v === f.value ? " selected" : ""}>${esc(v) || "(not set)"}</option>`).join("")}</select>`;
  else input = `<input ${a} value="${esc(f.value)}" spellcheck="false"${f.suggest && f.type === "text" ? ` list="dl-${f.suggest}"` : ""}${f.type === "list" ? ` placeholder="comma separated"` : ""}>`;
  const chips = f.suggest && f.type === "list" && !f.readonly ? `<div class="chips">${SERVED[f.suggest].map((v) => `<button type="button" data-chip="${esc(f.key)}" data-val="${esc(v)}">${esc(v)}</button>`).join("")}</div>` : "";
  const rm = f.unknown ? `<div class="chips"><button type="button" data-remove="${esc(f.key)}">Remove this field</button></div>` : "";
  return `<div class="fld${f.unknown ? " unk" : ""}"><label for="${id}">${esc(f.key)}${f.readonly ? " (read-only)" : ""}${f.present ? "" : " \u00b7 unset"}</label><div>${input}</div>${chips}${rm}</div>`;
}
function fieldGroupHtml(n, g) {
  const key = n.kind + ":" + g.id, open = key in groupOpen ? groupOpen[key] : g.open;
  return `<details data-group="${key}"${open ? " open" : ""}><summary>${esc(g.title)}</summary>${g.fields.map(fieldHtml).join("")}</details>`;
}
// The node name is the one the form was drawn for. A field's change event fires when the owner clicks another node, after the selection moved.
async function setFieldFrom(name, key, text) {

function wireFields() {

async function addNode(kind, at) {
  if (!S.doc || !Array.isArray(S.doc.nodes)) return;
  const before = snap();
  const sel = nodesOf().find((n) => n.name === S.selected);
  const opts = {};
  if (sel && ["loop", "each"].includes(sel.kind)) opts.parent = sel.name;
  if (kind === "gate" && $("s-check").value) opts.check = $("s-check").value;
  const r = core.addNode(S.doc, kind, opts);
  if (r.error) { setStatus(r.error, true); return; }

  const owner = r.doc.nodes.find((n) => Array.isArray(n.children) && n.children.includes(r.name));
